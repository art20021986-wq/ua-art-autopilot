name: TASK073 Gate B V2 (manual, owner-approved production install)

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact owner approval token"
        required: true
        type: string

permissions:
  contents: read

jobs:
  gate-b-v2:
    runs-on: ubuntu-latest
    environment: production-write
    steps:
      - name: Verify exact approval token before any secret is loaded
        run: |
          if [ "${{ github.event.inputs.approval }}" != "CRM-UNIFIED-CATALOG-001-V1.0-APPROVED" ]; then
            echo "Approval token mismatch. Refusing before secrets/write." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile all TASK 073 python files
        run: |
          python -m py_compile $(find cloud/task_073 -name "*.py")

      - name: Run offline unit tests
        run: |
          python -m unittest discover -s cloud/task_073/tests -p "test_*.py" -v

      - name: Require production entrypoint configuration before any write
        env:
          PA_DOMAIN: ${{ vars.TASK073_PA_DOMAIN }}
          PA_REMOTE_DIR: ${{ vars.TASK073_PA_REMOTE_DIR }}
        run: |
          if [ -z "$PA_DOMAIN" ] || [ -z "$PA_REMOTE_DIR" ]; then
            echo "TASK073_PA_DOMAIN / TASK073_PA_REMOTE_DIR repository variables are not configured." >&2
            echo "Gate B V2 refuses to run against production without the exact verified live paths." >&2
            echo "Configure these using the paths already verified in cloud/task_069 / cloud/task_072 Gate B runs, then re-dispatch." >&2
            exit 1
          fi
          echo "Production entrypoint configuration present; proceeding is the responsibility of the Codex-authored production runner that wires gate_b_controller_v2.GateBController to pythonanywhere_write_client.PythonAnywhereWriteClient using these exact paths."

      - name: Execute Gate B (real production write, exclusive window)
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PA_DOMAIN: ${{ vars.TASK073_PA_DOMAIN }}
          PA_REMOTE_DIR: ${{ vars.TASK073_PA_REMOTE_DIR }}
          GATE_B_APPROVAL_TOKEN: ${{ github.event.inputs.approval }}
        run: |
          if [ -f cloud/task_073/tools/gate_b_production_entrypoint.py ]; then
            python cloud/task_073/tools/gate_b_production_entrypoint.py
          else
            echo "cloud/task_073/tools/gate_b_production_entrypoint.py is not present in this branch." >&2
            echo "This step fails closed by design: no production write occurs without a real, reviewed entrypoint that reuses the verified cloud/task_069 and cloud/task_072 Gate B API session handling." >&2
            exit 1
          fi
