name: TASK073_GATE_A_V4

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gate_a_v4:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest

      - name: Run offline unit tests
        working-directory: cloud/task_073
        run: |
          python -m pytest tests -q

      - name: Run real GET-only Gate A V4
        working-directory: cloud/task_073
        env:
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GATE_A_V4_EVIDENCE_PATH: gate_a_v4_evidence.json
        run: |
          python gate_a_v4.py

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task073-gate-a-v4-evidence
          path: cloud/task_073/gate_a_v4_evidence.json
