name: TASK121 Single Korea Button (owner-approved one-shot)

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/task121_korea_button_manual.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.repository == 'art20021986-wq/ua-art-autopilot' &&
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      UAART_REQUEST_SHA256: 18c2ab1a55171c92564c1ce014aa404da876693c1c31203fe447c2036cdab58c
      UAART_APPROVAL_SHA256: 461f1b9a99863d359e0fe84014e96e99e312dc0a49c8e6052e57ac77403a2b9f
      UAART_HALT_SHA256: 35c8f42ec20d33f259cbf87aaaa193c86c4d5ae469fa4a8e67e6d049ce0091e9
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Bind the one-shot run identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_RUN_ATTEMPT" = 1
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          echo "UAART_RUN_NONCE=task121-${GITHUB_RUN_ID}-${GITHUB_SHA:0:12}" >> "$GITHUB_ENV"

      - name: Verify immutable owner scope and package hashes
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum tasks/requests/TASK121-KOREA-BUTTON.json | cut -d' ' -f1)" = "$UAART_REQUEST_SHA256"
          test "$(sha256sum tasks/approvals/TASK121-KOREA-BUTTON.json | cut -d' ' -f1)" = "$UAART_APPROVAL_SHA256"
          test "$(sha256sum state/AUTOPILOT_HALT.json | cut -d' ' -f1)" = "$UAART_HALT_SHA256"
          test "$(sha256sum cloud/task121_korea_button_manual/patcher.py | cut -d' ' -f1)" = 96900bafe8bf2a32ce52f1000fdb7b7926d5117158ac03a34f1d8228fc40874b
          test "$(sha256sum cloud/task121_korea_button_manual/remote_installer.py | cut -d' ' -f1)" = e4aede8d5fe87e85cf62fe57e9aa3f8bf9904000fbc29cfdd6c3c43463c9532d
          test "$(sha256sum cloud/task121_korea_button_manual/controller.py | cut -d' ' -f1)" = 97fccd409b3a4255adb8ec8f680d56619c2214480c36f5db20e45d0f86c4863f
          test "$(sha256sum cloud/task121_korea_button_manual/test_contract.py | cut -d' ' -f1)" = 59854c2da7959858849c5e0c763047e93c43ce58d09cccdbc5680c049aaa1bd0

      - name: Run offline contract and rollback tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile cloud/task121_korea_button_manual/*.py
          python3 -m unittest -v cloud/task121_korea_button_manual/test_contract.py

      - name: Gate A — authenticated GET-only live proof
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud/task121_korea_button_manual/controller.py --mode probe
          python3 - <<'PY'
          import json
          value = json.load(open('cloud/task121_korea_button_manual/gate_a.json', encoding='utf-8'))
          assert value['status'] == 'PASS'
          assert value['mode'] == 'GET_ONLY'
          assert value['production_touched'] is False
          assert value['proof']['button_label'] == 'В Корее'
          assert value['proof']['button_count_added'] == 1
          assert value['proof']['hidden_codes'] == ['sea_loaded', 'sea_transit', 'ua_handed']
          PY

      - name: Gate B — backup, exact install, restart and live verify
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud/task121_korea_button_manual/controller.py --mode apply
          python3 - <<'PY'
          import json
          value = json.load(open('state/receipts/TASK121-KOREA-BUTTON.json', encoding='utf-8'))
          assert value['status'] == 'FINISHED'
          assert value['production'] == 'PASS'
          assert value['button'] == {'code': 'kr_bought', 'count': 1, 'label': 'В Корее'}
          assert value['button_working'] is True
          assert value['hidden_codes'] == ['sea_loaded', 'sea_transit', 'ua_handed']
          assert value['other_removed_buttons_restored'] is False
          assert value['global_halt_preserved'] is True
          assert value['unexpected_changes'] == 0
          PY

      - name: Emergency rollback for this exact run
        if: failure()
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud/task121_korea_button_manual/controller.py --mode rollback

      - name: Persist sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name ua-art-task121-bot
          git config user.email ua-art-task121-bot@users.noreply.github.com
          for path in \
            cloud/task121_korea_button_manual/gate_a.json \
            cloud/task121_korea_button_manual/evidence.json \
            cloud/task121_korea_button_manual/emergency_rollback.json \
            state/receipts/TASK121-KOREA-BUTTON.json
          do
            if test -f "$path"; then
              git add "$path"
            fi
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "task121: persist Korea button production evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload sanitized evidence artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task121-korea-button-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            cloud/task121_korea_button_manual/gate_a.json
            cloud/task121_korea_button_manual/evidence.json
            cloud/task121_korea_button_manual/emergency_rollback.json
            state/receipts/TASK121-KOREA-BUTTON.json
