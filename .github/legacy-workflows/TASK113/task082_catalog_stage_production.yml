name: task082-superseded-fail-closed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blocked:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
      - name: Refuse superseded ferry repair
        run: |
          python3 - <<'PY'
          from pathlib import Path
          task = Path('tasks/task_084.md').read_text(encoding='utf-8')
          if 'заменяет TASK 082' not in task or 'В Корее' not in task:
              raise SystemExit('TASK084_SUPERSESSION_CONTRACT_MISSING')
          raise SystemExit('TASK082_SUPERSEDED_BY_TASK084_NO_PRODUCTION')
          PY
