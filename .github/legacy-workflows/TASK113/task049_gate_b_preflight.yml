name: task049-gate-b-readonly-preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task049_gate_b_preflight.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task049-gate-b-readonly-preflight
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile and run complete logistics suite
        run: |
          python3 -m py_compile cloud/bot_logistics/*.py
          python3 -m unittest discover -v -s cloud/bot_logistics -p 'test*.py'

      - name: Read exact Gate B prerequisites
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: Carix
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
        run: python3 cloud/bot_logistics/task049_gate_b_preflight.py

      - name: Commit only sanitized preflight evidence
        run: |
          test -f cloud/bot_logistics/evidence/task_049_gate_b_preflight.json
          git add -- cloud/bot_logistics/evidence/task_049_gate_b_preflight.json
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 1 ] || \
             [ "${staged[0]}" != "cloud/bot_logistics/evidence/task_049_gate_b_preflight.json" ]; then
            echo 'Unexpected preflight relay paths'
            exit 1
          fi
          git config user.name 'task049-gate-b-preflight'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_049: relay Gate B read-only preflight'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit 1
