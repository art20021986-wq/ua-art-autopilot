name: Claude Autopilot TASK094

on:
  push:
    branches: [main]
    paths:
      - 'tasks/task_094.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-autopilot
  cancel-in-progress: false

jobs:
  run-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm exact latest task
        run: |
          test -f tasks/task_094.md
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tasks/task_094.md').read_text(encoding='utf-8')
          required = [
              'UA-WEB-DESIGN-ROLLBACK-035 v1.0',
              'OWNER_APPROVED_PRODUCTION',
              'PREVIOUS APPROVED WEB DESIGN',
              '13 / 3 / 1 / 7 / 2',
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit('TASK094_AUTH_MISSING:' + ','.join(missing))
          print('TASK094_AUTH_PASS')
          PY
      - name: Run autonomous Claude worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_TOTAL_BUDGET_SECONDS: '1500'
          ANTHROPIC_NETWORK_ATTEMPTS: '4'
          ANTHROPIC_MAX_TOKENS: '128000'
          ANTHROPIC_STREAM_IDLE_TIMEOUT_SECONDS: '120'
        run: python3 automation/claude_worker.py
      - name: Commit Claude outputs
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No cloud changes'
            exit 0
          fi
          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task094: Claude prepare approved design restoration'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              for path in "${conflicts[@]}"; do
                case "${path}" in
                  cloud/latest_status.md|cloud/owner_reply.md)
                    git checkout --theirs -- "${path}"
                    git add -- "${path}"
                    ;;
                  *)
                    echo "Unsafe conflict: ${path}"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
