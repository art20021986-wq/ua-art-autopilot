name: task071-current-crm-call-path-read

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task071_call_path_read.yml'
      - 'cloud/task_071/read_call_path.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task071-current-crm-call-path-read
  cancel-in-progress: false

jobs:
  read-only-call-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile GET-only probe
        run: python3 -m py_compile cloud/task_071/read_call_path.py
      - name: Capture current save call path
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_071/read_call_path.py
      - name: Enforce read-only evidence
        run: |
          python3 - <<'PY'
          import json
          p = 'cloud/task_071/evidence/call_path.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['mode'] == 'READ_ONLY_CURRENT_CALL_PATH'
          assert d['remote_http_methods'] == ['GET']
          assert d['production_touched'] is False
          assert d['crm_db_write'] is False
          for name in ('db.py', 'cars_ui.py', 'trace_zhurnal.py'):
              assert d['sources'][name]['definitions']
          print('TASK071_CALL_PATH_EVIDENCE_PASS')
          PY
      - name: Commit bounded redacted evidence
        run: |
          git add -- cloud/task_071/evidence/call_path.json
          if git diff --cached --quiet; then
            echo 'Evidence unchanged'
            exit 0
          fi
          git config user.name 'task071-call-path-read'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_071: record current CRM save call path'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          exit 1
