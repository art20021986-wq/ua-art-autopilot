name: TASK104 Self-Recovery Sandbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task104_self_recovery_sandbox.yml'
      - 'automation/task104_self_recovery_core.py'
      - 'automation/task104_self_recovery_suite.py'
      - 'cloud/task104_self_recovery/AUDIT_DESIGN.md'
      - 'tasks/task104_self_recovery_approval.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task104-self-recovery-sandbox
  cancel-in-progress: false

jobs:
  audit-design-failure-injection-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify owner approval and production deny
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^OWNER_APPROVED: YES$' tasks/task104_self_recovery_approval.md
          grep -q '^PARALLEL_EXECUTION_AUTHORIZED: YES$' tasks/task104_self_recovery_approval.md
          grep -q '^TASK096_V8_INTERRUPT_AUTHORIZED: NO$' tasks/task104_self_recovery_approval.md
          grep -q '^PRODUCTION_RECOVERY_CORE_AUTHORIZED: NO$' tasks/task104_self_recovery_approval.md
          grep -q '^AUTONOMOUS_CANARY_REQUIRED: 10/10$' tasks/task104_self_recovery_approval.md
          python -m py_compile automation/task104_self_recovery_core.py automation/task104_self_recovery_suite.py
      - name: Run failure injection and 10 autonomous canaries
        env:
          PYTHONPATH: automation
        run: python -u automation/task104_self_recovery_suite.py
      - name: Require TASK104 sandbox acceptance
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          p=pathlib.Path('cloud/task104_self_recovery/state/task104_report.json')
          r=json.loads(p.read_text())
          assert r.get('status') == 'PASS', r
          assert (r.get('autonomous_canary') or {}).get('passed') == 10
          assert (r.get('autonomous_canary') or {}).get('total') == 10
          assert not (r.get('failure_injection') or {}).get('failed')
          assert r.get('owner_manual_push_required') is False
          assert r.get('production_recovery_core_authorized') is False
          for key in ('production_touched','live_crm_write','site_write','bot_write','card_write','media_write','task096_v8_touched'):
              assert r.get(key) is False, (key,r.get(key))
          print('TASK104_SANDBOX_ACCEPTANCE_PASS')
          PY
      - name: Upload TASK104 report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task104-self-recovery-${{ github.run_id }}
          path: |
            cloud/task104_self_recovery/AUDIT_DESIGN.md
            cloud/task104_self_recovery/state/task104_report.json
          if-no-files-found: error
          retention-days: 30
