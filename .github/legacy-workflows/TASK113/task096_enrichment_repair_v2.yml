name: TASK096 Enrichment Repair v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task096_enrichment_repair_v2.yml'
      - 'automation/task096_enrichment_repair_v2.py'
      - 'cloud/task_096_tech_spec_ai_crm/data_enrichment/remote_semantic_cleanup.py'
      - 'tasks/task096_autorun_orchestrator_v1_approval.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task096-autorun
  cancel-in-progress: false

jobs:
  sandbox-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify owner approval and hard production lock
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^OWNER_APPROVED: YES$' tasks/task096_autorun_orchestrator_v1_approval.md
          grep -q '^MAX_RECOVERY_ATTEMPTS: 10$' tasks/task096_autorun_orchestrator_v1_approval.md
          grep -q '^PRODUCTION_AUTHORIZED: NO$' tasks/task096_autorun_orchestrator_v1_approval.md
          grep -q '^LIVE_CRM_WRITE_AUTHORIZED: NO$' tasks/task096_autorun_orchestrator_v1_approval.md
          grep -q '^BOT_WRITE_AUTHORIZED: NO$' tasks/task096_autorun_orchestrator_v1_approval.md
          grep -q '^SITE_WRITE_AUTHORIZED: NO$' tasks/task096_autorun_orchestrator_v1_approval.md
          python -m py_compile automation/task096_enrichment_repair_v2.py cloud/task_096_tech_spec_ai_crm/data_enrichment/remote_semantic_cleanup.py

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.15.0

      - name: Run real source expansion and semantic dedup in sandbox
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=automation python -u automation/task096_enrichment_repair_v2.py

      - name: Require sandbox evidence and 16-card processing
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloud/task_096_tech_spec_ai_crm/data_enrichment')
          e=json.loads((root/'evidence.json').read_text())
          s=json.loads((root/'cards_summary.json').read_text())
          assert e.get('semantic_dedup_pass') is True, e
          assert e.get('production_touched') is False
          assert e.get('live_crm_write') is False
          assert e.get('public_path_write') is False
          assert e.get('purchase_price_extracted') is False
          ids=sorted(set((e.get('batch') or {}).get('processed_uids') or []))
          assert ids == [f'UA-{n:04d}' for n in range(1,17)], ids
          cards=s.get('cards') or []
          assert len(cards)==16, len(cards)
          print('TASK096_REPAIR_V2_SANDBOX_PASS')
          print('ENRICHED_CARDS', sum(1 for c in cards if int(c.get('facts_accepted') or 0)>0))
          PY

      - name: Upload sandbox evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task096-enrichment-repair-v2-${{ github.run_id }}
          path: |
            cloud/task_096_tech_spec_ai_crm/data_enrichment/evidence.json
            cloud/task_096_tech_spec_ai_crm/data_enrichment/cards_summary.json
            cloud/task_096_tech_spec_ai_crm/data_enrichment/report.md
            cloud/task_096_tech_spec_ai_crm/data_enrichment/ua0015_preview.html
          if-no-files-found: error
          retention-days: 14
