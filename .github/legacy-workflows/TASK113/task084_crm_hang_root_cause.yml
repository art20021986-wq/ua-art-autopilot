name: task084-crm-hang-root-cause-live-audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task084_crm_hang_root_cause.yml'
      - 'cloud/task_084_crm_hang_root_cause/live_audit.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task084-crm-hang-root-cause-live-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile GET-only audit
        run: python3 -W error -m py_compile cloud/task_084_crm_hang_root_cause/live_audit.py

      - name: Audit live hang and duplicate-start causes
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_084_crm_hang_root_cause/live_audit.py

      - name: Commit bounded evidence
        if: always()
        run: |
          path=cloud/task_084_crm_hang_root_cause/evidence/live_audit.json
          test -f "$path"
          git add -- "$path"
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'task084-crm-hang-audit'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task084: record live CRM hang root cause'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep $((attempt * 3))
          done

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task084-crm-hang-audit-${{ github.run_id }}
          path: cloud/task_084_crm_hang_root_cause/evidence/live_audit.json
          if-no-files-found: error
          retention-days: 14
