name: TASK073_GATE_B_V5

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Exact recorded owner approval token"
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ua-art-production-crm
  cancel-in-progress: false

jobs:
  gate_b_v5:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact approval before secrets or writes
        env:
          APPROVAL_INPUT: ${{ github.event.inputs.approval }}
        run: |
          test "$APPROVAL_INPUT" = "CRM-UNIFIED-CATALOG-001-V1.0-APPROVED"

      - name: Checkout exact main
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and run exact live-definition fixtures
        working-directory: cloud/task_073
        run: |
          python -m py_compile patcher_v5.py gate_a_v5.py gate_b_installer_v5.py gate_b_postcheck_v5.py gate_b_controller_v5.py
          python -c "import sys; sys.path.insert(0, 'tests'); import test_patcher_v5 as t; t.test_function_hashes_match_live_evidence(); t.test_exact_transforms_compile_and_keep_handler_contracts(); print('TASK073_V5_FIXTURES_PASS')"

      - name: Re-run live GET-only Gate A immediately before Gate B
        working-directory: cloud/task_073
        env:
          PYTHONANYWHERE_USERNAME: ${{ secrets.PYTHONANYWHERE_USERNAME }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python gate_a_v5.py

      - name: Run approved production controller
        working-directory: cloud/task_073
        env:
          TASK073_OWNER_APPROVAL: ${{ github.event.inputs.approval }}
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python gate_b_controller_v5.py

      - name: Upload bounded Gate B evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task073-gate-b-v5-evidence
          path: |
            cloud/task_073/evidence/gate_a_v5.json
            cloud/task_073/evidence/gate_b_v5.json
            cloud/task_073/GATE_B_V5_REPORT.md
          if-no-files-found: warn
