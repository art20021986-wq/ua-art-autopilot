name: TASK092 ANTHROPIC LIMIT RESET AUTOSTART

on:
  schedule:
    # Anthropic reported access reset at 2026-09-01 00:00 UTC.
    # Retry every 10 minutes for a bounded 90-minute recovery window.
    - cron: '5,15,25,35,45,55 0 1 9 *'
    - cron: '5,15,25 1 1 9 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: task092-claude-autostart
  cancel-in-progress: false

jobs:
  run-task092-after-anthropic-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate exact TASK 092 and reset window
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import os
          import pathlib
          import re

          root = pathlib.Path('.')
          tasks = list((root / 'tasks').glob('task_*.md'))

          def task_key(path):
              match = re.fullmatch(r'task_(\d+)(.*)\.md', path.name)
              if not match:
                  return (-1, 0, path.name)
              return (int(match.group(1)), 1 if match.group(2) == '' else 0, path.name)

          latest = max(tasks, key=task_key) if tasks else None
          now = dt.datetime.now(dt.timezone.utc)
          start = dt.datetime(2026, 9, 1, 0, 0, tzinfo=dt.timezone.utc)
          deadline = dt.datetime(2026, 9, 1, 1, 30, tzinfo=dt.timezone.utc)
          should_run = True
          reason = 'READY'

          if latest is None or latest.name != 'task_092.md':
              should_run = False
              reason = 'TASK_092_NOT_LATEST'
          elif now < start:
              should_run = False
              reason = 'RESET_WINDOW_NOT_STARTED'
          elif now > deadline:
              should_run = False
              reason = 'RESET_WINDOW_ENDED'
          else:
              status_path = root / 'cloud' / 'latest_status.md'
              if status_path.exists():
                  text = status_path.read_text(encoding='utf-8', errors='replace')
                  task_match = re.search(r'^TASK_ID:\s*(\S+)', text, re.M)
                  status_match = re.search(r'^CLAUDE_STATUS:\s*(\S+)', text, re.M)
                  if (task_match and task_match.group(1) == 'task_092'
                          and status_match
                          and status_match.group(1).upper() in {'DONE', 'BLOCKED', 'WAITING_OWNER'}):
                      should_run = False
                      reason = 'TASK_092_ALREADY_RETURNED_' + status_match.group(1).upper()

          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as fh:
              fh.write('should_run=%s\n' % ('true' if should_run else 'false'))
              fh.write('reason=%s\n' % reason)
          print('TASK092_RESET_GATE should_run=%s reason=%s latest=%s now=%s' % (
              should_run, reason, latest.name if latest else 'NONE', now.isoformat()))
          PY

      - name: Run autonomous Claude worker for TASK 092
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_TOTAL_BUDGET_SECONDS: '1500'
          ANTHROPIC_NETWORK_ATTEMPTS: '4'
          ANTHROPIC_MAX_TOKENS: '128000'
          ANTHROPIC_STREAM_IDLE_TIMEOUT_SECONDS: '120'
        run: python3 automation/claude_worker.py

      - name: Commit TASK 092 Claude outputs
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No Claude output changes'
            exit 1
          fi
          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Claude autopilot: process TASK 092 after Anthropic reset'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 0 ]; then
                git rebase --abort || true
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "${path}" in
                  cloud/latest_status.md|cloud/owner_reply.md) ;;
                  *)
                    echo "Unsafe rebase conflict: ${path}"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done
              for path in "${conflicts[@]}"; do
                git checkout --theirs -- "${path}"
                git add -- "${path}"
              done
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Report skipped state
        if: steps.gate.outputs.should_run != 'true'
        run: echo "TASK 092 reset worker skipped — ${{ steps.gate.outputs.reason }}"
