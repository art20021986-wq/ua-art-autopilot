name: TASK099 Remote Read Only Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task099_remote_state_probe.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture bounded PythonAnywhere task state
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          import json
          import os
          import pathlib
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://www.pythonanywhere.com/api/v0/user/Carix/"
          token = (os.environ.get("PYTHONANYWHERE_API_TOKEN") or "").strip()
          if not token:
              raise SystemExit("PYTHONANYWHERE_API_TOKEN missing")

          def get(url, allowed=(200, 404)):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": "Token " + token,
                      "User-Agent": "ua-art-task099-read-only-probe/1",
                  },
                  method="GET",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return int(response.status), response.read(2_000_001)
              except urllib.error.HTTPError as exc:
                  if int(exc.code) not in allowed:
                      raise
                  return int(exc.code), exc.read(2_000_001)

          def objects(payload):
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("results", "objects", "tasks"):
                      if isinstance(payload.get(key), list):
                          return payload[key]
              return []

          def task_summary(item):
              return {
                  key: item.get(key)
                  for key in (
                      "id", "description", "enabled", "running", "status",
                      "interval", "hour", "minute", "last_run_at", "next_run_at", "command",
                  )
                  if key in item
              }

          report = {
              "status": "PASS_READ_ONLY",
              "captured_at_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              "http_methods": ["GET"],
              "task_lists": {},
              "receipts": {},
              "source_files": {},
              "photo_paths": {},
          }
          guard_url = base + "files/path/home/Carix/publish_transaction_guard.py"
          guard_status, guard_source = get(guard_url, allowed=(200,))
          pathlib.Path("publish_transaction_guard.py").write_bytes(guard_source)
          report["publish_transaction_guard"] = {
              "http_status": guard_status,
              "bytes": len(guard_source),
              "sha256": hashlib.sha256(guard_source).hexdigest(),
          }
          publisher_url = base + "files/path/home/Carix/publikaciya.py"
          publisher_status, publisher_source = get(publisher_url, allowed=(200,))
          pathlib.Path("publikaciya.py").write_bytes(publisher_source)
          report["publikaciya"] = {
              "http_status": publisher_status,
              "bytes": len(publisher_source),
              "sha256": hashlib.sha256(publisher_source).hexdigest(),
          }
          for source_name in (
              "stranica.py", "master_card.py", "catalog_design_guard.py",
              "catalog_stage_guard_core.py",
          ):
              source_url = base + "files/path/home/Carix/" + source_name
              source_status, source_body = get(source_url)
              record = {"http_status": source_status, "exists": source_status == 200}
              if source_status == 200:
                  pathlib.Path(source_name).write_bytes(source_body)
                  record.update({
                      "bytes": len(source_body),
                      "sha256": hashlib.sha256(source_body).hexdigest(),
                  })
              report["source_files"][source_name] = record

          # Read-only bounded media inventory.  PythonAnywhere's documented
          # tree endpoint returns at most 1000 entries, which is sufficient for
          # this exact 16-card photo root and avoids hundreds of per-file calls.
          tree_status, tree_raw = get(
              base + "files/tree/?" + urllib.parse.urlencode({
                  "path": "/home/Carix/video/foto",
              }),
              allowed=(200,),
          )
          tree_value = json.loads(tree_raw.decode("utf-8"))
          tree_items = tree_value if isinstance(tree_value, list) else []
          tree_files = {
              str(item) for item in tree_items
              if isinstance(item, str) and not str(item).endswith("/")
          }
          report["photo_tree"] = {
              "http_status": tree_status,
              "entry_count": len(tree_items),
              "file_count": len(tree_files),
              "limit_reached": len(tree_items) >= 1000,
              "items": sorted(tree_items),
          }

          # Compare the inventory with every reference emitted by the current
          # 16 public cards; no database write or media mutation is performed.
          card_image = __import__("re").compile(
              rb"<(?:img|source)\b[^>]*(?:src|srcset)=[\"']([^\"']+)[\"']",
              __import__("re").I,
          )
          for number in range(1, 17):
              uid = "UA-%04d" % number
              card_url = base + "files/path/home/Carix/video/" + uid + ".html"
              card_status, card_body = get(card_url)
              referenced = []
              if card_status == 200:
                  for raw_value in card_image.findall(card_body):
                      value = raw_value.decode("utf-8", "replace").split()[0]
                      if "/foto/%s/" % uid in value or value.startswith("foto/%s/" % uid):
                          value = value.split("?", 1)[0].split("#", 1)[0]
                          if value not in referenced:
                              referenced.append(value)
              records = []
              for value in referenced:
                  parsed = urllib.parse.urlsplit(value)
                  relative = parsed.path
                  if relative.startswith("/video/"):
                      local = "/home/Carix/video/" + relative[len("/video/"):]
                  elif relative.startswith("/site/"):
                      local = "/home/Carix/site/" + relative[len("/site/"):]
                  elif relative.startswith("/"):
                      local = "/home/Carix/video" + relative
                  else:
                      local = "/home/Carix/video/" + relative.lstrip("./")
                  exists = local in tree_files
                  records.append({
                      "src": value,
                      "local_path": local,
                      "exists": exists,
                  })
              report["photo_paths"][uid] = {
                  "card_http_status": card_status,
                  "referenced_count": len(referenced),
                  "existing_count": sum(1 for item in records if item["exists"]),
                  "missing_count": sum(1 for item in records if not item["exists"]),
                  "items": records,
              }
          for kind in ("always_on", "schedule"):
              status, raw = get(base + kind + "/", allowed=(200,))
              payload = json.loads(raw.decode("utf-8"))
              matching = []
              for item in objects(payload):
                  if not isinstance(item, dict):
                      continue
                  haystack = " ".join(str(item.get(key) or "") for key in ("description", "command"))
                  if "TASK099" in haystack.upper() or "task099" in haystack or "start_safe.py" in haystack:
                      matching.append(task_summary(item))
              report["task_lists"][kind] = {"http_status": status, "matching": matching}

          public_request = urllib.request.Request(
              "https://www.uaart.com.ua/video/UA-0001.html?probe="
              + str(int(dt.datetime.now(dt.timezone.utc).timestamp())),
              headers={"User-Agent": "ua-art-task099-read-only-probe/1"},
              method="GET",
          )
          try:
              with urllib.request.urlopen(public_request, timeout=30) as response:
                  public_status = int(response.status)
                  public_body = response.read(500)
          except urllib.error.HTTPError as exc:
              public_status = int(exc.code)
              public_body = exc.read(500)
          report["public_ua0001"] = {
              "http_status": public_status,
              "body_head": public_body.decode("utf-8", "replace")[:200],
          }

          remote = "/home/Carix/autopilot_inbox/cloud/task_099_site_crm_repair/"
          for name in (
              "partial_probe_receipt.json",
              "partial_resume_receipt.json",
              "partial_resume_progress.json",
              "install_receipt.json",
              "postcheck_receipt.json",
          ):
              url = base + "files/path" + urllib.parse.quote(remote + name, safe="/")
              status, raw = get(url)
              record = {"http_status": status, "exists": status == 200}
              if status == 200:
                  value = json.loads(raw.decode("utf-8"))
                  record.update({
                      key: value.get(key)
                      for key in ("status", "mode", "finished_at_utc", "errors")
                      if key in value
                  })
              report["receipts"][name] = record

          path = pathlib.Path("task099_remote_state.json")
          path.write_text(json.dumps(report, ensure_ascii=False, indent=2, sort_keys=True) + "\n")
          print(json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload read-only state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task099-remote-state-${{ github.run_id }}
          # Source contains code only and is captured to diagnose the bounded
          # duplicate-snapshot quota failure; no credentials are included.
          path: |
            task099_remote_state.json
            publish_transaction_guard.py
            publikaciya.py
            stranica.py
            master_card.py
            catalog_design_guard.py
            catalog_stage_guard_core.py
          if-no-files-found: error
          retention-days: 7
