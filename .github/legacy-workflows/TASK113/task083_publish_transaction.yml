# retry: publisher-scoped-diagnostics-v2-2026-08-29
# retry: canonical-diagnostic-heading-2026-08-29
# retry: diagnostics-generator-validator-contract-2026-08-29
name: task083-publish-transaction-production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task083_publish_transaction.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: task083-publish-transaction-production
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify bounded owner authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tasks/task_083.md').read_text(encoding='utf-8')
          required = [
              'прямым bounded production authorization',
              'Новое подтверждение не требуется',
              'UA-0012', 'UA-0013',
              'автоматическим откатом',
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit('TASK083_OWNER_AUTHORIZATION_MISSING:' + ','.join(missing))
          print('TASK083_OWNER_AUTHORIZATION_PASS')
          PY

      - name: Compile and run transaction tests
        run: |
          python3 -W error -m py_compile \
            cloud/task_075_stage_guard/stage_guard.py \
            cloud/task_083_publish_transaction/publish_transaction_guard.py \
            cloud/task_083_publish_transaction/remote_installer.py \
            cloud/task_083_publish_transaction/public_verify.py \
            cloud/task_083_publish_transaction/controller.py \
            cloud/task_083_publish_transaction/tests/test_contract.py
          python3 -W error cloud/task_083_publish_transaction/tests/test_contract.py

      - name: Wait in fair production queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -W error automation/production_queue.py self-test
          python3 -W error automation/production_queue.py wait \
            --task 83 \
            --drain-before 2026-08-29T09:05:20Z \
            --timeout-seconds 4500 \
            --stable-polls 2

      - name: Backup, install, publish, restart and verify
        id: deploy
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_083_publish_transaction/controller.py

      - name: Finalize owner-facing status
        if: always()
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          root = Path('cloud/task_083_publish_transaction')
          evidence_path = root / 'evidence/deploy.json'
          if evidence_path.exists():
              evidence = json.loads(evidence_path.read_text(encoding='utf-8'))
          else:
              evidence = {'status': 'FAIL', 'errors': ['DEPLOY_EVIDENCE_MISSING']}
              evidence_path.parent.mkdir(parents=True, exist_ok=True)
              evidence_path.write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          report = root / 'TASK_083_REPORT.md'
          if not report.exists():
              report.write_text('# UA-0012/UA-0013 publication transaction repair\n\nSTATUS: **FAIL**\n', encoding='utf-8')
          ok = evidence.get('status') == 'PASS'
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          errors = list(evidence.get('errors') or [])
          print('TASK083_FINAL_STATUS', 'PASS' if ok else 'FAIL', now, errors)
          PY

      - name: Commit bounded evidence
        if: always()
        run: |
          git add -- \
            cloud/task_083_publish_transaction/evidence/deploy.json \
            cloud/task_083_publish_transaction/TASK_083_REPORT.md
          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              cloud/task_083_publish_transaction/evidence/deploy.json|\
              cloud/task_083_publish_transaction/TASK_083_REPORT.md) ;;
              *) echo "Unexpected staged path: $path"; exit 1 ;;
            esac
          done
          if [ "${#staged[@]}" -eq 0 ]; then exit 0; fi
          git config user.name 'task083-publish-transaction'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task083: record UA-0012/UA-0013 production repair'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Enforce final result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('cloud/task_083_publish_transaction/evidence/deploy.json').read_text())
          if value.get('status') != 'PASS':
              raise SystemExit('TASK083_FAIL_CLOSED:' + ';'.join(value.get('errors') or []))
          install = value.get('install') or {}
          if install.get('db_before', {}).get('sha256') != install.get('db_after', {}).get('sha256'):
              raise SystemExit('TASK083_CRM_ROWS_CHANGED')
          print('TASK083_PRODUCTION_PASS')
          PY

      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task083-publish-transaction-${{ github.run_id }}
          path: |
            cloud/task_083_publish_transaction/evidence/deploy.json
            cloud/task_083_publish_transaction/TASK_083_REPORT.md
          if-no-files-found: warn
          retention-days: 14
