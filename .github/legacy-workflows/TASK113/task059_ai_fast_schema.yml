name: task059-ai-fast-schema
# RETIRED/QUARANTINED: automatic triggers moved to central exact autostart; manual dispatch only.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task059-ai-fast-schema
  cancel-in-progress: false

jobs:
  install:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm task 059 is current
        id: current
        shell: bash
        run: |
          if grep -qx 'TASK_ID: task_059' cloud/latest_status.md; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python 3.11
        if: steps.current.outputs.run == 'true'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: One focused compile and contract control
        if: steps.current.outputs.run == 'true'
        shell: bash
        run: |
          python3 -m py_compile \
            cloud/task_059_ai_fast_schema/ai_fast_schema.py \
            cloud/task_059_ai_fast_schema/patch_payload.py \
            cloud/task_059_ai_fast_schema/patch_installer.py \
            cloud/task_059_ai_fast_schema/task059_controller.py
          python3 -m unittest discover \
            -s cloud/task_059_ai_fast_schema/tests \
            -p 'test_task059.py' -v

      - name: Install patch and restart production bot
        if: steps.current.outputs.run == 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
        run: python3 cloud/task_059_ai_fast_schema/task059_controller.py

      - name: Validate bounded evidence
        if: steps.current.outputs.run == 'true'
        shell: bash
        run: |
          test -f cloud/task_059_ai_fast_schema/evidence/task_059_install.json
          test -f cloud/task_059_ai_fast_schema/TASK_059_REPORT.md
          git add -- \
            cloud/task_059_ai_fast_schema/evidence/task_059_install.json \
            cloud/task_059_ai_fast_schema/TASK_059_REPORT.md
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -lt 1 ] || [ "${#staged[@]}" -gt 2 ]; then
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "$path" in
              cloud/task_059_ai_fast_schema/evidence/task_059_install.json|\
              cloud/task_059_ai_fast_schema/TASK_059_REPORT.md) ;;
              *) exit 1 ;;
            esac
          done

      - name: Commit installation evidence
        if: steps.current.outputs.run == 'true'
        shell: bash
        run: |
          git config user.name 'task059-fast-schema'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'task_059: record AI patch installation'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 3)); fi
          done
          exit 1
