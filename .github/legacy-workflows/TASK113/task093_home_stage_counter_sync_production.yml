name: task093-home-stage-counter-sync-production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task093_home_stage_counter_sync_production.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact deployment commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify owner authorization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("tasks/task_093.md").read_text(encoding="utf-8")
          required = [
              "прошу исправить",
              "production-исправление",
              "CRM, карточки, каталог, фото и видео не изменять",
              "13 / 3 / 1 / 7 / 2",
              "автоматический rollback",
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit("TASK093_AUTHORIZATION_MISSING:" + ",".join(missing))
          print("TASK093_AUTHORIZATION_PASS")
          PY

      - name: Compile and test counter guard
        run: |
          python3 -W error -m py_compile \
            cloud/task_093_home_stage_counter_sync/home_counter_guard.py \
            cloud/task_093_home_stage_counter_sync/remote_installer.py \
            cloud/task_093_home_stage_counter_sync/controller.py \
            cloud/task_093_home_stage_counter_sync/test_home_counter_guard.py
          cd cloud/task_093_home_stage_counter_sync
          python3 -W error -m unittest -v test_home_counter_guard.py

      - name: Wait in fair production queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -W error automation/production_queue.py self-test
          python3 -W error automation/production_queue.py wait \
            --task 93 --timeout-seconds 1200 --stable-polls 2

      - name: Backup, install and verify twice
        id: deploy
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_093_home_stage_counter_sync/controller.py

      - name: Ensure bounded evidence exists
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path("cloud/task_093_home_stage_counter_sync")
          evidence = root / "evidence/production.json"
          report = root / "TASK_093_REPORT.md"
          if not evidence.exists():
              evidence.parent.mkdir(parents=True, exist_ok=True)
              evidence.write_text(json.dumps({
                  "contract_id": "UA-HOME-STAGE-COUNTER-SYNC-093-V1.0",
                  "status": "FAIL",
                  "errors": ["DEPLOY_EVIDENCE_MISSING"],
              }, indent=2) + "\n", encoding="utf-8")
          if not report.exists():
              report.write_text(
                  "# TASK 093 — синхронизация счётчиков главной\n\n"
                  "STATUS: **FAIL**\n",
                  encoding="utf-8")
          PY

      - name: Commit bounded evidence
        if: always()
        run: |
          git add -- \
            cloud/task_093_home_stage_counter_sync/evidence/production.json \
            cloud/task_093_home_stage_counter_sync/TASK_093_REPORT.md
          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              cloud/task_093_home_stage_counter_sync/evidence/production.json|cloud/task_093_home_stage_counter_sync/TASK_093_REPORT.md) ;;
              *) echo "Unexpected staged path: $path"; exit 1 ;;
            esac
          done
          if [ "${#staged[@]}" -gt 0 ]; then
            git config user.name 'task093-home-stage-counter-sync'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'task093: record homepage counter production evidence'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              test "$attempt" -lt 6 || exit 1
              sleep $((attempt * 3))
            done
          fi

      - name: Require verified production result
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              "cloud/task_093_home_stage_counter_sync/evidence/production.json"
          ).read_text(encoding="utf-8"))
          assert value.get("status") == "PASS", value.get("errors")
          assert value.get("crm_write") is False
          assert value.get("media_write") is False
          install = value["install"]
          assert install["database_before"]["counts"] == {
              "all": 13, "kiev": 3, "georgia": 1, "sea": 7, "korea": 2}
          assert install["database_before"]["file_sha256"] == install["database_after"]["file_sha256"]
          assert install["database_before"]["rows_sha256"] == install["database_after"]["rows_sha256"]
          assert value["public_immediate"]["status"] == "PASS"
          assert value["public_delayed"]["status"] == "PASS"
          assert value["public_immediate"]["ua0011_full"] is True
          assert value["public_delayed"]["ua0011_full"] is True
          print("TASK093_PRODUCTION_PASS")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task093-home-stage-counter-sync-${{ github.run_id }}
          path: |
            cloud/task_093_home_stage_counter_sync/evidence/production.json
            cloud/task_093_home_stage_counter_sync/TASK_093_REPORT.md
          if-no-files-found: warn
          retention-days: 14
