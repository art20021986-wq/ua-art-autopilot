name: task091-crm-numeric-single-claim-production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task091_numeric_claim_guard.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify owner command and bounded scope
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('tasks/task_091.md').read_text(encoding='utf-8')
          required = [
              'одно значение → одна ячейка',
              'UA-0015',
              'KMHE341DBJA475862',
              'BACKUP',
              'автооткат',
          ]
          missing = [value for value in required if value not in source]
          if missing:
              raise SystemExit('TASK091_OWNER_COMMAND_MISSING:' + ','.join(missing))
          print('TASK091_OWNER_COMMAND_PASS')
          PY

      - name: Compile and run complete local suite
        run: |
          python3 -W error -m py_compile cloud/task_091_numeric_claim_guard/*.py
          cd cloud/task_091_numeric_claim_guard
          python3 -W error -m unittest -v

      - name: Wait in production queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          python3 -W error automation/production_queue.py self-test
          python3 -W error automation/production_queue.py wait --task 91 --timeout-seconds 900 --stable-polls 2

      - name: Backup, install, correct UA-0015, restart and verify
        id: deploy
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_091_numeric_claim_guard/controller.py

      - name: Ensure bounded evidence exists
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('cloud/task_091_numeric_claim_guard')
          evidence = root / 'evidence/deploy.json'
          evidence.parent.mkdir(parents=True, exist_ok=True)
          if not evidence.exists():
              evidence.write_text(json.dumps({
                  'contract_id': 'CRM-NUMERIC-SINGLE-CLAIM-091-V1.0',
                  'status': 'FAIL',
                  'errors': ['DEPLOY_EVIDENCE_MISSING'],
              }, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit bounded evidence and owner status
        if: always()
        run: |
          git add -- \
            cloud/task_091_numeric_claim_guard/evidence/deploy.json \
            cloud/task_091_numeric_claim_guard/TASK_091_REPORT.md \
            cloud/latest_status.md \
            cloud/owner_reply.md
          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            case "$path" in
              cloud/task_091_numeric_claim_guard/evidence/deploy.json|cloud/task_091_numeric_claim_guard/TASK_091_REPORT.md|cloud/latest_status.md|cloud/owner_reply.md) ;;
              *) echo "Unexpected staged path: $path"; exit 1 ;;
            esac
          done
          if [ "${#staged[@]}" -gt 0 ]; then
            git config user.name 'task091-numeric-single-claim'
            git config user.email 'actions@users.noreply.github.com'
            git commit -m 'task091: record numeric single-claim repair'
            for attempt in 1 2 3 4 5 6; do
              git fetch origin main
              if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
              if git push origin HEAD:main; then exit 0; fi
              test "$attempt" -lt 6 || exit 1
              sleep $((attempt * 3))
            done
          fi

      - name: Enforce final PASS
        if: always()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              'cloud/task_091_numeric_claim_guard/evidence/deploy.json'
          ).read_text(encoding='utf-8'))
          if value.get('status') != 'PASS':
              raise SystemExit('TASK091_FAIL_CLOSED:' + ';'.join(value.get('errors') or []))
          after = ((value.get('install') or {}).get('migration') or {}).get('after') or {}
          if str(after.get('year') or '').strip() or int(after.get('engine_cc') or 0) != 1999:
              raise SystemExit('TASK091_UA0015_POSTCONDITION_FAIL')
          print('TASK091_PRODUCTION_PASS')
          PY

      - name: Upload machine evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task091-numeric-single-claim-${{ github.run_id }}
          path: |
            cloud/task_091_numeric_claim_guard/evidence/deploy.json
            cloud/task_091_numeric_claim_guard/TASK_091_REPORT.md
          if-no-files-found: warn
          retention-days: 14
