name: task095-catalog-visual-diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task095_catalog_visual_diagnostic.yml'
      - 'tasks/task_095.md'
      - 'automation/task095_visual_probe.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ua-art-task095-visual-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install browser probe
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Run read-only rendered diagnostic
        id: probe
        continue-on-error: true
        run: python automation/task095_visual_probe.py

      - name: Ensure evidence exists
        if: always()
        run: |
          test -f cloud/task_095_catalog_visual_repair/evidence/browser_probe.json || {
            mkdir -p cloud/task_095_catalog_visual_repair/evidence
            printf '%s\n' '{"contract_id":"CATALOG-VISUAL-ACCEPTANCE-REPAIR-095-V1.0","status":"FAIL","errors":["BROWSER_PROBE_EVIDENCE_MISSING"],"production_write":false}' > cloud/task_095_catalog_visual_repair/evidence/browser_probe.json
          }

      - name: Commit text evidence
        if: always()
        run: |
          git add -- cloud/task_095_catalog_visual_repair/evidence/browser_probe.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'task095-visual-diagnostic'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task095: record rendered catalog evidence'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Upload screenshots and rendered HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task095-rendered-catalog-${{ github.run_id }}
          path: |
            cloud/task_095_catalog_visual_repair/evidence/*.png
            cloud/task_095_catalog_visual_repair/evidence/*.html
            cloud/task_095_catalog_visual_repair/evidence/browser_probe.json
          if-no-files-found: warn
          retention-days: 14

      - name: Require factual result
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path('cloud/task_095_catalog_visual_repair/evidence/browser_probe.json').read_text())
          print('TASK095_RENDERED_STATUS=' + str(value.get('status')))
          print('TASK095_ERRORS=' + ';'.join(value.get('errors') or []))
          if value.get('status') != 'PASS':
              raise SystemExit(1)
          PY
