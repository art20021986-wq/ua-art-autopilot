name: SEO TOP KYIV Receipt Verify
# exact receipt attestation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo_top_kyiv_receipt_verify.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify exact PythonAnywhere release receipt
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          name="SEO_KOREA_KYIV_001_receipt_04245aae1958.json"
          url="https://www.pythonanywhere.com/api/v0/user/Carix/files/path/home/Carix/archive/reports/"+name
          req=urllib.request.Request(url,headers={"Authorization":"Token "+os.environ["PA_TOKEN"]})
          with urllib.request.urlopen(req,timeout=30) as r:
              d=json.load(r)
          safe={k:d.get(k) for k in ("task_id","run_id","final_status","production_urls","sitemap_url_count","gate_a","gate_b","gate_c","gate_d","rollback")}
          print(json.dumps(safe,ensure_ascii=False,indent=2))
          if not str(d.get("final_status","")).startswith("SEO-KOREA-KYIV-001 PRODUCTION PASS"):
              raise SystemExit("RELEASE_RECEIPT_NOT_PASS")
          PY
