name: GSC Daily SEO Radar
on:
  push:
    branches: [main]
    paths:
      - 'automation/gsc_daily_seo_radar.py'
      - '.github/workflows/gsc_daily_seo_radar.yml'
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Compile radar
        run: python3 -m py_compile automation/gsc_daily_seo_radar.py
      - name: Query Search Console read-only
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python3 automation/gsc_daily_seo_radar.py
