name: GSC root verification route
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test route installation without production access
        run: python3 -m unittest discover -s cloud/gsc_root_route_20260928 -p 'test_*.py' -v
      - name: Install exact Google verification route
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/gsc_root_route_20260928/controller.py
