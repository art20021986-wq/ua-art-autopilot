name: TASK105 STANDARD Sandbox and Production Canary

on:
  push:
    branches:
      - task105-fast-pipeline-phase0
    paths:
      - 'tasks/task_105_full_completion.md'
      - 'cloud/task_105_fast_pipeline_phase4/standard_shadow.py'
      - 'cloud/task_105_fast_pipeline_phase4/standard_canary_remote.py'
      - 'cloud/task_105_fast_pipeline_phase4/standard_canary_controller.py'
      - 'cloud/task_105_fast_pipeline_phase4/test_standard_canary.py'
      - '.github/workflows/task105_standard_canary.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  standard-canary:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact authorized commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: task105-fast-pipeline-phase0
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify owner authorization and safety boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          text = Path("tasks/task_105_full_completion.md").read_text(encoding="utf-8")
          required = [
              "УТВЕРЖДАЮ ПРОДОЛЖЕНИЕ UA-ART-FAST-PIPELINE-001 ДО ПОЛНОГО TASK FINISHED",
              "FAST → STANDARD → CRITICAL → переключение основного маршрута",
              "обязательные backup, live-проверка и автоматический rollback",
              "CRM и данные автомобилей не изменять без отдельной необходимости",
          ]
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit("TASK105_CONTINUATION_AUTHORIZATION_MISSING:" + "|".join(missing))
          print("TASK105_CONTINUATION_AUTHORIZATION_PASS")
          PY

      - name: Compile and run deterministic STANDARD unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -m py_compile \
            automation/task_orchestrator.py \
            cloud/task_105_fast_pipeline_phase4/standard_shadow.py \
            cloud/task_105_fast_pipeline_phase4/standard_canary_remote.py \
            cloud/task_105_fast_pipeline_phase4/standard_canary_controller.py \
            cloud/task_105_fast_pipeline_phase4/test_standard_canary.py
          python3 cloud/task_105_fast_pipeline_phase4/test_standard_canary.py \
            2>&1 | tee /tmp/task105_standard_tests.log
          grep -q '^Ran 15 tests' /tmp/task105_standard_tests.log
          grep -q '^OK$' /tmp/task105_standard_tests.log

      - name: Run 10-case STANDARD sandbox shadow matrix
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud/task_105_fast_pipeline_phase4/standard_shadow.py \
            | tee /tmp/task105_standard_shadow.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              "cloud/task_105_fast_pipeline_phase4/standard_shadow_results.json"
          ).read_text(encoding="utf-8"))
          assert value["status"] == "PASS", value
          assert value["total"] == 10 and value["passed"] == 10 and value["failed"] == 0, value
          print("TASK105_STANDARD_SHADOW_10_OF_10_PASS")
          PY

      - name: Require STANDARD and NO_AI routing for production suite
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/task105-standard-request.json <<'JSON'
          {
            "task_id": "TASK105-STANDARD-PRODUCTION-CANARY",
            "title": "Multi-file STANDARD form fixture",
            "description": "replace exact form fixtures, backup, rollback and http 200",
            "changed_paths": [
              "video/task105-standard-canary-a.txt",
              "video/task105-standard-canary-b.txt",
              "video/task105-standard-canary-c.txt"
            ],
            "production_required": true,
            "complexity": 2
          }
          JSON
          python3 automation/task_orchestrator.py classify \
            /tmp/task105-standard-request.json >/tmp/task105-standard-plan.json
          python3 - <<'PY'
          import json
          plan = json.load(open("/tmp/task105-standard-plan.json", encoding="utf-8"))
          assert plan["task_class"] == "STANDARD", plan
          assert plan["ai_route"] == "NO_AI", plan
          assert plan["ai_call_budget"] == 0, plan
          assert plan["production_required"] is True, plan
          print("TASK105_STANDARD_NO_AI_ROUTE_PASS")
          PY

      - name: Wait in existing fair production queue
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error automation/production_queue.py self-test
          python3 -W error automation/production_queue.py wait \
            --task 105 --timeout-seconds 1200 --stable-polls 2

      - name: Run three bounded STANDARD production cases
        id: deploy
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          python3 cloud/task_105_fast_pipeline_phase4/standard_canary_controller.py \
            2>&1 | tee /tmp/task105_standard_controller.log

      - name: Materialize canonical owner status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          import json
          from pathlib import Path

          root = Path(".")
          out = root / "cloud/task_105_fast_pipeline_phase4"
          evidence_path = out / "standard_canary_evidence.json"
          receipt_path = root / "state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json"
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          evidence = {}
          if evidence_path.exists():
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
          finished = False
          if receipt_path.exists():
              receipt = json.loads(receipt_path.read_text(encoding="utf-8"))
              finished = (
                  receipt.get("status") == "FINISHED"
                  and receipt.get("production") == "PASS"
                  and receipt.get("live_verify") == "PASS"
                  and receipt.get("sandbox_cases") == 10
                  and receipt.get("production_cases") == 3
              )
          errors = evidence.get("errors") or []
          if finished:
              status = "DONE"
              current = "STANDARD sandbox 10/10 and controlled production cases 3/3 live verified"
              owner_required = "NO"
              owner_question = "NONE"
              next_step = "build and accept CRITICAL adapter, then install permanent workflows"
              owner_status = "PASS STANDARD"
          else:
              status = "BLOCKED"
              current = "STANDARD canary did not reach truthful FINISHED"
              owner_required = "NO"
              owner_question = "NONE"
              next_step = "ROOT_CAUSE_MODE on same TASK105; do not blind retry"
              owner_status = "BLOCKED"
          (root / "cloud/latest_status.md").write_text(
              "\n".join([
                  "TASK_ID: task_105",
                  "ROUND: 5",
                  "CLAUDE_STATUS: " + status,
                  "CURRENT_ACTION: " + current,
                  "FILES_CREATED: cloud/task_105_fast_pipeline_phase4/standard_canary_evidence.json,cloud/task_105_fast_pipeline_phase4/STANDARD_CANARY_REPORT.md,state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json",
                  "PRODUCTION_TOUCHED: " + ("YES" if evidence.get("production_touched") else "NO"),
                  "OWNER_ACTION_REQUIRED: " + owner_required,
                  "OWNER_QUESTION: " + owner_question,
                  "NEXT_FOR_CHATGPT: " + next_step,
                  "UPDATED_AT_UTC: " + now,
                  "",
              ]),
              encoding="utf-8",
          )
          (root / "cloud/owner_reply.md").write_text(
              "\n".join([
                  "# Ответ владельцу — TASK105",
                  "",
                  "СТАТУС: " + owner_status,
                  "ЧТО СДЕЛАНО: проверка STANDARD-контура — 10 sandbox-сценариев и 3 контролируемые production-операции",
                  "PRODUCTION: " + ("ПРОВЕРЕН" if finished else "НЕ ПРИНЯТ"),
                  "CRM И ДАННЫЕ АВТОМОБИЛЕЙ: НЕ ИЗМЕНЕНЫ",
                  "ОШИБКИ: " + ("; ".join(errors) if errors else "НЕТ"),
                  "СЛЕДУЮЩИЙ ЭТАП: " + next_step,
                  "",
              ]),
              encoding="utf-8",
          )
          PY

      - name: Enforce bounded evidence write scope
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              cloud/task_105_fast_pipeline_phase4/standard_shadow_results.json|\
              cloud/task_105_fast_pipeline_phase4/standard_canary_evidence.json|\
              cloud/task_105_fast_pipeline_phase4/STANDARD_CANARY_REPORT.md|\
              state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json|\
              cloud/latest_status.md|\
              cloud/owner_reply.md) ;;
              *)
                echo "UNEXPECTED_WRITE_SCOPE: $path"
                exit 1
                ;;
            esac
          done

      - name: Commit bounded STANDARD evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            cloud/task_105_fast_pipeline_phase4/standard_shadow_results.json \
            cloud/task_105_fast_pipeline_phase4/standard_canary_evidence.json \
            cloud/task_105_fast_pipeline_phase4/STANDARD_CANARY_REPORT.md \
            state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json \
            cloud/latest_status.md \
            cloud/owner_reply.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No STANDARD evidence changes"
            exit 0
          fi
          git config user.name 'ua-art-standard-canary'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task105: record STANDARD sandbox and production canary evidence'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin task105-fast-pipeline-phase0
            if ! git rebase origin/task105-fast-pipeline-phase0; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:task105-fast-pipeline-phase0; then
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Require truthful STANDARD FINISHED receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json
          python3 automation/task_orchestrator.py validate-receipt \
            state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json >/tmp/task105-standard-validated.json
          python3 - <<'PY'
          import json
          value = json.load(open("/tmp/task105-standard-validated.json", encoding="utf-8"))
          assert value["task_class"] == "STANDARD", value
          assert value["sandbox_cases"] == 10, value
          assert value["production_cases"] == 3, value
          assert value["crm_unchanged"] is True, value
          assert value["protected_files_unchanged"] is True, value
          print("TASK105_STANDARD_PRODUCTION_FINISHED_PASS")
          PY

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task105-standard-canary-${{ github.run_id }}
          path: |
            cloud/task_105_fast_pipeline_phase4/standard_shadow_results.json
            cloud/task_105_fast_pipeline_phase4/standard_canary_evidence.json
            cloud/task_105_fast_pipeline_phase4/STANDARD_CANARY_REPORT.md
            state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json
          if-no-files-found: warn
          retention-days: 14
