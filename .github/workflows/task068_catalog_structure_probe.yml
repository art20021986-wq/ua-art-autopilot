name: task068-catalog-structure-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task068_catalog_structure_probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch both production catalog sources read-only
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          import os
          import urllib.parse
          import urllib.request
          from pathlib import Path

          token = os.environ['PYTHONANYWHERE_API_TOKEN']
          base = 'https://www.pythonanywhere.com/api/v0/user/Carix/files/path'
          for label, remote in {
              'site': '/home/Carix/site/katalog.html',
              'video': '/home/Carix/video/katalog.html',
          }.items():
              request = urllib.request.Request(
                  base + urllib.parse.quote(remote, safe='/'),
                  headers={'Authorization': 'Token ' + token,
                           'User-Agent': 'ua-art-task068-read-only-probe/1'},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = response.read(2_000_001)
              if len(payload) > 2_000_000:
                  raise SystemExit('CATALOG_TOO_LARGE:' + label)
              Path('evidence/' + label + '-katalog.html').write_bytes(payload)
          PY

      - name: Record bounded HTML structure evidence
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          result = {}
          for path in sorted(Path('evidence').glob('*-katalog.html')):
              source = path.read_text(encoding='utf-8', errors='replace')
              cards = {}
              for number in range(1, 11):
                  identifier = f'UA-{number:04d}'
                  positions = [match.start() for match in re.finditer(identifier, source, re.I)]
                  cards[identifier] = {
                      'count': len(positions),
                      'contexts': [source[max(0, pos - 600):pos + 900] for pos in positions[:3]],
                  }
              result[path.name] = {
                  'bytes': len(source.encode()),
                  'article_open': len(re.findall(r'<article\\b', source, re.I)),
                  'card_class': len(re.findall(r'class=["\\'][^"\\']*card', source, re.I)),
                  'cards': cards,
              }
          Path('evidence/structure.json').write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit bounded structure report
        run: |
          mkdir -p cloud/task_068_ferry_vin/evidence
          cp evidence/structure.json cloud/task_068_ferry_vin/evidence/catalog_structure_probe.json
          git add -- cloud/task_068_ferry_vin/evidence/catalog_structure_probe.json
          git config user.name 'task068-catalog-probe'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task068: record catalog structure probe'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then break; fi
            if [ "${attempt}" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done

      - name: Upload structure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task068-catalog-structure-${{ github.run_id }}
          path: evidence
          if-no-files-found: error
          retention-days: 3
