name: TASK104 Canary Worker
run-name: TASK104-CANARY|cycle=${{ inputs.cycle }}|scenario=${{ inputs.scenario }}|attempt=${{ inputs.attempt }}

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: Canary cycle number
        required: true
        type: string
      scenario:
        description: Failure scenario
        required: true
        type: string
      attempt:
        description: Workflow-level attempt
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: task104-canary-${{ inputs.cycle }}
  cancel-in-progress: false

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify production deny
        run: |
          grep -q '^PRODUCTION_RECOVERY_CORE_AUTHORIZED: NO$' tasks/task104_self_recovery_approval.md
          python -m py_compile automation/task104_self_recovery_core.py automation/task104_canary_worker.py
      - name: Execute isolated canary attempt
        env:
          PYTHONPATH: automation
        run: python -u automation/task104_canary_worker.py --cycle '${{ inputs.cycle }}' --scenario '${{ inputs.scenario }}' --attempt '${{ inputs.attempt }}'
      - name: Upload successful canary receipt
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task104-canary-${{ inputs.cycle }}-attempt-${{ inputs.attempt }}-${{ github.run_id }}
          path: cloud/task104_self_recovery/state/integration_receipt_*.json
          if-no-files-found: error
          retention-days: 14
