name: TASK 096 Controller Sandbox

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task096_controller_sandbox.yml'
      - 'cloud/task_096_tech_spec_ai_crm/controller_payload/**'
      - 'cloud/task_096_tech_spec_ai_crm/schema_additional_spec.sql'
      - 'cloud/task_096_tech_spec_ai_crm/price_exclusion_guard.py'
      - 'cloud/task_096_tech_spec_ai_crm/dedup_check.py'
      - 'cloud/task_096_tech_spec_ai_crm/manual_field_protection.py'
      - 'cloud/task_096_tech_spec_ai_crm/selftest.py'
      - 'cloud/task_096_tech_spec_ai_crm/source_check.py'
      - 'cloud/task_096_tech_spec_ai_crm/canary_preview.html'
      - 'tasks/task_096.md'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: task096-controller-sandbox
  cancel-in-progress: false

jobs:
  backup-sandbox-canary-report:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify exact owner-approved scope
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'BACKUP → SANDBOX → CANARY → ОТЧЁТ' tasks/task_096.md
          grep -q 'PRODUCTION — ТОЛЬКО ПО ОТДЕЛЬНОЙ КОМАНДЕ' tasks/task_096.md
          grep -q 'запись в рабочую CRM: запрещена' tasks/task_096.md
          grep -q 'автопубликация: запрещена' tasks/task_096.md
          grep -q '/home/Carix/autopilot_inbox/cloud/task_096_tech_spec_ai_crm/' tasks/task_096.md

      - name: Reconstruct and compile bounded controller package
        shell: bash
        run: |
          set -euo pipefail
          cat cloud/task_096_tech_spec_ai_crm/controller_payload/remote.part* \
            > cloud/task_096_tech_spec_ai_crm/task096_remote_controller.py
          cat cloud/task_096_tech_spec_ai_crm/controller_payload/local.part* \
            > automation/task096_pythonanywhere_controller.py
          python -m py_compile \
            automation/task096_pythonanywhere_controller.py \
            cloud/task_096_tech_spec_ai_crm/task096_remote_controller.py \
            cloud/task_096_tech_spec_ai_crm/price_exclusion_guard.py \
            cloud/task_096_tech_spec_ai_crm/dedup_check.py \
            cloud/task_096_tech_spec_ai_crm/manual_field_protection.py \
            cloud/task_096_tech_spec_ai_crm/selftest.py \
            cloud/task_096_tech_spec_ai_crm/source_check.py

      - name: Run offline safety self-test before remote access
        shell: bash
        run: |
          set -euo pipefail
          output="$(python cloud/task_096_tech_spec_ai_crm/selftest.py)"
          printf '%s\n' "$output"
          SELFTEST_JSON="$output" python - <<'PY'
          import json, os
          value = json.loads(os.environ['SELFTEST_JSON'])
          if value.get('ALL_TESTS_PASS') is not True:
              raise SystemExit('TASK096_OFFLINE_SELFTEST_FAIL')
          print('TASK096_OFFLINE_SELFTEST_PASS')
          PY

      - name: Run owner-approved PythonAnywhere backup and sandbox controller
        id: controller
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python automation/task096_pythonanywhere_controller.py

      - name: Ensure sanitized evidence exists
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f cloud/task_096_tech_spec_ai_crm/controller_evidence.json || {
            printf '%s\n' '{"contract_id":"TECH-SPEC-AI-CRM-017-V3.0-TASK096","task_id":"task_096","status":"FAIL","errors":["CONTROLLER_EVIDENCE_MISSING"],"production_touched":false,"live_crm_write":false,"main_fields_changed":false,"public_path_write":false,"services_restarted":false,"autopublication":false,"production_authorized":false}' \
              > cloud/task_096_tech_spec_ai_crm/controller_evidence.json
          }
          test -f cloud/task_096_tech_spec_ai_crm/controller_report.md || {
            printf '%s\n' '# TASK 096 controller report' '' '**Status:** FAIL' '' 'Production не затрагивался.' \
              > cloud/task_096_tech_spec_ai_crm/controller_report.md
          }

      - name: Enforce no backup or sandbox database entered the repository
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(find cloud/task_096_tech_spec_ai_crm -type f \( -name '*.db' -o -name '*.sqlite' -o -name '*.sqlite3' \) -print)"
          if [ -n "$forbidden" ]; then
            echo 'Forbidden database file in repository workspace:'
            echo "$forbidden"
            exit 1
          fi

      - name: Commit TASK 096 controller evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            cloud/task_096_tech_spec_ai_crm/controller_evidence.json \
            cloud/task_096_tech_spec_ai_crm/controller_report.md
          if git diff --cached --quiet; then
            echo 'No TASK 096 evidence change to commit'
            exit 0
          fi
          git config user.name 'task096-controller-sandbox'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task096: record controller sandbox evidence'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo 'TASK096_EVIDENCE_REBASE_CONFLICT'
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Upload sanitized controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task096-controller-sandbox-${{ github.run_id }}
          path: |
            cloud/task_096_tech_spec_ai_crm/controller_evidence.json
            cloud/task_096_tech_spec_ai_crm/controller_report.md
          if-no-files-found: error
          retention-days: 14

      - name: Enforce final safe PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              'cloud/task_096_tech_spec_ai_crm/controller_evidence.json'
          ).read_text(encoding='utf-8'))
          if value.get('status') not in {'PASS', 'PASS_WITH_WARNINGS'}:
              raise SystemExit('TASK096_CONTROLLER_FAIL:' + ';'.join(value.get('errors') or []))
          for key in (
              'production_touched', 'live_crm_write', 'main_fields_changed',
              'public_path_write', 'services_restarted', 'autopublication',
              'production_authorized',
          ):
              if value.get(key) is not False:
                  raise SystemExit('TASK096_SCOPE_VIOLATION:' + key)
          if (value.get('selftest') or {}).get('ALL_TESTS_PASS') is not True:
              raise SystemExit('TASK096_SELFTEST_NOT_PASS')
          if (value.get('canary') or {}).get('pass') is not True:
              raise SystemExit('TASK096_CANARY_NOT_PASS')
          print('TASK096_CONTROLLER_SAFE_PASS=' + value['status'])
          PY
