name: TASK092 UA WEB RECOVERY AUTOSTART

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task092_autostart.yml'
  schedule:
    # GitHub cron uses UTC. This is a bounded one-night retry window:
    # 2026-08-30 01:00–09:30 Asia/Ho_Chi_Minh approximately.
    - cron: '*/10 18-23 29 8 *'
    - cron: '*/10 0-2 30 8 *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: task092-claude-autostart
  cancel-in-progress: false

jobs:
  run-task092:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate exact TASK 092 and bounded retries
        id: gate
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib
          import re

          root = pathlib.Path('.')
          tasks = list((root / 'tasks').glob('task_*.md'))

          def task_key(path):
              match = re.fullmatch(r'task_(\d+)(.*)\.md', path.name)
              if not match:
                  return (-1, 0, path.name)
              return (int(match.group(1)), 1 if match.group(2) == '' else 0, path.name)

          latest = max(tasks, key=task_key) if tasks else None
          deadline = dt.datetime(2026, 8, 30, 2, 30, tzinfo=dt.timezone.utc)
          now = dt.datetime.now(dt.timezone.utc)
          state_path = root / 'cloud' / 'task_092_autostart_state.json'
          state = {'attempts_started': 0}
          if state_path.exists():
              try:
                  parsed = json.loads(state_path.read_text(encoding='utf-8'))
                  if isinstance(parsed, dict):
                      state.update(parsed)
              except Exception:
                  pass

          reason = 'READY'
          should_run = True
          if latest is None or latest.name != 'task_092.md':
              should_run = False
              reason = 'TASK_092_NOT_LATEST'
          elif now > deadline:
              should_run = False
              reason = 'DEADLINE_REACHED'
          # Keep the overnight retry window alive while the owner adjusts the
          # Anthropic self-imposed spend limit. Failed HTTP 400 attempts do not
          # touch production and are not billable, so a larger bounded count is
          # safe and prevents the queue from exhausting before the limit change.
          elif int(state.get('attempts_started') or 0) >= 50:
              should_run = False
              reason = 'MAX_ACTUAL_ATTEMPTS_REACHED'
          else:
              status_path = root / 'cloud' / 'latest_status.md'
              if status_path.exists():
                  text = status_path.read_text(encoding='utf-8', errors='replace')
                  task_match = re.search(r'^TASK_ID:\s*(\S+)', text, re.M)
                  status_match = re.search(r'^CLAUDE_STATUS:\s*(\S+)', text, re.M)
                  if (task_match and task_match.group(1) == 'task_092'
                          and status_match
                          and status_match.group(1).upper() in {'DONE', 'BLOCKED', 'WAITING_OWNER'}):
                      should_run = False
                      reason = 'TASK_092_ALREADY_RETURNED_' + status_match.group(1).upper()

          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a', encoding='utf-8') as fh:
              fh.write('should_run=%s\n' % ('true' if should_run else 'false'))
              fh.write('reason=%s\n' % reason)
          print('TASK092_GATE should_run=%s reason=%s latest=%s attempts=%s now=%s' % (
              should_run, reason, latest.name if latest else 'NONE',
              state.get('attempts_started', 0), now.isoformat()))
          PY

      - name: Record actual worker start attempt
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        env:
          TASK092_RUN_ID: ${{ github.run_id }}
          TASK092_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          import pathlib

          path = pathlib.Path('cloud/task_092_autostart_state.json')
          state = {'attempts_started': 0, 'history': []}
          if path.exists():
              try:
                  parsed = json.loads(path.read_text(encoding='utf-8'))
                  if isinstance(parsed, dict):
                      state.update(parsed)
              except Exception:
                  pass
          state['attempts_started'] = int(state.get('attempts_started') or 0) + 1
          history = state.get('history')
          if not isinstance(history, list):
              history = []
          history.append({
              'attempt': state['attempts_started'],
              'run_id': os.environ.get('TASK092_RUN_ID'),
              'run_attempt': os.environ.get('TASK092_RUN_ATTEMPT'),
              'started_at_utc': dt.datetime.now(dt.timezone.utc).isoformat(),
          })
          state['history'] = history[-10:]
          state['production_touched'] = False
          path.parent.mkdir(exist_ok=True)
          path.write_text(json.dumps(state, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name 'ua-art-task092-autostart'
          git config user.email 'actions@users.noreply.github.com'
          git add cloud/task_092_autostart_state.json
          git commit -m 'status(task092): record autonomous worker attempt'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo 'Unable to persist bounded attempt state'
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Run autonomous Claude worker for TASK 092
        if: steps.gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_TOTAL_BUDGET_SECONDS: '1500'
          ANTHROPIC_NETWORK_ATTEMPTS: '4'
          ANTHROPIC_MAX_TOKENS: '128000'
          ANTHROPIC_STREAM_IDLE_TIMEOUT_SECONDS: '120'
        run: python3 automation/claude_worker.py

      - name: Commit TASK 092 Claude outputs
        if: steps.gate.outputs.should_run == 'true'
        shell: bash
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No Claude output changes'
            exit 1
          fi
          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Claude autopilot: process TASK 092 web recovery'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 0 ]; then
                git rebase --abort || true
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "${path}" in
                  cloud/latest_status.md|cloud/owner_reply.md) ;;
                  *)
                    echo "Unsafe rebase conflict: ${path}"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done
              for path in "${conflicts[@]}"; do
                git checkout --theirs -- "${path}"
                git add -- "${path}"
              done
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit 1

      - name: Report skipped state
        if: steps.gate.outputs.should_run != 'true'
        run: echo "TASK 092 worker skipped — ${{ steps.gate.outputs.reason }}"
