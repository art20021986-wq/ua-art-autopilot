name: task095-catalog-visual-repair-production-v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task095_catalog_visual_repair_v2.yml'
      - 'automation/task095_production_controller_v2.py'
      - 'cloud/task_095_catalog_visual_repair/remote_repair_v2.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify owner authorization
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('tasks/task_095.md').read_text(encoding='utf-8')
          required = [
              'P0 / CRITICAL / immediate',
              'Repair only the catalog presentation layer',
              'Preserve exactly 13 published automobiles',
              'automatic rollback',
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('TASK095_AUTH_MISSING:' + ','.join(missing))
          print('TASK095_AUTH_PASS')
          PY

      - name: Compile corrected repair package
        run: |
          python -m py_compile \
            automation/task095_production_controller_v2.py \
            cloud/task_095_catalog_visual_repair/remote_repair_v2.py

      - name: Backup and atomically repair production
        id: install
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python automation/task095_production_controller_v2.py install

      - name: Install browser verifier
        if: always()
        run: |
          python -m pip install --disable-pip-version-check playwright==1.55.0
          python -m playwright install --with-deps chromium

      - name: Immediate real-browser verification
        if: always()
        run: |
          rm -f cloud/task_095_catalog_visual_repair/evidence/browser_probe.json
          python automation/task095_visual_probe.py || true
          mkdir -p cloud/task_095_catalog_visual_repair/evidence_v2
          cp cloud/task_095_catalog_visual_repair/evidence/browser_probe.json \
             cloud/task_095_catalog_visual_repair/evidence_v2/browser_probe_immediate.json

      - name: Delayed real-browser verification
        if: always()
        run: |
          sleep 45
          rm -f cloud/task_095_catalog_visual_repair/evidence/browser_probe.json
          python automation/task095_visual_probe.py || true
          cp cloud/task_095_catalog_visual_repair/evidence/browser_probe.json \
             cloud/task_095_catalog_visual_repair/evidence_v2/browser_probe_delayed.json

      - name: Postcheck or automatic rollback
        if: always()
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          root = Path('cloud/task_095_catalog_visual_repair/evidence_v2')
          root.mkdir(parents=True, exist_ok=True)

          def load(name):
              path = root / name
              if not path.exists():
                  return {'status': 'FAIL', 'errors': [name + '_MISSING']}
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except Exception as exc:
                  return {'status': 'FAIL', 'errors': [name + '_INVALID:' + type(exc).__name__]}

          install = load('install.json')
          immediate = load('browser_probe_immediate.json')
          delayed = load('browser_probe_delayed.json')
          errors = []
          for label, value in (('install', install), ('immediate', immediate), ('delayed', delayed)):
              if value.get('status') != 'PASS':
                  errors.extend(label + ':' + item for item in (value.get('errors') or ['FAIL']))

          postcheck = None
          rollback = None
          if not errors:
              result = subprocess.run(
                  ['python', 'automation/task095_production_controller_v2.py', 'postcheck'],
                  text=True,
                  capture_output=True,
              )
              postcheck = load('postcheck.json')
              if result.returncode or postcheck.get('status') != 'PASS':
                  errors.extend('postcheck:' + item for item in (postcheck.get('errors') or ['FAIL']))

          if errors and install.get('status') == 'PASS':
              subprocess.run(
                  ['python', 'automation/task095_production_controller_v2.py', 'rollback'],
                  text=True,
                  capture_output=True,
              )
              rollback = load('rollback.json')
              if rollback.get('status') != 'PASS':
                  errors.extend('rollback:' + item for item in (rollback.get('errors') or ['FAIL']))

          final = {
              'contract_id': 'CATALOG-VISUAL-ACCEPTANCE-REPAIR-095-V1.0',
              'status': 'PASS' if not errors else 'FAIL',
              'errors': errors,
              'install': install,
              'immediate': immediate,
              'delayed': delayed,
              'postcheck': postcheck,
              'rollback': rollback,
              'crm_write': False,
              'media_write': False,
          }
          (root / 'final.json').write_text(
              json.dumps(final, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print('TASK095_V2_STATUS=' + final['status'])
          print('TASK095_V2_ERRORS=' + ';'.join(errors))
          PY

      - name: Commit bounded JSON evidence
        if: always()
        run: |
          git add -- cloud/task_095_catalog_visual_repair/evidence_v2/*.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'task095-catalog-visual-repair-v2'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task095: record corrected visual repair v2'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Upload screenshots and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task095-catalog-visual-repair-v2-${{ github.run_id }}
          path: |
            cloud/task_095_catalog_visual_repair/evidence_v2/*.json
            cloud/task_095_catalog_visual_repair/evidence/*.png
            cloud/task_095_catalog_visual_repair/evidence/*.html
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce final rendered PASS
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              'cloud/task_095_catalog_visual_repair/evidence_v2/final.json'
          ).read_text(encoding='utf-8'))
          if value.get('status') != 'PASS':
              raise SystemExit('TASK095_V2_FAIL:' + ';'.join(value.get('errors') or []))
          for label in ('immediate', 'delayed'):
              probe = value[label]
              catalogs = [item for item in probe.get('probes', []) if str(item.get('label', '')).startswith('catalog-')]
              if len(catalogs) != 2:
                  raise SystemExit('TASK095_V2_' + label.upper() + '_COUNT')
              for item in catalogs:
                  if item.get('renderedCardCount') != 13:
                      raise SystemExit('TASK095_V2_' + label.upper() + '_CARDS')
                  if item.get('brokenImageCount') != 0:
                      raise SystemExit('TASK095_V2_' + label.upper() + '_IMAGES')
          print('TASK095_V2_RENDERED_PRODUCTION_PASS')
          PY
