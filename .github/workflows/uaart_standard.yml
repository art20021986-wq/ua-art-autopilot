              raise SystemExit('STANDARD_FAILURE_RUNTIME_MANIFEST_FILE')
          data = manifest_path.read_bytes()
          expected_manifest = os.environ['EXPECTED_RUNTIME_MANIFEST_SHA256']
          if not re.fullmatch(r'[0-9a-f]{64}', expected_manifest):
              raise SystemExit('STANDARD_FAILURE_RUNTIME_MANIFEST_EXPECTED_SHA')
          if hashlib.sha256(data).hexdigest() != expected_manifest:
              raise SystemExit('STANDARD_FAILURE_RUNTIME_MANIFEST_REBOUND')
          manifest = json.loads(data, object_pairs_hook=reject_duplicate_keys)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('STANDARD_FAILURE_RUNTIME_MANIFEST_KEYS')
          if manifest['schema_version'] != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('STANDARD_FAILURE_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('STANDARD_FAILURE_RUNTIME_FILE_SET')
          total = 0
          for relative, expected in files.items():
              if (
                  not re.fullmatch(r'[A-Za-z0-9._/-]+', relative)
                  or '..' in pathlib.PurePosixPath(relative).parts
                  or not isinstance(expected, str)
                  or not re.fullmatch(r'[0-9a-f]{64}', expected)
              ):
                  raise SystemExit('STANDARD_FAILURE_RUNTIME_ENTRY')
              target = root / pathlib.PurePosixPath(relative)
              if (
                  target.is_symlink()
                  or not target.is_file()
                  or target.resolve() != target
              ):
                  raise SystemExit('STANDARD_FAILURE_RUNTIME_TARGET:' + relative)
              payload = target.read_bytes()
              total += len(payload)
              if len(payload) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('STANDARD_FAILURE_RUNTIME_SIZE')
              if hashlib.sha256(payload).hexdigest() != expected:
                  raise SystemExit('STANDARD_FAILURE_RUNTIME_FILE_SHA:' + relative)
          print('UAART_TRUSTED_RUNTIME_CLOSURE_VALIDATED')
          PY
            python3 -I automation/control_plane.py verify-mode
            python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
              --sha256 "$REQUEST_SHA256"
            TASK_ID="$(python3 -I - <<'PY'
          import json, os
          print(json.load(open(os.environ['REQUEST_PATH'], encoding='utf-8'))['task_id'])
          PY
            )"
            python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
              --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
              --claim-path "$CLAIM_PATH"
            FAILURE_MODE_ARGS=()
            if test "$GITHUB_RUN_ATTEMPT" != '1'; then
              FAILURE_MODE_ARGS+=(--terminal)
            fi
            python3 -I automation/control_plane.py fail "$REQUEST_PATH" \
              --run-id "$RUN_ID" \
              --message "STANDARD isolated execution/persistence failed or rejected Production; inspect GitHub Actions run ${GITHUB_RUN_ID}" \
              "${FAILURE_MODE_ARGS[@]}"
            rm -f "$INDEX"
            GIT_INDEX_FILE="$INDEX" git read-tree "$PARENT"
            test -f "$CLAIM_PATH" && test ! -L "$CLAIM_PATH"
            BLOB="$(git hash-object -w -- "$CLAIM_PATH")"
            GIT_INDEX_FILE="$INDEX" git update-index --add \
              --cacheinfo "100644,${BLOB},${CLAIM_PATH}"
            TREE="$(GIT_INDEX_FILE="$INDEX" git write-tree)"
            export GIT_AUTHOR_NAME='ua-art-standard-pipeline'
            export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            COMMIT="$(printf '%s\n' 'uaart standard: record isolated pipeline failure' | \
              git commit-tree "$TREE" -p "$PARENT")"
            mapfile -d '' CHANGED < <(git diff-tree --no-commit-id --name-only \
              -r -z "$PARENT" "$COMMIT")
            test "${#CHANGED[@]}" -eq 1
            test "${CHANGED[0]}" = "$CLAIM_PATH"
            cd "$GITHUB_WORKSPACE"
            if git_with_auth push origin "$COMMIT:refs/heads/main"; then
              unset AUTH_HEADER
              break
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Keep rejected or failed STANDARD execution failed
        shell: bash
        run: exit 1
