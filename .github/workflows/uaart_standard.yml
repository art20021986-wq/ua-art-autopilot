              manifest.get('schema_version') != 'UA-ART-DATA-EVIDENCE-1'
              or manifest.get('task_class') != 'STANDARD'
              or manifest.get('request_path') != spec['request_path']
              or manifest.get('request_sha256') != spec['request_sha256']
