name: Korea Auction Morning Collect

# Read-only: 10:00, 12:00, 14:00 Korea time (UTC+9), Mon-Sat (owner decision 2026-11-10).
on:
  schedule:
    - cron: '0 1,3,5 * * 1-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: korea-auction-collect
  cancel-in-progress: false

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false

      - name: Unit tests
        working-directory: automation
        run: python3 -m unittest korea_auction.test_korea_auction

      - name: Collect next-day Korea lots (JPAUTO-KOREA-001)
        working-directory: automation
        env:
          JPAUTO_EMAIL: ${{ secrets.JPAUTO_EMAIL }}
          JPAUTO_PASSWORD: ${{ secrets.JPAUTO_PASSWORD }}
        run: python3 -m korea_auction.collect "$RUNNER_TEMP/korea_lots.json"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: korea-lots
          path: ${{ runner.temp }}/korea_lots.json
          if-no-files-found: ignore
          retention-days: 7
