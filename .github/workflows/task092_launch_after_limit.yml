name: TASK092 LAUNCH AFTER LIMIT UPDATE

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task092_launch_after_limit.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: task092-claude-autopilot
  cancel-in-progress: false

jobs:
  run-task092:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate exact TASK 092
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          tasks = list(pathlib.Path('tasks').glob('task_*.md'))
          if not tasks:
              raise SystemExit('NO_TASKS')

          def key(path):
              match = re.fullmatch(r'task_(\d+)(.*)\.md', path.name)
              if not match:
                  return (-1, 0, path.name)
              return (int(match.group(1)), 1 if match.group(2) == '' else 0, path.name)

          latest = max(tasks, key=key)
          print('LATEST_TASK', latest.name)
          if latest.name != 'task_092.md':
              raise SystemExit('TASK_092_NOT_LATEST')
          PY

      - name: Run autonomous Claude worker for TASK 092
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_TOTAL_BUDGET_SECONDS: '1500'
          ANTHROPIC_NETWORK_ATTEMPTS: '4'
          ANTHROPIC_MAX_TOKENS: '128000'
          ANTHROPIC_STREAM_IDLE_TIMEOUT_SECONDS: '120'
        run: python3 automation/claude_worker.py

      - name: Commit TASK 092 Claude outputs
        shell: bash
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No Claude output changes'
            exit 1
          fi

          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Claude autopilot: process TASK 092 after limit update'

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 0 ]; then
                git rebase --abort || true
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "${path}" in
                  cloud/latest_status.md|cloud/owner_reply.md) ;;
                  *)
                    echo "Unsafe rebase conflict: ${path}"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done
              for path in "${conflicts[@]}"; do
                git checkout --theirs -- "${path}"
                git add -- "${path}"
              done
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          exit 1
