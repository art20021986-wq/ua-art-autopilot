name: Claude Autopilot

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'tasks/task_*.md'
      - 'tasks/task_*.txt'

permissions:
  contents: write

concurrency:
  group: claude-autopilot
  cancel-in-progress: false

jobs:
  run-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SITE HEALTH precheck
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.uaart.com.ua/video/index.html'
          echo "Checking ${url}"
          for attempt in 1 2 3; do
            code="$(curl -L --connect-timeout 8 --max-time 20 -sS -o /tmp/site.html -w '%{http_code}' "$url" || true)"
            if [ "$code" = '200' ] && [ -s /tmp/site.html ]; then
              echo 'SITE_HEALTH=PASS'
              exit 0
            fi
            echo "SITE_HEALTH attempt ${attempt}/3 failed: HTTP ${code:-000}"
            sleep 5
          done
          echo 'SITE_HEALTH=FAIL — autopilot start blocked'
          exit 1

      - name: Normalize task intake for worker
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for src in tasks/task_*.txt; do
            base="${src%.txt}"
            dst="${base}.md"
            if [ ! -e "$dst" ] || [ "$src" -nt "$dst" ]; then
              cp "$src" "$dst"
              echo "Normalized $src -> $dst"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = list(Path('tasks').glob('task_*.md'))
          def key(p):
              m = re.fullmatch(r'task_(\d+)(.*)\.md', p.name)
              if not m:
                  return (-1, 0, p.name)
              return (int(m.group(1)), 1 if m.group(2) == '' else 0, p.name)
          if not files:
              raise SystemExit('NO_TASK_AFTER_NORMALIZATION')
          selected = max(files, key=key)
          print(f'ROUTED_TASK={selected}')
          PY

      - name: Run autonomous Claude worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          ANTHROPIC_TOTAL_BUDGET_SECONDS: '1500'
          ANTHROPIC_NETWORK_ATTEMPTS: '4'
          ANTHROPIC_MAX_TOKENS: '128000'
          ANTHROPIC_STREAM_IDLE_TIMEOUT_SECONDS: '120'
        run: python3 automation/claude_worker.py

      - name: Commit Claude outputs
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No cloud changes'
            exit 0
          fi
          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Claude autopilot: process latest task'

          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo 'Rebase failed without resolvable conflicts'
                git rebase --abort || true
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "$path" in
                  cloud/latest_status.md|cloud/owner_reply.md) ;;
                  *)
                    echo "Rebase conflict outside shared status files: $path"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done
              for path in "${conflicts[@]}"; do
                git checkout --theirs -- "$path"
                git add -- "$path"
              done
              if ! GIT_EDITOR=true git rebase --continue; then
                echo 'Rebase continuation failed after bounded status resolution'
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          echo 'Push failed after 5 safe retries'
          exit 1
