name: Claude Autopilot

on:
  push:
    branches: [main]
    paths:
      - 'tasks/**'
      - 'CLAUDE.md'
      - 'automation/claude_worker.py'
      - '.github/workflows/claude_autopilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-autopilot
  cancel-in-progress: false

jobs:
  run-claude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run autonomous Claude worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
        run: python3 automation/claude_worker.py
      - name: Commit Claude outputs
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No cloud changes'
            exit 0
          fi
          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Claude autopilot: process latest task'

          # Never force-push main. Rebase the generated cloud-only commit onto
          # the newest main and retry if another safe automation advanced it.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              echo 'Rebase conflict: refusing to overwrite main'
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          echo 'Push failed after 5 safe retries'
          exit 1
