name: Claude Autopilot

on:
  push:
    branches: [main]
    paths:
      - 'tasks/**'
      - 'CLAUDE.md'
      - 'automation/claude_worker.py'
      - '.github/workflows/claude_autopilot.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-autopilot
  # Preserve task order. A newer task waits instead of cancelling an older
  # Claude request, so TASK N cannot silently replace TASK N-1 mid-flight.
  cancel-in-progress: false

jobs:
  run-claude:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run autonomous Claude worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Leave ten minutes of the job budget for validation, commit and rebase.
          ANTHROPIC_TOTAL_BUDGET_SECONDS: '1500'
          ANTHROPIC_NETWORK_ATTEMPTS: '4'
          # Sonnet 5 adaptive thinking counts toward max_tokens; TASK 021 reached
          # the former 64k ceiling before completing its structured deliverables.
          ANTHROPIC_MAX_TOKENS: '128000'
          # Streaming emits heartbeats during long structured generations; retry
          # only when the stream itself is silent for two minutes.
          ANTHROPIC_STREAM_IDLE_TIMEOUT_SECONDS: '120'
        run: python3 automation/claude_worker.py
      - name: Commit Claude outputs
        run: |
          git add -A -- cloud/
          if git diff --cached --quiet -- cloud/; then
            echo 'No cloud changes'
            exit 0
          fi
          git config user.name 'ua-art-claude-worker'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Claude autopilot: process latest task'

          # Never force-push main. Rebase the generated cloud-only commit onto
          # the newest main and retry if another safe automation advanced it.
          for attempt in 1 2 3 4 5; do
            echo "Push attempt ${attempt}/5"
            git fetch origin main
            if ! git rebase origin/main; then
              # Concurrent tasks are allowed to update the two shared status
              # files. During a rebase, keep the status produced by the task
              # commit being applied ("theirs"). Any code/content conflict
              # outside these two exact paths still aborts fail-closed.
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              if [ "${#conflicts[@]}" -eq 0 ]; then
                echo 'Rebase failed without resolvable conflicts'
                git rebase --abort || true
                exit 1
              fi
              for path in "${conflicts[@]}"; do
                case "${path}" in
                  cloud/latest_status.md|cloud/owner_reply.md) ;;
                  *)
                    echo "Rebase conflict outside shared status files: ${path}"
                    git rebase --abort || true
                    exit 1
                    ;;
                esac
              done
              for path in "${conflicts[@]}"; do
                git checkout --theirs -- "${path}"
                git add -- "${path}"
              done
              if ! GIT_EDITOR=true git rebase --continue; then
                echo 'Rebase continuation failed after bounded status resolution'
                git rebase --abort || true
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            if [ "${attempt}" -lt 5 ]; then
              sleep $((attempt * 3))
            fi
          done
          echo 'Push failed after 5 safe retries'
          exit 1
