name: SEO Sitemap Route Install
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo_sitemap_route_audit.yml'
permissions:
  contents: read
concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false
jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Test route installation without production access
        run: python3 -m unittest discover -s cloud/gsc_root_route_20260928 -p 'test_*.py' -v
      - name: Install exact root sitemap mapping only
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, socket, time, urllib.parse, urllib.request, urllib.error
          token=os.environ["PA_TOKEN"]; base="https://www.pythonanywhere.com/api/v0/user/Carix/"
          domain="www.uaart.com.ua"; route="/sitemap.xml"; path="/home/Carix/video/sitemap.xml"
          def call(method,url,data=None,headers=None,allowed=(200,),timeout=30,allow_timeout=False):
              h={"Authorization":"Token "+token,"User-Agent":"ua-art-seo-sitemap-route/1"}; h.update(headers or {})
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=timeout) as r:return r.status,r.read()
              except urllib.error.HTTPError as e:
                  body=e.read()
                  if e.code in allowed:return e.code,body
                  raise
              except (TimeoutError,socket.timeout):
                  if allow_timeout:return 0,b""
                  raise
          ep=base+"webapps/"+domain+"/static_files/"
          _,raw=call("GET",ep); cur=json.loads(raw.decode())
          if isinstance(cur,dict): items=[{"url":k,"path":v} for k,v in cur.items()]
          elif isinstance(cur,list): items=cur
          else: raise SystemExit("STATIC_ROUTES_INVALID_RESPONSE")
          if not all(isinstance(x,dict) and isinstance(x.get("url"),str) and isinstance(x.get("path"),str) for x in items):
              raise SystemExit("STATIC_ROUTES_INVALID_RESPONSE")
          for x in items:
              if x.get("url")==route and x.get("path")!=path: raise SystemExit("SITEMAP_ROUTE_CONFLICT")
          if not any(x.get("url")==route and x.get("path")==path for x in items):
              data=urllib.parse.urlencode({"url":route,"path":path}).encode()
              call("POST",ep,data,{"Content-Type":"application/x-www-form-urlencoded"},(200,201))
              print("SEO_SITEMAP_ROUTE_CREATED_RELOAD_REQUIRED")
              # An existing mapping needs verification, not another traffic-dropping reload.
              call("POST",base+"webapps/"+domain+"/reload/",b"",allowed=(200,),timeout=12,allow_timeout=True)
          else:
              print("SEO_SITEMAP_ROUTE_UNCHANGED_RELOAD_SKIPPED")
          deadline=time.time()+120
          while time.time()<deadline:
              try:
                  req=urllib.request.Request("https://www.uaart.com.ua/sitemap.xml?verify="+str(int(time.time())),headers={"Cache-Control":"no-cache"})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode("utf-8","replace")
                      if r.status==200 and ("<urlset" in body or "<sitemapindex" in body):
                          print("SEO_SITEMAP_ROUTE_PASS"); raise SystemExit(0)
              except Exception: pass
              time.sleep(5)
          raise SystemExit("SEO_SITEMAP_ROUTE_VERIFY_TIMEOUT")
          PY
