name: SEO Sitemap Route Audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/seo_sitemap_route_audit.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read sitemap and robots static mappings
        env:
          PA_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          u="https://www.pythonanywhere.com/api/v0/user/Carix/webapps/www.uaart.com.ua/static_files/"
          req=urllib.request.Request(u,headers={"Authorization":"Token "+os.environ["PA_TOKEN"]})
          with urllib.request.urlopen(req,timeout=30) as r:d=json.load(r)
          if isinstance(d,dict): items=[{"url":k,"path":v} for k,v in d.items()]
          else: items=d
          print(json.dumps([x for x in items if x.get("url") in ("/sitemap.xml","/robots.txt")],indent=2))
          PY
