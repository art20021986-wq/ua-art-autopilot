name: TASK 080 price candidate Gate A

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/task080_price_candidate.yml"
      - "cloud/task_080_price_recognition/candidate_gate_a.py"
      - "cloud/task_080_price_recognition/run_tests.py"
      - "cloud/task_080_price_recognition/src/price_parser.py"
      - "cloud/task_080_price_recognition/src/crm_price_atomic.py"
      - "cloud/task_080_price_recognition/src/integration_patcher.py"
      - "cloud/task_080_price_recognition/tests/test_price_parser.py"
      - "cloud/task_080_price_recognition/tests/test_crm_price_atomic.py"
      - "cloud/task_080_price_recognition/tests/test_integration_patcher.py"

permissions:
  contents: write

concurrency:
  group: task080-price-candidate
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile candidate tooling
        run: >-
          python -m py_compile
          cloud/task_080_price_recognition/src/price_parser.py
          cloud/task_080_price_recognition/src/crm_price_atomic.py
          cloud/task_080_price_recognition/src/integration_patcher.py
          cloud/task_080_price_recognition/candidate_gate_a.py
          cloud/task_080_price_recognition/run_tests.py

      - name: Run deterministic sandbox and canary tests
        run: python cloud/task_080_price_recognition/run_tests.py

      - name: GET live sources and compile exact in-memory candidate
        run: python cloud/task_080_price_recognition/candidate_gate_a.py

      - name: Assert no production mutation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("cloud/task_080_price_recognition/evidence/candidate_gate_a.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          assert data["status"] == "PASS_IN_MEMORY_CANDIDATE"
          assert data["http_methods"] == ["GET"]
          for key in ("production_write", "database_write", "site_write", "process_restart"):
              assert data[key] is False, (key, data[key])
          assert data["candidate_files_persisted"] is False
          assert len(data["changed_blocks"]) == 9
          print("TASK080_NO_MUTATION_ASSERTIONS PASS")
          PY

      - name: Commit sanitized Gate A evidence
        if: always()
        run: |
          git config user.name "ua-art-task080-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            cloud/task_080_price_recognition/evidence/candidate_gate_a.json \
            cloud/task_080_price_recognition/CANDIDATE_GATE_A_REPORT.md
          if git diff --cached --quiet; then
            echo "No evidence changes"
            exit 0
          fi
          git commit -m "Record TASK 080 in-memory candidate Gate A"
          git pull --rebase origin main
          git push origin HEAD:main
