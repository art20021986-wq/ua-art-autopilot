name: task082-vin4-live-source-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task082_live_source_probe.yml'
      - 'cloud/task_082_live_source_probe.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task082-vin4-live-source-probe
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Compile and prove GET-only transport
        run: |
          python3 -m py_compile cloud/task_082_live_source_probe.py
          python3 - <<'PY'
          from pathlib import Path
          value = Path('cloud/task_082_live_source_probe.py').read_text(encoding='utf-8')
          assert 'method="GET"' in value
          for forbidden in ('method="POST"', 'method="PUT"', 'method="PATCH"', 'method="DELETE"'):
              assert forbidden not in value
          print('TASK082_STATIC_GET_ONLY_PASS')
          PY

      - name: Read live renderer and sanitized VIN4
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_082_live_source_probe.py

      - name: Validate sanitized evidence
        run: |
          python3 - <<'PY'
          import json
          path = 'cloud/task_082_probe/evidence.json'
          value = json.load(open(path, encoding='utf-8'))
          assert value['status'] == 'PASS', value['errors']
          assert value['production_touched'] is False
          assert value['http_methods'] == ['GET']
          assert value['db']['quick_check'] == 'ok'
          assert value['db']['count'] == 13
          assert [c['id'] for c in value['db']['cards']] == ['UA-%04d' % n for n in range(1, 14)]
          assert all(c['vin_valid'] and len(c['vin4']) == 4 for c in value['db']['cards'])
          assert set(value['cars_ui']['definitions']) == {'render','card_kb','open_card','cars_list'}
          print('TASK082_LIVE_PROBE_PASS')
          PY

      - name: Commit bounded evidence
        run: |
          git add -- cloud/task_082_probe/evidence.json
          mapfile -t staged < <(git diff --cached --name-only)
          for path in "${staged[@]}"; do
            test "$path" = 'cloud/task_082_probe/evidence.json'
          done
          if [ "${#staged[@]}" -eq 0 ]; then exit 0; fi
          git config user.name 'task082-vin4-probe'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task082: record live CRM title renderer and VIN4 evidence'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then git rebase --abort || true; exit 1; fi
            if git push origin HEAD:main; then exit 0; fi
            test "$attempt" -lt 5 || exit 1
            sleep $((attempt * 3))
          done

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task082-vin4-probe-${{ github.run_id }}
          path: cloud/task_082_probe/evidence.json
          if-no-files-found: warn
          retention-days: 14
