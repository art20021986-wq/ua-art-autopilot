name: TASK099 Exact Partial Install Recovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task099_partial_recovery.yml'
      - 'cloud/task_099_partial_recovery/**'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: task099-site-crm-production
  cancel-in-progress: false

jobs:
  recover-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TASK099_OWNER_APPROVAL: UA_ART_TASK099_SITE_CRM_PRODUCTION_APPROVED
    steps:
      - name: Checkout exact recovery revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify recovery payload
        run: |
          set -euo pipefail
          python -m py_compile \
            cloud/task_099_partial_recovery/task099_partial_recovery_controller.py \
            cloud/task_099_partial_recovery/task099_partial_recovery_remote.py \
            cloud/task_099_site_crm_repair/task099_visual.py \
            cloud/task_099_site_crm_repair/task099_finalize.py

      - name: Probe lock and resume exact partial install
        id: recovery
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u cloud/task_099_partial_recovery/task099_partial_recovery_controller.py

      - name: Install pinned browser verifier
        if: steps.recovery.outcome == 'success'
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check playwright==1.58.0
          python -m playwright install --with-deps chromium

      - name: Run all 16 browser-rendered mobile and desktop gates
        if: steps.recovery.outcome == 'success'
        id: visual
        continue-on-error: true
        run: python -u cloud/task_099_site_crm_repair/task099_visual.py

      - name: Roll back if browser gate failed
        if: always() && steps.recovery.outcome == 'success' && steps.visual.outcome != 'success'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -u cloud/task_099_partial_recovery/task099_partial_recovery_controller.py --rollback

      - name: Create authoritative PASS evidence
        if: steps.recovery.outcome == 'success' && steps.visual.outcome == 'success'
        id: finalize
        continue-on-error: true
        run: python cloud/task_099_site_crm_repair/task099_finalize.py

      - name: Record FAIL without false PASS
        if: always() && steps.finalize.outcome != 'success'
        run: |
          python - <<'PY'
          import datetime,json,os,pathlib
          root=pathlib.Path('.')
          gate=root/'cloud/task_099_site_crm_repair/evidence/production_gate.json'
          production=json.loads(gate.read_text()) if gate.exists() else {'status':'BLOCKED','errors':['RECOVERY_GATE_NOT_COMPLETED']}
          visual_path=root/'cloud/task_099_site_crm_repair/evidence/visual_evidence.json'
          visual=json.loads(visual_path.read_text()) if visual_path.exists() else {'status':'NOT_RUN','errors':[]}
          value={'task_id':'task_099','contract_id':'UA-ART-16-SITE-CRM-COMPLETION-099-V1','status':'FAIL',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),'workflow_sha':os.environ.get('GITHUB_SHA'),
            'production_status':production.get('status'),'production_errors':production.get('errors') or [],
            'visual_status':visual.get('status'),'visual_errors':visual.get('errors') or [],
            'issue_35_ready_to_close':False,'issue_35_closed':False,'github_comment_published':False,
            'newer_fail_observed':True}
          path=root/'evidence/deploy.json';path.parent.mkdir(parents=True,exist_ok=True)
          path.write_text(json.dumps(value,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit recovery evidence and screenshots
        if: always()
        run: |
          set -euo pipefail
          for path in evidence/deploy.json cloud/task_099_site_crm_repair/evidence/production_gate.json \
            cloud/task_099_site_crm_repair/evidence/visual_evidence.json \
            cloud/task_099_site_crm_repair/evidence/issue35_comment.md \
            cloud/task_099_site_crm_repair/evidence/screenshots; do
            if [ -e "$path" ]; then git add -A -- "$path"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git config user.name task099-recovery
          git config user.email actions@users.noreply.github.com
          git commit -m 'task099: record exact partial recovery evidence'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
              for path in "${conflicts[@]}"; do
                case "$path" in evidence/deploy.json|cloud/task_099_site_crm_repair/evidence/*) ;; *) exit 1 ;; esac
              done
              for path in "${conflicts[@]}"; do git checkout --theirs -- "$path"; git add -- "$path"; done
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          exit 1

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task099-partial-recovery-${{ github.run_id }}
          path: |
            evidence/deploy.json
            cloud/task_099_site_crm_repair/evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Require final PASS
        if: always()
        run: |
          python - <<'PY'
          import json,pathlib
          value=json.loads(pathlib.Path('evidence/deploy.json').read_text())
          assert value.get('status') == 'PASS', value
          assert value.get('issue_35_closed') is False
          assert value.get('github_comment_published') is False
          print('TASK099_PARTIAL_RECOVERY_FINAL_PASS')
          PY
