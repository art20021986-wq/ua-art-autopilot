name: task086-public-catalog-readonly-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task086_public_catalog_readonly_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public catalog controls without writes
        run: |
          python3 - <<'PY'
          import re
          import urllib.request
          url = "https://www.uaart.com.ua/video/katalog.html?task086_probe=202608300041"
          request = urllib.request.Request(url, headers={"User-Agent":"UA-ART-readonly-probe/1"})
          with urllib.request.urlopen(request, timeout=30) as response:
              source = response.read().decode("utf-8", "replace")
          print("HTTP_BYTES", len(source))
          print("ARTICLE_COUNT", len(re.findall(r"<article\\b", source, re.I)))
          controls = re.findall(r"<(?:button|a)\\b[^>]*>.*?</(?:button|a)\\s*>", source, re.I | re.S)
          selected = []
          for block in controls:
              if re.search(r"Все|Усі|паром|пором|Коре|Киє|Киев|Груз|Грузі|filter|count|data-f", block, re.I):
                  selected.append(re.sub(r"\\s+", " ", block).strip()[:1200])
          print("CONTROL_COUNT", len(selected))
          for index, value in enumerate(selected[:30], 1):
              print("CONTROL_%02d %s" % (index, value))
          scripts = re.findall(r"<script\\b[^>]*>.*?</script\\s*>", source, re.I | re.S)
          for index, block in enumerate(scripts, 1):
              lines = [
                  re.sub(r"\\s+", " ", line).strip()
                  for line in block.splitlines()
                  if re.search(r"filter|dataset|stage|count|catalog-card|data-f", line, re.I)
              ]
              for line in lines[:30]:
                  print("SCRIPT_%02d %s" % (index, line[:1200]))
          PY
