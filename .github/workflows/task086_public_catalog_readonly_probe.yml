# fresh: homepage-and-catalog-2026-08-30
name: task086-public-catalog-readonly-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task086_public_catalog_readonly_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public homepage and catalog without writes
        run: |
          python3 - <<'PY'
          import collections
          import json
          import re
          import urllib.request

          urls = {
              "HOME": "https://www.uaart.com.ua/video/index.html?task086_probe=202608300054",
              "CATALOG": "https://www.uaart.com.ua/video/katalog.html?task086_probe=202608300054",
          }
          for label, url in urls.items():
              request = urllib.request.Request(
                  url, headers={"User-Agent": "UA-ART-readonly-probe/2"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  source = response.read().decode("utf-8", "replace")
              stages = collections.Counter(
                  value.casefold() for value in re.findall(
                      r'data-(?:ua-card-stage|stage|etap)\s*=\s*["\']([^"\']+)',
                      source, re.I))
              identifiers = sorted(set(re.findall(r"UA-[0-9]{4,}", source, re.I)))
              print(label + "_HTTP_BYTES", len(source))
              print(label + "_IDS", json.dumps(identifiers))
              print(label + "_STAGES", json.dumps(stages, sort_keys=True))
              print(label + "_ARTICLES", len(re.findall(r"<article\\b", source, re.I)))
              print(label + "_STAGE_V2", len(re.findall(r"ua-stage-card-v2", source, re.I)))
              for term in ("На пароме", "На поромі", "UA-0011", "13 в подборке"):
                  positions = [m.start() for m in re.finditer(re.escape(term), source, re.I)]
                  print(label + "_TERM", term, len(positions))
                  for index, position in enumerate(positions[:4], 1):
                      snippet = re.sub(
                          r"\\s+", " ",
                          source[max(0, position - 550):position + 1050],
                      ).strip()
                      print("%s_%s_%02d %s" % (
                          label, term.replace(" ", "_"), index, snippet[:1600]))
          PY
