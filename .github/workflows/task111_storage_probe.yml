name: TASK111 Production Storage Probe

on:
  push:
    branches:
      - task111-vin-spec-10src
      - task111-vin-spec-10src-final
    paths:
      - tasks/launch/TASK111-STORAGE-PROBE.json

permissions:
  contents: write

concurrency:
  group: task111-production-storage-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Collect read-only target measurement
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile cloud/task109_container_inline/storage_probe_controller.py cloud/task109_container_inline/storage_probe_remote.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('tasks/launch/TASK109-STORAGE-PROBE.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          value['scope'] = 'PRODUCTION_TARGET_READ_ONLY_MEASUREMENT'
          path.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          python3 cloud/task109_container_inline/storage_probe_controller.py
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          source = Path('state/storage/TASK109-CONTAINER-TRACK-INLINE.json')
          target = Path('state/storage/TASK111-VIN-SPEC-10SRC.json')
          value = json.loads(source.read_text(encoding='utf-8'))
          # shutil.disk_usage reports the shared PythonAnywhere NFS volume, not
          # this account's quota.  Keep that observation for diagnostics, but
          # gate the release against the fixed 35 GiB account quota and a fresh,
          # conservative sum of the target-side du measurements.
          global_volume = {
              'total_bytes': value['total_bytes'],
              'used_bytes': value['used_bytes'],
              'free_bytes': value['free_bytes'],
              'measurement': value['measurement'],
          }
          du = value['diagnostics']['official_du_bytes']
          du_rows = [line.split('\t', 1) for line in du.get('stdout', '').splitlines() if line.strip()]
          if not du_rows or any(len(row) != 2 or not row[0].isdigit() for row in du_rows):
              raise SystemExit('official target-side du output is invalid')
          stderr_rows = [line.strip() for line in du.get('stderr', '').splitlines() if line.strip()]
          volatile_sqlite_race = re.compile(
              r"^du: cannot access '/home/Carix/vin_specs\.db-(?:wal|shm)': No such file or directory$"
          )
          unexpected_stderr = [line for line in stderr_rows if not volatile_sqlite_race.fullmatch(line)]
          if du.get('returncode') not in (0, 1) or unexpected_stderr:
              raise SystemExit('official target-side du failed')
          if du.get('returncode') == 1 and not stderr_rows:
              raise SystemExit('official target-side du failed without a bounded volatile-file reason')
          du['accepted_volatile_sqlite_race'] = bool(stderr_rows)
          used_bytes = sum(int(row[0]) for row in du_rows)
          total_bytes = 35 * 1024 ** 3
          if used_bytes <= 0 or used_bytes >= total_bytes:
              raise SystemExit('account-scoped storage measurement is outside safe bounds')
          value['global_volume_observation'] = global_volume
          value['total_bytes'] = total_bytes
          value['used_bytes'] = used_bytes
          value['free_bytes'] = total_bytes - used_bytes
          value['measurement'] = 'PythonAnywhere account quota (35.0 GiB) plus fresh official target-side du bytes'
          value['quota_observation'] = {
              'scope': 'account',
              'total_display': '35.0 GiB',
              'basis': 'fixed PythonAnywhere account storage quota',
              'used_basis': 'fresh conservative sum of /tmp, /home/Carix, and /var/www du bytes',
          }
          value['task_id'] = 'TASK111-VIN-SPEC-10SRC'
          target.write_text(json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY

      - name: Commit fresh immutable probe
        shell: bash
        run: |
          set -euo pipefail
          git restore -- tasks/launch/TASK109-STORAGE-PROBE.json
          git restore -- state/storage/TASK109-CONTAINER-TRACK-INLINE.json
          git add -- state/storage/TASK111-VIN-SPEC-10SRC.json
          git config user.name 'ua-art-storage-probe'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'TASK111: record fresh read-only production storage probe'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
