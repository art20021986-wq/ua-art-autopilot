name: TASK096 Enrichment Repair v7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task096_enrichment_repair_v7.yml'
      - 'automation/task096_enrichment_repair_v7.py'
      - 'automation/task096_enrichment_repair_v2.py'
      - 'cloud/task_096_tech_spec_ai_crm/data_enrichment/remote_semantic_cleanup.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task096-autorun
  cancel-in-progress: false

jobs:
  sandbox-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify sandbox guards and compile
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^OWNER_APPROVED: YES$' tasks/task096_autorun_orchestrator_v1_approval.md
          grep -q '^PRODUCTION_AUTHORIZED: NO$' tasks/task096_autorun_orchestrator_v1_approval.md
          python - <<'PY'
          from pathlib import Path
          p=Path('automation/task096_data_enrichment_controller.py')
          s=p.read_text(encoding='utf-8')
          old='{"\\n\\n".join(source_blocks)}'
          new='{(chr(10)*2).join(source_blocks)}'
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python -m py_compile automation/task096_data_enrichment_controller.py automation/task096_enrichment_repair_v2.py automation/task096_enrichment_repair_v7.py cloud/task_096_tech_spec_ai_crm/data_enrichment/remote_semantic_cleanup.py
      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.15.0
      - name: Run durable sandbox enrichment
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL: claude-sonnet-5
        run: PYTHONPATH=automation python -u automation/task096_enrichment_repair_v7.py
      - name: Require 16-card sandbox, canary, dedup and safety PASS
        shell: bash
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path('cloud/task_096_tech_spec_ai_crm/data_enrichment')
          e=json.loads((root/'evidence.json').read_text())
          ids=[f'UA-{n:04d}' for n in range(1,17)]
          assert e.get('status') in ('PASS','PASS_WITH_WARNINGS'), e
          assert (e.get('canary') or {}).get('status') == 'PASS', e.get('canary')
          assert sorted(set((e.get('batch') or {}).get('processed_uids') or [])) == ids
          assert e.get('semantic_dedup_pass') is True
          for key in ('production_touched','live_crm_write','main_fields_changed','public_path_write','bot_code_changed','services_restarted','autopublication','purchase_price_extracted','purchase_price_logged','purchase_price_uploaded','production_authorized'):
              assert e.get(key) is False, (key,e.get(key))
          print('TASK096_V7_ALL_GATES_PASS')
          PY
      - name: Commit sanitized PASS evidence for downstream production gate
        shell: bash
        run: |
          set -euo pipefail
          git add -- cloud/task_096_tech_spec_ai_crm/data_enrichment/evidence.json cloud/task_096_tech_spec_ai_crm/data_enrichment/cards_summary.json cloud/task_096_tech_spec_ai_crm/data_enrichment/report.md cloud/task_096_tech_spec_ai_crm/data_enrichment/ua0015_preview.html
          if git diff --cached --quiet; then exit 0; fi
          git config user.name task096-sandbox
          git config user.email actions@users.noreply.github.com
          git commit -m 'task096: record v7 sandbox PASS evidence'
          for attempt in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task096-enrichment-repair-v7-${{ github.run_id }}
          path: cloud/task_096_tech_spec_ai_crm/data_enrichment/
          if-no-files-found: error
          retention-days: 14
