name: UA ART Central Task Orchestrator

on:
  workflow_call:
    inputs:
      request_path:
        required: true
        type: string
      expected_request_sha256:
        required: false
        default: ''
        type: string
      autostart_ledger_path:
        required: false
        default: ''
        type: string
      autostart_source_commit:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

# Conservative safety mode: the entire orchestrator run, including its routed
# reusable workflow, is globally serialized on the only authorized branch.
# Class workflows retain their exact resource locks for defense in depth.
concurrency:
  group: uaart-intake-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      attestation_sha256: ${{ steps.attestation.outputs.attestation_sha256 }}
      source_commit: ${{ steps.claim.outputs.source_commit }}
      runtime_manifest_sha256: ${{ steps.claim.outputs.runtime_manifest_sha256 }}
      orchestrator_blob_oid: ${{ steps.claim.outputs.orchestrator_blob_oid }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      EXPECTED_REQUEST_SHA256: ${{ inputs.expected_request_sha256 }}
      AUTOSTART_LEDGER_PATH: ${{ inputs.autostart_ledger_path }}
      AUTOSTART_SOURCE_COMMIT: ${{ inputs.autostart_source_commit }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_GITHUB_REF: ${{ github.ref }}
      WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout isolated read-only intake state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate exact request and build an ephemeral claim
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_GITHUB_REF" = 'refs/heads/main'
          test "$RUN_ATTEMPT" = '1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test -n "$REQUEST_PATH"
          source_commit="$(git rev-parse refs/remotes/origin/main)"
          [[ "$source_commit" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$WORKFLOW_SOURCE_COMMIT" "$source_commit"
          orchestrator_blob_oid="$(
            git rev-parse "$WORKFLOW_SOURCE_COMMIT:.github/workflows/uaart_orchestrator.yml"
          )"
          test "$orchestrator_blob_oid" = "$(
            git rev-parse "$source_commit:.github/workflows/uaart_orchestrator.yml"
          )"
          runtime_manifest_sha256="$(
            sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1
          )"
          python3 -I -W error -m py_compile \
            automation/control_plane.py automation/execution_contract.py
          python3 -I automation/control_plane.py verify-mode
          expected_args=()
          if test -n "$EXPECTED_REQUEST_SHA256"; then
            expected_args+=(--expected-sha256 "$EXPECTED_REQUEST_SHA256")
          fi
          ledger_args=()
          if test -n "$AUTOSTART_LEDGER_PATH"; then
            ledger_args+=(--autostart-ledger "$AUTOSTART_LEDGER_PATH")
          fi
          source_args=()
          if test -n "$AUTOSTART_SOURCE_COMMIT"; then
            source_args+=(--autostart-source-commit "$AUTOSTART_SOURCE_COMMIT")
          fi
          python3 -I automation/control_plane.py claim "$REQUEST_PATH" \
            --run-id "$RUN_ID" --source-commit "$source_commit" \
            "${expected_args[@]}" "${ledger_args[@]}" "${source_args[@]}" \
            >"$RUNNER_TEMP/uaart-intake-claim.json"
          echo "source_commit=${source_commit}" >>"$GITHUB_OUTPUT"
          echo "runtime_manifest_sha256=${runtime_manifest_sha256}" >>"$GITHUB_OUTPUT"
          echo "orchestrator_blob_oid=${orchestrator_blob_oid}" >>"$GITHUB_OUTPUT"

      - name: Bind data-only planning and validate trusted execution package
        env:
          CLAIM_REQUEST_PATH: ${{ steps.claim.outputs.request_path }}
          CLAIM_REQUEST_SHA256: ${{ steps.claim.outputs.request_sha256 }}
          CLAIM_TASK_CLASS: ${{ steps.claim.outputs.task_class }}
        shell: bash
        run: |
          set -euo pipefail
          test "$CLAIM_REQUEST_PATH" = "$REQUEST_PATH"
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$CLAIM_REQUEST_SHA256" \
            >"$RUNNER_TEMP/uaart-intake-exact-request.json"
          python3 -I automation/control_plane.py planning "$REQUEST_PATH" \
            --run-id "$RUN_ID" >"$RUNNER_TEMP/uaart-intake-planning.json"
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class "$CLAIM_TASK_CLASS" \
            >"$RUNNER_TEMP/uaart-intake-contract.json"

      - name: Create strict data-only intake attestation
        id: attestation
        env:
          SOURCE_COMMIT: ${{ steps.claim.outputs.source_commit }}
          RUNTIME_MANIFEST_SHA256: ${{ steps.claim.outputs.runtime_manifest_sha256 }}
          ORCHESTRATOR_BLOB_OID: ${{ steps.claim.outputs.orchestrator_blob_oid }}
          CLAIM_REQUEST_PATH: ${{ steps.claim.outputs.request_path }}
          CLAIM_REQUEST_SHA256: ${{ steps.claim.outputs.request_sha256 }}
          CLAIM_TASK_ID: ${{ steps.claim.outputs.task_id }}
          CLAIM_TASK_CLASS: ${{ steps.claim.outputs.task_class }}
          CLAIM_LOCK_KEY: ${{ steps.claim.outputs.lock_key }}
          CLAIM_PATH: ${{ steps.claim.outputs.claim_path }}
          PLAN_PATH: ${{ steps.claim.outputs.plan_path }}
          CLAIM_PRODUCTION_REQUIRED: ${{ steps.claim.outputs.production_required }}
        shell: bash
        run: |
          set -euo pipefail
          artifact="$RUNNER_TEMP/uaart-intake-attestation"
          mkdir -p "$artifact"
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          production_required = os.environ['CLAIM_PRODUCTION_REQUIRED']
          if production_required not in {'true', 'false'}:
              raise SystemExit('INTAKE_ATTESTATION_PRODUCTION_VALUE')
          claim = {
              'request_path': os.environ['CLAIM_REQUEST_PATH'],
              'request_sha256': os.environ['CLAIM_REQUEST_SHA256'],
              'task_id': os.environ['CLAIM_TASK_ID'],
              'task_class': os.environ['CLAIM_TASK_CLASS'],
              'lock_key': os.environ['CLAIM_LOCK_KEY'],
              'claim_path': os.environ['CLAIM_PATH'],
              'plan_path': os.environ['PLAN_PATH'],
              'production_required': production_required == 'true',
          }
          inputs = {
              'request_path': os.environ['REQUEST_PATH'],
              'expected_request_sha256': os.environ['EXPECTED_REQUEST_SHA256'],
              'autostart_ledger_path': os.environ['AUTOSTART_LEDGER_PATH'],
              'autostart_source_commit': os.environ['AUTOSTART_SOURCE_COMMIT'],
          }
          value = {
              'schema_version': 'UA-ART-INTAKE-ATTESTATION-1',
              'status': 'PASS',
              'github_ref': os.environ['EXPECTED_GITHUB_REF'],
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': int(os.environ['RUN_ATTEMPT']),
              'source_commit': os.environ['SOURCE_COMMIT'],
              'workflow_source_commit': os.environ['WORKFLOW_SOURCE_COMMIT'],
              'runtime_manifest_sha256': os.environ['RUNTIME_MANIFEST_SHA256'],
              'orchestrator_blob_oid': os.environ['ORCHESTRATOR_BLOB_OID'],
              'inputs': inputs,
              'claim': claim,
          }
          target = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-intake-attestation' / 'attestation.json'
          data = (json.dumps(value, ensure_ascii=False, indent=2, sort_keys=True) + '\n').encode()
          target.write_bytes(data)
          digest = hashlib.sha256(data).hexdigest()
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'attestation_sha256={digest}\n')
          PY

      - name: Upload pinned intake attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-intake-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-intake-attestation/attestation.json
          if-no-files-found: error
          retention-days: 1

  plan:
    needs: validate
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      request_path: ${{ steps.persist.outputs.request_path }}
      request_sha256: ${{ steps.persist.outputs.request_sha256 }}
      task_id: ${{ steps.persist.outputs.task_id }}
      task_class: ${{ steps.persist.outputs.task_class }}
      lock_key: ${{ steps.persist.outputs.lock_key }}
      claim_path: ${{ steps.persist.outputs.claim_path }}
      production_required: ${{ steps.persist.outputs.production_required }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      EXPECTED_REQUEST_SHA256: ${{ inputs.expected_request_sha256 }}
      AUTOSTART_LEDGER_PATH: ${{ inputs.autostart_ledger_path }}
      AUTOSTART_SOURCE_COMMIT: ${{ inputs.autostart_source_commit }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      EXPECTED_GITHUB_REF: ${{ github.ref }}
      EXPECTED_ATTESTATION_SHA256: ${{ needs.validate.outputs.attestation_sha256 }}
      EXPECTED_SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      EXPECTED_RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      EXPECTED_ORCHESTRATOR_BLOB_OID: ${{ needs.validate.outputs.orchestrator_blob_oid }}
      WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout clean trusted main for intake persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download isolated intake attestation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uaart-intake-attestation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-intake-import

      - name: Strictly validate data-only intake attestation
        id: attestation
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          def reject_duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('INTAKE_ATTESTATION_DUPLICATE_KEY')
                  value[key] = item
              return value

          imported = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-intake-import'
          if imported.is_symlink() or not imported.is_dir():
              raise SystemExit('INTAKE_ATTESTATION_DIRECTORY')
          actual = []
          for path in imported.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('INTAKE_ATTESTATION_SYMLINK')
              if path.is_file():
                  actual.append(path.relative_to(imported).as_posix())
              elif path.is_dir():
                  raise SystemExit('INTAKE_ATTESTATION_DIRECTORY_ENTRY')
              else:
                  raise SystemExit('INTAKE_ATTESTATION_SPECIAL_FILE')
          if actual != ['attestation.json']:
              raise SystemExit('INTAKE_ATTESTATION_FILE_SET')
          target = imported / 'attestation.json'
          data = target.read_bytes()
          if not data or len(data) > 32768:
              raise SystemExit('INTAKE_ATTESTATION_SIZE')
          if hashlib.sha256(data).hexdigest() != os.environ['EXPECTED_ATTESTATION_SHA256']:
              raise SystemExit('INTAKE_ATTESTATION_SHA256')
          value = json.loads(data, object_pairs_hook=reject_duplicate_keys)
          if set(value) != {
              'schema_version', 'github_ref', 'workflow_run_id',
              'workflow_run_attempt', 'source_commit', 'workflow_source_commit',
              'runtime_manifest_sha256', 'orchestrator_blob_oid', 'status',
              'inputs', 'claim',
          }:
              raise SystemExit('INTAKE_ATTESTATION_KEYS')
          expected_header = {
              'schema_version': 'UA-ART-INTAKE-ATTESTATION-1',
              'status': 'PASS',
              'github_ref': 'refs/heads/main',
              'workflow_run_id': os.environ['RUN_ID'],
              'workflow_run_attempt': 1,
              'source_commit': os.environ['EXPECTED_SOURCE_COMMIT'],
              'workflow_source_commit': os.environ['WORKFLOW_SOURCE_COMMIT'],
              'runtime_manifest_sha256': os.environ['EXPECTED_RUNTIME_MANIFEST_SHA256'],
              'orchestrator_blob_oid': os.environ['EXPECTED_ORCHESTRATOR_BLOB_OID'],
          }
          for key, expected in expected_header.items():
              if value.get(key) != expected:
                  raise SystemExit('INTAKE_ATTESTATION_BINDING:' + key)
          inputs = value.get('inputs')
          if not isinstance(inputs, dict) or set(inputs) != {
              'request_path', 'expected_request_sha256',
              'autostart_ledger_path', 'autostart_source_commit',
          }:
              raise SystemExit('INTAKE_ATTESTATION_INPUT_KEYS')
          expected_inputs = {
              'request_path': os.environ['REQUEST_PATH'],
              'expected_request_sha256': os.environ['EXPECTED_REQUEST_SHA256'],
              'autostart_ledger_path': os.environ['AUTOSTART_LEDGER_PATH'],
              'autostart_source_commit': os.environ['AUTOSTART_SOURCE_COMMIT'],
          }
          if inputs != expected_inputs:
              raise SystemExit('INTAKE_ATTESTATION_INPUT_BINDING')
          claim = value.get('claim')
          expected_claim_keys = {
              'request_path', 'request_sha256', 'task_id', 'task_class',
              'lock_key', 'claim_path', 'plan_path', 'production_required',
          }
          if not isinstance(claim, dict) or set(claim) != expected_claim_keys:
              raise SystemExit('INTAKE_ATTESTATION_CLAIM_KEYS')
          string_claim = {key: item for key, item in claim.items() if key != 'production_required'}
          if any(not isinstance(item, str) or '\n' in item or '\r' in item for item in string_claim.values()):
              raise SystemExit('INTAKE_ATTESTATION_CLAIM_TYPE')
          request = pathlib.PurePosixPath(claim['request_path'])
          if request.is_absolute() or '..' in request.parts or request.as_posix() != claim['request_path']:
              raise SystemExit('INTAKE_ATTESTATION_REQUEST_PATH')
          if claim['request_path'] != inputs['request_path']:
              raise SystemExit('INTAKE_ATTESTATION_REQUEST_MISMATCH')
          if not re.fullmatch(r'[0-9a-f]{64}', claim['request_sha256']):
              raise SystemExit('INTAKE_ATTESTATION_REQUEST_SHA')
          if inputs['expected_request_sha256'] and inputs['expected_request_sha256'] != claim['request_sha256']:
              raise SystemExit('INTAKE_ATTESTATION_EXPECTED_SHA')
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{1,79}', claim['task_id']):
              raise SystemExit('INTAKE_ATTESTATION_TASK_ID')
          if claim['task_class'] not in {'FAST', 'STANDARD', 'CRITICAL'}:
              raise SystemExit('INTAKE_ATTESTATION_TASK_CLASS')
          if not re.fullmatch(r'[a-z0-9_][a-z0-9_-]{0,44}', claim['lock_key']):
              raise SystemExit('INTAKE_ATTESTATION_LOCK_KEY')
          if type(claim['production_required']) is not bool:
              raise SystemExit('INTAKE_ATTESTATION_PRODUCTION')
          expected_claim_path = 'state/claims/{0}.{1}.{2}.json'.format(
              claim['task_id'], claim['request_sha256'], value['workflow_run_id']
          )
          expected_plan_path = 'state/plans/{0}.{1}.json'.format(
              claim['task_id'], claim['request_sha256']
          )
          if claim['claim_path'] != expected_claim_path or claim['plan_path'] != expected_plan_path:
              raise SystemExit('INTAKE_ATTESTATION_STATE_PATH')
          if not re.fullmatch(r'[0-9a-f]{40}', value['source_commit']):
              raise SystemExit('INTAKE_ATTESTATION_SOURCE_COMMIT')
          if not re.fullmatch(r'[0-9a-f]{40}', value['workflow_source_commit']):
              raise SystemExit('INTAKE_ATTESTATION_WORKFLOW_SOURCE_COMMIT')
          if not re.fullmatch(r'[0-9a-f]{64}', value['runtime_manifest_sha256']):
              raise SystemExit('INTAKE_ATTESTATION_RUNTIME_MANIFEST_SHA')
          if not re.fullmatch(r'[0-9a-f]{40}', value['orchestrator_blob_oid']):
              raise SystemExit('INTAKE_ATTESTATION_ORCHESTRATOR_BLOB')
          if inputs['autostart_source_commit'] and not re.fullmatch(
              r'[0-9a-f]{40}', inputs['autostart_source_commit']
          ):
              raise SystemExit('INTAKE_ATTESTATION_AUTOSTART_COMMIT')
          output_values = {
              'source_commit': value['source_commit'],
              'workflow_source_commit': value['workflow_source_commit'],
              'runtime_manifest_sha256': value['runtime_manifest_sha256'],
              'orchestrator_blob_oid': value['orchestrator_blob_oid'],
              **string_claim,
              'production_required': str(claim['production_required']).lower(),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, item in output_values.items():
                  output.write(f'{key}={item}\n')
          print('UAART_DATA_ONLY_ARTIFACT_VALIDATED')
          PY

      - name: Persist only the exact claim and plan with an isolated Git tree
        id: persist
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.attestation.outputs.source_commit }}
          ATTESTED_WORKFLOW_SOURCE_COMMIT: ${{ steps.attestation.outputs.workflow_source_commit }}
          RUNTIME_MANIFEST_SHA256: ${{ steps.attestation.outputs.runtime_manifest_sha256 }}
          ORCHESTRATOR_BLOB_OID: ${{ steps.attestation.outputs.orchestrator_blob_oid }}
          ATTESTED_REQUEST_PATH: ${{ steps.attestation.outputs.request_path }}
          ATTESTED_REQUEST_SHA256: ${{ steps.attestation.outputs.request_sha256 }}
          TASK_ID: ${{ steps.attestation.outputs.task_id }}
          TASK_CLASS: ${{ steps.attestation.outputs.task_class }}
          LOCK_KEY: ${{ steps.attestation.outputs.lock_key }}
          CLAIM_PATH: ${{ steps.attestation.outputs.claim_path }}
          PLAN_PATH: ${{ steps.attestation.outputs.plan_path }}
          PRODUCTION_REQUIRED: ${{ steps.attestation.outputs.production_required }}
        shell: bash
        run: |
          set -euo pipefail
          test "$EXPECTED_GITHUB_REF" = 'refs/heads/main'
          test "$RUN_ATTEMPT" = '1'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          test "$ATTESTED_REQUEST_PATH" = "$REQUEST_PATH"
          test "$ATTESTED_WORKFLOW_SOURCE_COMMIT" = "$WORKFLOW_SOURCE_COMMIT"
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git_auth() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          output_value() {
            local key="$1"
            local file="$2"
            local count
            count="$(grep -c "^${key}=" "$file" || true)"
            test "$count" -eq 1
            grep "^${key}=" "$file" | sed "s/^${key}=//"
          }
          last_commit=''
          last_outputs=''
          for attempt in 1 2 3 4 5 6; do
            if ! git_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'; then
              test "$attempt" -lt 6 || exit 1
              sleep $((attempt * 3))
              continue
            fi
            parent="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$last_commit" && git merge-base --is-ancestor "$last_commit" "$parent"; then
              cat "$last_outputs" >>"$GITHUB_OUTPUT"
              unset auth
              exit 0
            fi
            git merge-base --is-ancestor "$ATTESTED_WORKFLOW_SOURCE_COMMIT" "$parent"
            git merge-base --is-ancestor "$SOURCE_COMMIT" "$parent"
            test "$(
              git rev-parse "$ATTESTED_WORKFLOW_SOURCE_COMMIT:.github/workflows/uaart_orchestrator.yml"
            )" = "$ORCHESTRATOR_BLOB_OID"
            test "$(
              git rev-parse "$parent:.github/workflows/uaart_orchestrator.yml"
            )" = "$ORCHESTRATOR_BLOB_OID"
            test "$(
              git cat-file blob "$parent:state/AUTOPILOT_RUNTIME_MANIFEST.json" | sha256sum | cut -d' ' -f1
            )" = "$RUNTIME_MANIFEST_SHA256"
            test "$(
              git cat-file blob "$parent:$ATTESTED_REQUEST_PATH" | sha256sum | cut -d' ' -f1
            )" = "$ATTESTED_REQUEST_SHA256"
            rebuild="$RUNNER_TEMP/uaart-intake-persist-${attempt}"
            index="$RUNNER_TEMP/uaart-intake-index-${attempt}"
            attempt_outputs="$RUNNER_TEMP/uaart-intake-outputs-${attempt}"
            rm -f "$index" "$attempt_outputs"
            git worktree add --detach "$rebuild" "$parent"
            cd "$rebuild"
            python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re

          def reject_duplicate_keys(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('INTAKE_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }
          root = pathlib.Path.cwd().resolve()
          manifest_path = root / 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit('INTAKE_RUNTIME_MANIFEST_FILE')
          data = manifest_path.read_bytes()
          if hashlib.sha256(data).hexdigest() != os.environ['RUNTIME_MANIFEST_SHA256']:
              raise SystemExit('INTAKE_RUNTIME_MANIFEST_REBOUND')
          manifest = json.loads(data, object_pairs_hook=reject_duplicate_keys)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('INTAKE_RUNTIME_MANIFEST_KEYS')
          if manifest['schema_version'] != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('INTAKE_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('INTAKE_RUNTIME_FILE_SET')
          total = 0
          for relative, expected in files.items():
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', relative) or '..' in pathlib.PurePosixPath(relative).parts:
                  raise SystemExit('INTAKE_RUNTIME_PATH')
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('INTAKE_RUNTIME_HASH')
              target = root / pathlib.PurePosixPath(relative)
              if target.is_symlink() or not target.is_file() or not target.resolve().is_relative_to(root):
                  raise SystemExit('INTAKE_RUNTIME_TARGET:' + relative)
              payload = target.read_bytes()
              total += len(payload)
              if len(payload) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('INTAKE_RUNTIME_SIZE')
              if hashlib.sha256(payload).hexdigest() != expected:
                  raise SystemExit('INTAKE_RUNTIME_FILE_SHA:' + relative)
          print('UAART_TRUSTED_RUNTIME_CLOSURE_VALIDATED')
          PY
            python3 -I -W error -m py_compile \
              automation/control_plane.py automation/execution_contract.py
            python3 -I automation/control_plane.py verify-mode
            expected_args=()
            if test -n "$EXPECTED_REQUEST_SHA256"; then
              expected_args+=(--expected-sha256 "$EXPECTED_REQUEST_SHA256")
            fi
            ledger_args=()
            if test -n "$AUTOSTART_LEDGER_PATH"; then
              ledger_args+=(--autostart-ledger "$AUTOSTART_LEDGER_PATH")
            fi
            source_args=()
            if test -n "$AUTOSTART_SOURCE_COMMIT"; then
              source_args+=(--autostart-source-commit "$AUTOSTART_SOURCE_COMMIT")
            fi
            GITHUB_OUTPUT="$attempt_outputs" \
              python3 -I automation/control_plane.py claim "$REQUEST_PATH" \
              --run-id "$RUN_ID" --source-commit "$SOURCE_COMMIT" \
              "${expected_args[@]}" "${ledger_args[@]}" "${source_args[@]}" \
              >"$RUNNER_TEMP/uaart-intake-rebuilt-claim-${attempt}.json"
            python3 -I - "$attempt_outputs" <<'PY'
          import pathlib
          import re
          import sys

          expected = {
              'request_path', 'request_sha256', 'task_id', 'task_class',
              'lock_key', 'claim_path', 'plan_path', 'production_required',
          }
          lines = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          keys = [line.split('=', 1)[0] for line in lines if '=' in line]
          if len(lines) != len(expected) or set(keys) != expected or len(keys) != len(set(keys)):
              raise SystemExit('INTAKE_REBUILT_OUTPUT_KEYS')
          if any(not re.fullmatch(r'[A-Za-z0-9_./:-]+=[^\r\n]+', line) for line in lines):
              raise SystemExit('INTAKE_REBUILT_OUTPUT_VALUE')
          PY
            rebuilt_request_path="$(output_value request_path "$attempt_outputs")"
            rebuilt_request_sha256="$(output_value request_sha256 "$attempt_outputs")"
            rebuilt_task_id="$(output_value task_id "$attempt_outputs")"
            rebuilt_task_class="$(output_value task_class "$attempt_outputs")"
            rebuilt_lock_key="$(output_value lock_key "$attempt_outputs")"
            rebuilt_claim_path="$(output_value claim_path "$attempt_outputs")"
            rebuilt_plan_path="$(output_value plan_path "$attempt_outputs")"
            rebuilt_production="$(output_value production_required "$attempt_outputs")"
            test "$rebuilt_request_path" = "$ATTESTED_REQUEST_PATH"
            test "$rebuilt_request_sha256" = "$ATTESTED_REQUEST_SHA256"
            test "$rebuilt_task_id" = "$TASK_ID"
            test "$rebuilt_task_class" = "$TASK_CLASS"
            test "$rebuilt_lock_key" = "$LOCK_KEY"
            test "$rebuilt_claim_path" = "$CLAIM_PATH"
            test "$rebuilt_plan_path" = "$PLAN_PATH"
            test "$rebuilt_production" = "$PRODUCTION_REQUIRED"
            python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
              --sha256 "$ATTESTED_REQUEST_SHA256" \
              >"$RUNNER_TEMP/uaart-intake-rebuilt-request-${attempt}.json"
            python3 -I automation/control_plane.py planning "$REQUEST_PATH" \
              --run-id "$RUN_ID" \
              >"$RUNNER_TEMP/uaart-intake-rebuilt-planning-${attempt}.json"
            python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
              --task-id "$TASK_ID" --sha256 "$ATTESTED_REQUEST_SHA256" \
              --run-id "$RUN_ID" --claim-path "$CLAIM_PATH" \
              >"$RUNNER_TEMP/uaart-intake-rebuilt-identity-${attempt}.json"
            python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
              --expected-class "$TASK_CLASS" \
              >"$RUNNER_TEMP/uaart-intake-rebuilt-contract-${attempt}.json"
            python3 -I - <<'PY'
          import json
          import os
          import pathlib

          root = pathlib.Path.cwd().resolve()
          expected_identity = {
              'task_id': os.environ['TASK_ID'],
              'task_sha256': os.environ['ATTESTED_REQUEST_SHA256'],
              'run_id': os.environ['RUN_ID'],
          }
          for key in ('CLAIM_PATH', 'PLAN_PATH'):
              relative = os.environ[key]
              target = root / pathlib.PurePosixPath(relative)
              if target.is_symlink() or not target.is_file() or target.stat().st_size > 1024 * 1024:
                  raise SystemExit('INTAKE_REBUILT_STATE_FILE:' + key)
              if not target.resolve().is_relative_to(root):
                  raise SystemExit('INTAKE_REBUILT_STATE_ESCAPE:' + key)
          claim = json.loads((root / os.environ['CLAIM_PATH']).read_text(encoding='utf-8'))
          plan = json.loads((root / os.environ['PLAN_PATH']).read_text(encoding='utf-8'))
          expected = {
              'identity': expected_identity,
              'request_path': os.environ['ATTESTED_REQUEST_PATH'],
              'task_class': os.environ['TASK_CLASS'],
              'queue_key': os.environ['LOCK_KEY'],
              'production_required': os.environ['PRODUCTION_REQUIRED'] == 'true',
          }
          for key, item in expected.items():
              if claim.get(key) != item or plan.get(key) != item:
                  raise SystemExit('INTAKE_REBUILT_STATE_BINDING:' + key)
          if claim.get('request_sha256') != os.environ['ATTESTED_REQUEST_SHA256']:
              raise SystemExit('INTAKE_REBUILT_CLAIM_SHA')
          if claim.get('source_commit') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('INTAKE_REBUILT_SOURCE_COMMIT')
          PY
            GIT_INDEX_FILE="$index" git read-tree "$parent"
            for path in "$CLAIM_PATH" "$PLAN_PATH"; do
              test -f "$path" && test ! -L "$path"
              blob="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$index" git update-index --add \
                --cacheinfo "100644,${blob},${path}"
            done
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            export GIT_AUTHOR_NAME=ua-art-orchestrator
            export GIT_AUTHOR_EMAIL=actions@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            COMMIT="$(printf '%s\n' "uaart intake: $TASK_ID claimed as $TASK_CLASS" | \
              git commit-tree "$tree" -p "$parent")"
            mapfile -d '' changed < <(
              git diff-tree --no-commit-id --name-only -r -z "$parent" "$COMMIT"
            )
            test "${#changed[@]}" -eq 2
            printf '%s\n' "${changed[@]}" | sort >"$RUNNER_TEMP/uaart-intake-changed-${attempt}"
            printf '%s\n' "$CLAIM_PATH" "$PLAN_PATH" | sort >"$RUNNER_TEMP/uaart-intake-expected-${attempt}"
            cmp "$RUNNER_TEMP/uaart-intake-changed-${attempt}" \
              "$RUNNER_TEMP/uaart-intake-expected-${attempt}"
            cd "$GITHUB_WORKSPACE"
            last_commit="$COMMIT"
            last_outputs="$attempt_outputs"
            if git_auth push origin "$COMMIT:refs/heads/main"; then
              cat "$attempt_outputs" >>"$GITHUB_OUTPUT"
              unset auth
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

  fast:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.plan.outputs.task_class == 'FAST'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/uaart_fast.yml
    with:
      request_path: ${{ needs.plan.outputs.request_path }}
      request_sha256: ${{ needs.plan.outputs.request_sha256 }}
      lock_key: ${{ needs.plan.outputs.lock_key }}
      claim_path: ${{ needs.plan.outputs.claim_path }}
      run_id: ${{ github.run_id }}
      production_required: ${{ needs.plan.outputs.production_required }}
    secrets: inherit

  standard:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.plan.outputs.task_class == 'STANDARD'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/uaart_standard.yml
    with:
      request_path: ${{ needs.plan.outputs.request_path }}
      request_sha256: ${{ needs.plan.outputs.request_sha256 }}
      lock_key: ${{ needs.plan.outputs.lock_key }}
      claim_path: ${{ needs.plan.outputs.claim_path }}
      run_id: ${{ github.run_id }}
      production_required: ${{ needs.plan.outputs.production_required }}
    secrets: inherit

  critical:
    needs: plan
    if: github.ref == 'refs/heads/main' && github.run_attempt == 1 && needs.plan.outputs.task_class == 'CRITICAL'
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/uaart_critical.yml
    with:
      request_path: ${{ needs.plan.outputs.request_path }}
      request_sha256: ${{ needs.plan.outputs.request_sha256 }}
      lock_key: ${{ needs.plan.outputs.lock_key }}
      claim_path: ${{ needs.plan.outputs.claim_path }}
      run_id: ${{ github.run_id }}
      production_required: ${{ needs.plan.outputs.production_required }}
    secrets: inherit
