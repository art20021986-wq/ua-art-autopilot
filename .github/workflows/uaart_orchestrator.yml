name: UA ART Central Task Orchestrator

on:
  workflow_call:
    inputs:
      request_path:
        required: true
        type: string
      expected_request_sha256:
        required: false
        default: ''
        type: string
      autostart_ledger_path:
        required: false
        default: ''
        type: string
      autostart_source_commit:
        required: false
        default: ''
        type: string
  workflow_dispatch:
    inputs:
      request_path:
        description: Exact repository path under tasks/requests
        required: true
        type: string
      expected_request_sha256:
        description: Optional exact SHA-256 binding for automatic intake
        required: false
        type: string

permissions:
  contents: write
  actions: read

# Intake is a short branch-local critical section. Execution is queued by the
# exact resource key in the FAST/STANDARD/CRITICAL reusable workflows.
concurrency:
  group: uaart-intake-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      request_path: ${{ steps.claim.outputs.request_path }}
      request_sha256: ${{ steps.claim.outputs.request_sha256 }}
      task_id: ${{ steps.claim.outputs.task_id }}
      task_class: ${{ steps.claim.outputs.task_class }}
      lock_key: ${{ steps.claim.outputs.lock_key }}
      claim_path: ${{ steps.claim.outputs.claim_path }}
      production_required: ${{ steps.claim.outputs.production_required }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      EXPECTED_REQUEST_SHA256: ${{ inputs.expected_request_sha256 }}
      AUTOSTART_LEDGER_PATH: ${{ inputs.autostart_ledger_path }}
      AUTOSTART_SOURCE_COMMIT: ${{ inputs.autostart_source_commit }}
      RUN_ID: ${{ github.run_id }}
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Require valid execution mode and exact durable request
        shell: bash
        run: |
          set -euo pipefail
          test -n "$REQUEST_PATH"
          python3 -W error -m py_compile automation/control_plane.py
          python3 automation/control_plane.py verify-mode

      - name: Atomically claim exact request identity
        id: claim
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="$(git rev-parse HEAD)"
          expected_args=()
          if test -n "$EXPECTED_REQUEST_SHA256"; then
            expected_args+=(--expected-sha256 "$EXPECTED_REQUEST_SHA256")
          fi
          ledger_args=()
          if test -n "$AUTOSTART_LEDGER_PATH"; then
            ledger_args+=(--autostart-ledger "$AUTOSTART_LEDGER_PATH")
          fi
          source_args=()
          if test -n "$AUTOSTART_SOURCE_COMMIT"; then
            source_args+=(--autostart-source-commit "$AUTOSTART_SOURCE_COMMIT")
          fi
          python3 automation/control_plane.py claim "$REQUEST_PATH" \
            --run-id "$RUN_ID" \
            --source-commit "$SOURCE_COMMIT" \
            "${expected_args[@]}" \
            "${ledger_args[@]}" \
            "${source_args[@]}" \
            >/tmp/uaart-control-plane-claim.json

      - name: Bind data-only planning and validate trusted execution package
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "${{ steps.claim.outputs.request_sha256 }}" \
            >/tmp/uaart-exact-request.json
          python3 automation/control_plane.py planning "$REQUEST_PATH" \
            --run-id "$RUN_ID" >/tmp/uaart-planning.json
          python3 automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class "${{ steps.claim.outputs.task_class }}" \
            >/tmp/uaart-execution-contract.json

      - name: Commit visible claim and plan to this branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            "${{ steps.claim.outputs.claim_path }}" \
            "${{ steps.claim.outputs.plan_path }}"
          if git diff --cached --quiet; then
            echo 'Exact claim and plan already current'
            exit 0
          fi
          git config user.name 'ua-art-orchestrator'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "uaart intake: ${{ steps.claim.outputs.task_id }} claimed as ${{ steps.claim.outputs.task_class }}"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "${GITHUB_REF_NAME}"
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

  fast:
    needs: plan
    if: needs.plan.outputs.task_class == 'FAST'
    uses: ./.github/workflows/uaart_fast.yml
    with:
      request_path: ${{ needs.plan.outputs.request_path }}
      request_sha256: ${{ needs.plan.outputs.request_sha256 }}
      lock_key: ${{ needs.plan.outputs.lock_key }}
      claim_path: ${{ needs.plan.outputs.claim_path }}
      run_id: ${{ github.run_id }}
      production_required: ${{ needs.plan.outputs.production_required }}
    secrets: inherit

  standard:
    needs: plan
    if: needs.plan.outputs.task_class == 'STANDARD'
    uses: ./.github/workflows/uaart_standard.yml
    with:
      request_path: ${{ needs.plan.outputs.request_path }}
      request_sha256: ${{ needs.plan.outputs.request_sha256 }}
      lock_key: ${{ needs.plan.outputs.lock_key }}
      claim_path: ${{ needs.plan.outputs.claim_path }}
      run_id: ${{ github.run_id }}
      production_required: ${{ needs.plan.outputs.production_required }}
    secrets: inherit

  critical:
    needs: plan
    if: needs.plan.outputs.task_class == 'CRITICAL'
    uses: ./.github/workflows/uaart_critical.yml
    with:
      request_path: ${{ needs.plan.outputs.request_path }}
      request_sha256: ${{ needs.plan.outputs.request_sha256 }}
      lock_key: ${{ needs.plan.outputs.lock_key }}
      claim_path: ${{ needs.plan.outputs.claim_path }}
      run_id: ${{ github.run_id }}
      production_required: ${{ needs.plan.outputs.production_required }}
    secrets: inherit
