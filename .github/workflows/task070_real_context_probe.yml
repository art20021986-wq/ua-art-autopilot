name: task070-real-crm-context-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task070_real_context_probe.yml'
      - 'cloud/task_070/read_real_context.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task070-real-crm-context-read
  cancel-in-progress: false

jobs:
  read-only-context:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile read-only probe
        run: python3 -m py_compile cloud/task_070/read_real_context.py
      - name: Capture real source contract and local DB-copy schema
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_070/read_real_context.py
      - name: Enforce read-only evidence
        run: |
          python3 - <<'PY'
          import json
          path = 'cloud/task_070/evidence/real_context.json'
          data = json.load(open(path, encoding='utf-8'))
          assert data['mode'] == 'READ_ONLY_REAL_CONTEXT'
          assert data['remote_http_methods'] == ['GET']
          assert data['production_touched'] is False
          assert data['crm_db_write'] is False
          assert data['site_write'] is False
          assert data['database']['quick_check'] == 'ok'
          assert 'cars' in data['database']['tables']
          for label in ('db.py', 'cars_ui.py', 'trace_zhurnal.py'):
              assert data['sources'][label]['definitions']
          print('TASK070_REAL_CONTEXT_READ_ONLY_PASS')
          PY
      - name: Commit bounded evidence
        run: |
          git add -- cloud/task_070/evidence/real_context.json
          if git diff --cached --quiet; then
            echo 'Evidence unchanged'
            exit 0
          fi
          git config user.name 'task070-real-context-read'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_070: record real read-only CRM context'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
