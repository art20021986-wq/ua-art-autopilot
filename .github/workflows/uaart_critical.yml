name: UA ART CRITICAL Pipeline

on:
  workflow_call:
    inputs:
      request_path:
        required: true
        type: string
      request_sha256:
        required: true
        type: string
      lock_key:
        required: true
        type: string
      claim_path:
        required: true
        type: string
      run_id:
        required: true
        type: string
      production_required:
        required: true
        type: string
    outputs:
      status:
        value: ${{ jobs.result.outputs.status }}
      receipt_path:
        value: ${{ jobs.result.outputs.receipt_path }}

permissions:
  contents: read

concurrency:
  group: ${{ inputs.production_required == 'true' && 'ua-art-production-writer' || format('uaart-resource-{0}', inputs.lock_key) }}
  cancel-in-progress: false

env:
  UAART_RUNTIME_PINNED_PATHS: >-
    .github/workflows/uaart_autostart.yml
    .github/workflows/uaart_orchestrator.yml
    .github/workflows/uaart_fast.yml
    .github/workflows/uaart_standard.yml
    .github/workflows/uaart_critical.yml
    .github/workflows/uaart_backup.yml
    .github/workflows/uaart_maintenance.yml
    .github/workflows/uaart_monitor.yml
    .github/workflows/uaart_transaction_watchdog.yml
    automation/autostart_intake.py
    automation/control_plane.py
    automation/critical_adapter.py
    automation/execution_contract.py
    automation/production_queue.py
    automation/task_orchestrator.py
    automation/task_ticket.py
    automation/transaction_watchdog.py
    state/schemas/task_request.schema.json

jobs:
  main_only:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Require the immutable main branch route
        shell: bash
        env:
          EXPECTED_REF: ${{ github.ref }}
        run: test "$EXPECTED_REF" = 'refs/heads/main'

  validate:
    needs: main_only
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      task_id: ${{ steps.contract.outputs.task_id }}
      dependency_sha256: ${{ steps.contract.outputs.dependency_sha256 }}
      receipt_path: ${{ steps.contract.outputs.receipt_path }}
      backup_receipt_path: ${{ steps.contract.outputs.backup_receipt_path }}
      rollback_receipt_path: ${{ steps.contract.outputs.rollback_receipt_path }}
      critical_manifest_sha256: ${{ steps.contract.outputs.critical_manifest_sha256 }}
      source_commit: ${{ steps.attestation.outputs.source_commit }}
      runtime_manifest_sha256: ${{ steps.attestation.outputs.runtime_manifest_sha256 }}
      workflow_blob_oid: ${{ steps.workflow.outputs.workflow_blob_oid }}
      workflow_source_commit: ${{ steps.workflow.outputs.workflow_source_commit }}
      validation_artifact_sha256: ${{ steps.attestation.outputs.validation_artifact_sha256 }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      PRODUCTION_REQUIRED: ${{ inputs.production_required }}
    steps:
      - name: Checkout clean main without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Bind executing CRITICAL workflow to checked runtime
        id: workflow
        shell: bash
        env:
          WORKFLOW_PATH: .github/workflows/uaart_critical.yml
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${WORKFLOW_SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$WORKFLOW_SOURCE_COMMIT" HEAD
          source_entry="$(git ls-tree "$WORKFLOW_SOURCE_COMMIT" -- "$WORKFLOW_PATH")"
          head_entry="$(git ls-tree HEAD -- "$WORKFLOW_PATH")"
          test "$(awk '{print $1}' <<<"$source_entry")" = 100644
          test "$(awk '{print $1}' <<<"$head_entry")" = 100644
          workflow_blob_oid="$(awk '{print $3}' <<<"$source_entry")"
          test "$workflow_blob_oid" = "$(awk '{print $3}' <<<"$head_entry")"
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:state/AUTOPILOT_RUNTIME_MANIFEST.json")" = \
            "$(git rev-parse HEAD:state/AUTOPILOT_RUNTIME_MANIFEST.json)"
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, re

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('CRITICAL_VALIDATION_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          expected_paths = os.environ['UAART_RUNTIME_PINNED_PATHS'].split()
          if len(expected_paths) != 18 or len(set(expected_paths)) != 18:
              raise SystemExit('CRITICAL_VALIDATION_RUNTIME_EXPECTED_PATHS')
          root = pathlib.Path.cwd().resolve()
          manifest_path = root / 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit('CRITICAL_VALIDATION_RUNTIME_MANIFEST_FILE')
          manifest = json.loads(
              manifest_path.read_bytes(), object_pairs_hook=strict_object
          )
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('CRITICAL_VALIDATION_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('CRITICAL_VALIDATION_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != set(expected_paths):
              raise SystemExit('CRITICAL_VALIDATION_RUNTIME_FILE_SET')
          total = 0
          for relative in expected_paths:
              expected = files[relative]
              pure = pathlib.PurePosixPath(relative)
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', relative) or pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit('CRITICAL_VALIDATION_RUNTIME_PATH')
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('CRITICAL_VALIDATION_RUNTIME_HASH')
              target = root / pure
              if target.is_symlink() or not target.is_file() or target.resolve() != target:
                  raise SystemExit('CRITICAL_VALIDATION_RUNTIME_TARGET:' + relative)
              payload = target.read_bytes()
              total += len(payload)
              if len(payload) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('CRITICAL_VALIDATION_RUNTIME_SIZE')
              if hashlib.sha256(payload).hexdigest() != expected:
                  raise SystemExit('CRITICAL_VALIDATION_RUNTIME_SHA:' + relative)
          print('UAART_CRITICAL_VALIDATION_RUNTIME_CLOSURE_VALIDATED')
          PY
          echo "workflow_blob_oid=$workflow_blob_oid" >>"$GITHUB_OUTPUT"
          echo "workflow_source_commit=$WORKFLOW_SOURCE_COMMIT" >>"$GITHUB_OUTPUT"

      - name: Validate immutable CRITICAL execution contract
        id: contract
        shell: bash
        run: |
          set -euo pipefail
          test -f "$CLAIM_PATH"
          python3 -I -W error -m py_compile \
            automation/control_plane.py automation/execution_contract.py \
            automation/task_ticket.py automation/transaction_watchdog.py
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class CRITICAL >/tmp/uaart-critical-contract.json
          python3 -I automation/execution_contract.py outputs "$REQUEST_PATH" \
            --expected-class CRITICAL
          contract_production="$(python3 -I -c 'import json; print(str(json.load(open("/tmp/uaart-critical-contract.json"))["production_required"]).lower())')"
          contract_task_id="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-contract.json"))["task_id"])')"
          test "$contract_production" = "$PRODUCTION_REQUIRED"
          python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
            --task-id "$contract_task_id" \
            --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
            --claim-path "$CLAIM_PATH"

      - name: Compile and test package without repository write permission
        shell: bash
        run: |
          set -euo pipefail
          python3 -I automation/execution_contract.py compile "$REQUEST_PATH" \
            --expected-class CRITICAL
          python3 -I automation/execution_contract.py test "$REQUEST_PATH" \
            --expected-class CRITICAL

      - name: Create data-only validation attestation
        id: attestation
        shell: bash
        env:
          DEPENDENCY_SHA256: ${{ steps.contract.outputs.dependency_sha256 }}
          TASK_ID: ${{ steps.contract.outputs.task_id }}
          WORKFLOW_BLOB_OID: ${{ steps.workflow.outputs.workflow_blob_oid }}
          WORKFLOW_SOURCE_COMMIT: ${{ steps.workflow.outputs.workflow_source_commit }}
        run: |
          set -euo pipefail
          source_commit="$(git rev-parse HEAD)"
          echo "source_commit=$source_commit" >>"$GITHUB_OUTPUT"
          install -d -m 700 /tmp/uaart-critical-validation
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import subprocess

          value = {
              'compiled': 'PASS',
              'dependency_sha256': os.environ['DEPENDENCY_SHA256'],
              'production_required': os.environ['PRODUCTION_REQUIRED'] == 'true',
              'request_path': os.environ['REQUEST_PATH'],
              'request_sha256': os.environ['REQUEST_SHA256'],
              'run_id': os.environ['RUN_ID'],
              'runtime_manifest_sha256': hashlib.sha256(
                  pathlib.Path('state/AUTOPILOT_RUNTIME_MANIFEST.json').read_bytes()
              ).hexdigest(),
              'schema_version': 'UA-ART-CRITICAL-VALIDATION-1',
              'source_commit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'status': 'PASS',
              'task_id': os.environ['TASK_ID'],
              'tests': 'PASS',
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_blob_oid': os.environ['WORKFLOW_BLOB_OID'],
              'workflow_source_commit': os.environ['WORKFLOW_SOURCE_COMMIT'],
          }
          pathlib.Path('/tmp/uaart-critical-validation/validation.json').write_text(
              json.dumps(value, ensure_ascii=False, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY
          echo "runtime_manifest_sha256=$(sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo "validation_artifact_sha256=$(sha256sum /tmp/uaart-critical-validation/validation.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload data-only validation attestation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-critical-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uaart-critical-validation/validation.json
          if-no-files-found: error
          retention-days: 2

  prepare:
    needs: validate
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.production_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      actions: read
    outputs:
      prepared: ${{ steps.push.outputs.prepared }}
      transaction_id: ${{ steps.identity.outputs.transaction_id }}
      transaction_path: ${{ steps.prepare.outputs.transaction_path }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download validation attestation outside checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uaart-critical-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-critical-validation

      - name: Strictly validate data-only test attestation
        shell: bash
        env:
          DEPENDENCY_SHA256: ${{ needs.validate.outputs.dependency_sha256 }}
          RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VALIDATION_ARTIFACT_SHA256: ${{ needs.validate.outputs.validation_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-critical-validation'
          entries = list(folder.iterdir())
          if [item.name for item in entries] != ['validation.json']:
              raise SystemExit('VALIDATION_ARTIFACT_INVENTORY')
          path = entries[0]
          if path.is_symlink() or not path.is_file() or path.stat().st_size > 8192:
              raise SystemExit('VALIDATION_ARTIFACT_FILE')
          payload = path.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['VALIDATION_ARTIFACT_SHA256']:
              raise SystemExit('VALIDATION_ARTIFACT_SHA256')
          value = json.loads(payload.decode('utf-8'))
          keys = {
              'compiled', 'dependency_sha256', 'production_required',
              'request_path', 'request_sha256', 'run_id',
              'runtime_manifest_sha256', 'schema_version', 'source_commit',
              'status', 'task_id', 'tests', 'workflow_run_attempt',
              'workflow_run_id', 'workflow_blob_oid', 'workflow_source_commit',
          }
          expected = {
              'compiled': 'PASS',
              'dependency_sha256': os.environ['DEPENDENCY_SHA256'],
              'production_required': True,
              'request_path': os.environ['REQUEST_PATH'],
              'request_sha256': os.environ['REQUEST_SHA256'],
              'run_id': os.environ['RUN_ID'],
              'runtime_manifest_sha256': os.environ['RUNTIME_MANIFEST_SHA256'],
              'schema_version': 'UA-ART-CRITICAL-VALIDATION-1',
              'source_commit': os.environ['SOURCE_COMMIT'],
              'status': 'PASS',
              'task_id': os.environ['TASK_ID'],
              'tests': 'PASS',
              'workflow_run_attempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_blob_oid': os.environ['WORKFLOW_BLOB_OID'],
              'workflow_source_commit': os.environ['WORKFLOW_SOURCE_COMMIT'],
          }
          if not isinstance(value, dict) or set(value) != keys or value != expected:
              raise SystemExit('VALIDATION_ARTIFACT_BINDING')
          if hashlib.sha256(
              pathlib.Path('state/AUTOPILOT_RUNTIME_MANIFEST.json').read_bytes()
          ).hexdigest() != os.environ['RUNTIME_MANIFEST_SHA256']:
              raise SystemExit('VALIDATION_RUNTIME_MANIFEST_DRIFT')
          if not re.fullmatch(r'[0-9a-f]{40}', value['source_commit']):
              raise SystemExit('VALIDATION_SOURCE_COMMIT')
          subprocess.run(
              ['git', 'merge-base', '--is-ancestor', value['source_commit'], 'HEAD'],
              check=True,
          )
          if not re.fullmatch(r'[0-9a-f]{40}', value['workflow_source_commit']):
              raise SystemExit('VALIDATION_WORKFLOW_SOURCE_COMMIT')
          subprocess.run(
              ['git', 'merge-base', '--is-ancestor', value['workflow_source_commit'], 'HEAD'],
              check=True,
          )
          source_blob = subprocess.check_output([
              'git', 'rev-parse',
              value['workflow_source_commit'] + ':' + os.environ['WORKFLOW_PATH'],
          ], text=True).strip()
          head_blob = subprocess.check_output([
              'git', 'rev-parse', 'HEAD:' + os.environ['WORKFLOW_PATH'],
          ], text=True).strip()
          if source_blob != value['workflow_blob_oid'] or head_blob != source_blob:
              raise SystemExit('VALIDATION_WORKFLOW_BLOB_BINDING')
          print('UAART_DATA_ONLY_ARTIFACT_VALIDATED')
          PY

      - name: Wait in strict Production queue and refresh main
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, re

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('CRITICAL_QUEUE_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }
          root = pathlib.Path.cwd().resolve()
          manifest_path = root / 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit('CRITICAL_QUEUE_RUNTIME_MANIFEST_FILE')
          payload = manifest_path.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['RUNTIME_MANIFEST_SHA256']:
              raise SystemExit('CRITICAL_QUEUE_RUNTIME_MANIFEST_DRIFT')
          manifest = json.loads(payload, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('CRITICAL_QUEUE_RUNTIME_MANIFEST_KEYS')
          if manifest['schema_version'] != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('CRITICAL_QUEUE_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('CRITICAL_QUEUE_RUNTIME_FILE_SET')
          total = 0
          for relative, expected in files.items():
              pure = pathlib.PurePosixPath(relative)
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', relative) or pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit('CRITICAL_QUEUE_RUNTIME_PATH')
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('CRITICAL_QUEUE_RUNTIME_HASH')
              target = root / pure
              if target.is_symlink() or not target.is_file() or target.resolve() != target:
                  raise SystemExit('CRITICAL_QUEUE_RUNTIME_TARGET:' + relative)
              data = target.read_bytes()
              total += len(data)
              if len(data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('CRITICAL_QUEUE_RUNTIME_SIZE')
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('CRITICAL_QUEUE_RUNTIME_FILE_SHA:' + relative)
          print('UAART_TRUSTED_RUNTIME_CLOSURE_VALIDATED')
          PY
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$WORKFLOW_SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          test "$(git show "$WORKFLOW_SOURCE_COMMIT:state/AUTOPILOT_RUNTIME_MANIFEST.json" | sha256sum | cut -d' ' -f1)" = \
            "$RUNTIME_MANIFEST_SHA256"
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
            --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
            --claim-path "$CLAIM_PATH"
          ticket="$(python3 -I automation/task_ticket.py "$REQUEST_PATH")"
          python3 -I automation/production_queue.py self-test
          python3 -I automation/production_queue.py wait \
            --task "$ticket" --drain-before '2026-09-04T13:51:01Z' \
            --timeout-seconds 1800 --stable-polls 2
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch origin main
          unset auth GH_TOKEN
          git reset --hard origin/main
          git clean -fdx

      - name: Rebuild trusted gates on refreshed main
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          test "$(sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1)" = \
            "$RUNTIME_MANIFEST_SHA256"
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I -W error -m py_compile \
            automation/control_plane.py automation/critical_adapter.py \
            automation/execution_contract.py automation/transaction_watchdog.py
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
            --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
            --claim-path "$CLAIM_PATH"
          python3 -I automation/transaction_watchdog.py assert-clear
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class CRITICAL >/tmp/uaart-critical-contract.json
          python3 -I automation/control_plane.py planning "$REQUEST_PATH" --run-id "$RUN_ID"
          python3 -I automation/control_plane.py heartbeat "$REQUEST_PATH" \
            --run-id "$RUN_ID" --status RUNNING
          python3 -I automation/control_plane.py storage "$REQUEST_PATH" \
            --run-id "$RUN_ID" --enforce
          python3 -I automation/control_plane.py compiled "$REQUEST_PATH" --run-id "$RUN_ID"
          echo "transaction_id=tx-${GITHUB_RUN_ID}-${REQUEST_SHA256:0:16}" >>"$GITHUB_OUTPUT"

      - name: Bind Gate A, Gate B, and pre-health
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import json
          import os
          from pathlib import Path
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          critical = request['critical']
          flat = {
              'task_id': request['task_id'], 'title': request['title'],
              'description': request.get('description', ''),
              'changed_paths': request.get('changed_paths', []),
              'production_required': True,
              'requested_min_class': request.get('requested_min_class'),
              'owner_approval_path': critical['owner_approval_path'],
              'owner_approval_sha256': critical['owner_approval_sha256'],
              'manifest_path': critical['manifest_path'],
              'manifest_sha256': critical['manifest_sha256'],
              'gate_b_authorized': critical['gate_b_authorized'],
              'allow_crm_vehicle_data': critical.get('allow_crm_vehicle_data', False),
          }
          Path('/tmp/uaart-critical-request.json').write_text(
              json.dumps(flat, sort_keys=True) + '\n', encoding='utf-8'
          )
          Path('/tmp/uaart-critical-paths.json').write_text(json.dumps({
              'owner': critical['owner_approval_path'],
              'manifest': critical['manifest_path'],
              'gate_a': critical['gate_a_path'],
          }, sort_keys=True) + '\n', encoding='utf-8')
          PY
          owner="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-paths.json"))["owner"])')"
          manifest="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-paths.json"))["manifest"])')"
          gate_a="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-paths.json"))["gate_a"])')"
          python3 -I automation/critical_adapter.py preflight \
            /tmp/uaart-critical-request.json "$owner" "$manifest" \
            >/tmp/uaart-critical-preflight.json
          python3 -I automation/critical_adapter.py gate-b \
            /tmp/uaart-critical-request.json "$owner" "$manifest" "$gate_a" \
            >/tmp/uaart-critical-gate-b.json
          python3 -I automation/control_plane.py critical-production "$REQUEST_PATH" \
            --run-id "$RUN_ID" --gate-b-evidence /tmp/uaart-critical-gate-b.json
          python3 -I automation/control_plane.py health "$REQUEST_PATH" \
            --run-id "$RUN_ID" --phase pre

      - name: Create PREPARING before any Production credential
        id: prepare
        shell: bash
        env:
          TRANSACTION_ID: ${{ steps.identity.outputs.transaction_id }}
        run: |
          set -euo pipefail
          python3 -I automation/control_plane.py transaction-prepare "$REQUEST_PATH" \
            --run-id "$RUN_ID" --transaction-id "$TRANSACTION_ID"

      - name: Commit and durably push PREPARING
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSACTION_PATH: ${{ steps.prepare.outputs.transaction_path }}
          TRANSACTION_ID: ${{ steps.identity.outputs.transaction_id }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          last_commit=''
          for attempt in 1 2 3 4 5 6; do
            git_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'
            parent="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$last_commit" && git merge-base --is-ancestor "$last_commit" "$parent"; then
              mapfile -d '' accepted_paths < <(git diff-tree --no-commit-id \
                --name-only -r -z "$last_commit")
              test "${#accepted_paths[@]}" -gt 0
              git diff --quiet "$last_commit" "$parent" -- "${accepted_paths[@]}" || exit 1
              echo 'prepared=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$(git rev-parse "$parent:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
            git show "$parent:state/AUTOPILOT_RUNTIME_MANIFEST.json" \
              >"$RUNNER_TEMP/uaart-critical-prepare-runtime-${attempt}.json"
            test "$(sha256sum "$RUNNER_TEMP/uaart-critical-prepare-runtime-${attempt}.json" | cut -d' ' -f1)" = \
              "$RUNTIME_MANIFEST_SHA256"
            read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
            test "${#runtime_paths[@]}" -eq 18
            test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
            git diff --quiet "$WORKFLOW_SOURCE_COMMIT" "$parent" -- "${runtime_paths[@]}"
            rebuild="$RUNNER_TEMP/uaart-critical-prepare-${attempt}"
            index="$RUNNER_TEMP/uaart-critical-prepare-index-${attempt}"
            git worktree add --detach "$rebuild" "$parent"
            cd "$rebuild"
            python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
            python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
              --sha256 "$REQUEST_SHA256"
            python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
              --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
              --claim-path "$CLAIM_PATH"
            python3 -I automation/transaction_watchdog.py assert-clear
            python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
              --expected-class CRITICAL >/dev/null
            python3 -I automation/control_plane.py planning "$REQUEST_PATH" --run-id "$RUN_ID"
            python3 -I automation/control_plane.py heartbeat "$REQUEST_PATH" \
              --run-id "$RUN_ID" --status RUNNING
            python3 -I automation/control_plane.py storage "$REQUEST_PATH" \
              --run-id "$RUN_ID" --enforce
            python3 -I automation/control_plane.py compiled "$REQUEST_PATH" --run-id "$RUN_ID"
            owner="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-paths.json"))["owner"])')"
            manifest="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-paths.json"))["manifest"])')"
            gate_a="$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-critical-paths.json"))["gate_a"])')"
            python3 -I automation/critical_adapter.py preflight \
              /tmp/uaart-critical-request.json "$owner" "$manifest" >/dev/null
            python3 -I automation/critical_adapter.py gate-b \
              /tmp/uaart-critical-request.json "$owner" "$manifest" "$gate_a" \
              >/tmp/uaart-critical-gate-b-rebuild.json
            python3 -I automation/control_plane.py critical-production "$REQUEST_PATH" \
              --run-id "$RUN_ID" \
              --gate-b-evidence /tmp/uaart-critical-gate-b-rebuild.json
            python3 -I automation/control_plane.py health "$REQUEST_PATH" \
              --run-id "$RUN_ID" --phase pre
            python3 -I automation/control_plane.py transaction-prepare "$REQUEST_PATH" \
              --run-id "$RUN_ID" --transaction-id "$TRANSACTION_ID"
            rm -f "$index"
            GIT_INDEX_FILE="$index" git read-tree "$parent"
            for path in "$CLAIM_PATH" "$TRANSACTION_PATH"; do
              test -f "$path" && test ! -L "$path"
              blob="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$index" git update-index --add \
                --cacheinfo "100644,${blob},${path}"
            done
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            export GIT_AUTHOR_NAME=ua-art-production-transaction
            export GIT_AUTHOR_EMAIL=actions@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit="$(printf '%s\n' "uaart production: prepare transaction $TASK_ID" | \
              git commit-tree "$tree" -p "$parent")"
            COMMIT="$commit"
            mapfile -d '' changed < <(git diff-tree --no-commit-id --name-only -r -z "$parent" "$commit")
            test "${#changed[@]}" -eq 2
            printf '%s\n' "${changed[@]}" | sort >"$RUNNER_TEMP/prepare-changed"
            printf '%s\n' "$CLAIM_PATH" "$TRANSACTION_PATH" | sort >"$RUNNER_TEMP/prepare-expected"
            cmp "$RUNNER_TEMP/prepare-changed" "$RUNNER_TEMP/prepare-expected"
            cd "$GITHUB_WORKSPACE"
            last_commit="$commit"
            if git_auth push origin "$COMMIT:refs/heads/main"; then
              echo 'prepared=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

  backup:
    needs: [validate, prepare]
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.production_required == 'true' &&
      needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
    outputs:
      backup_manifest_sha256: ${{ steps.receipt.outputs.backup_manifest_sha256 }}
      backup_receipt_sha256: ${{ steps.receipt.outputs.backup_receipt_sha256 }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      BACKUP_RECEIPT_PATH: ${{ needs.validate.outputs.backup_receipt_path }}
      DEPENDENCY_SHA256: ${{ needs.validate.outputs.dependency_sha256 }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative PREPARING state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate exact remote PREPARING transaction
        id: preparing
        shell: bash
        run: |
          set -euo pipefail
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
            --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
            --claim-path "$CLAIM_PATH"
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class CRITICAL >"$RUNNER_TEMP/uaart-backup-contract.json"
          test "$(python3 -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-backup-contract.json"))["dependency_sha256"])')" = \
            "$DEPENDENCY_SHA256"
          test "$(sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1)" = \
            "$RUNTIME_MANIFEST_SHA256"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          package_root="$(python3 -I -c 'import json,os,pathlib; print(pathlib.PurePosixPath(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-backup-contract.json"))["controller_path"]).parent.as_posix())')"
          test -n "$package_root" && test "$package_root" != '.'
          git diff --quiet "$SOURCE_COMMIT" HEAD -- "$package_root"
          python3 -I automation/transaction_watchdog.py discover >/tmp/uaart-pending.json
          python3 -I - <<'PY'
          import json, os
          value = json.load(open('/tmp/uaart-pending.json', encoding='utf-8'))
          if not (
              value.get('pending_count') == 1
              and value.get('transaction_status') == 'PREPARING'
              and value.get('transaction_id') == os.environ['TRANSACTION_ID']
              and value.get('transaction_path') == os.environ['TRANSACTION_PATH']
              and value.get('request_path') == os.environ['REQUEST_PATH']
              and value.get('request_sha256') == os.environ['REQUEST_SHA256']
              and str(value.get('run_id')) == os.environ['RUN_ID']
              and value.get('task_id') == os.environ['TASK_ID']
          ):
              raise SystemExit('REMOTE_PREPARING_TRANSACTION_MISMATCH')
          PY
          echo 'validated=true' >>"$GITHUB_OUTPUT"

      - name: Execute exact Production backup
        if: >-
          github.run_attempt == 1 && inputs.production_required == 'true' &&
          steps.preparing.outputs.validated == 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          UAART_REQUEST_PATH: ${{ inputs.request_path }}
          UAART_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TASK_CLASS: CRITICAL
          UAART_TASK_ID: ${{ needs.validate.outputs.task_id }}
          UAART_TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
          UAART_MANIFEST_SHA256: ${{ needs.validate.outputs.critical_manifest_sha256 }}
          UAART_BACKUP_RECEIPT_PATH: ${{ needs.validate.outputs.backup_receipt_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          python3 -I automation/execution_contract.py backup "$REQUEST_PATH" \
            --expected-class CRITICAL

      - name: Validate and package only backup receipt
        id: receipt
        shell: bash
        env:
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
        run: |
          set -euo pipefail
          python3 -I automation/execution_contract.py backup-receipt "$REQUEST_PATH" \
            --expected-class CRITICAL >/tmp/uaart-backup-validation.json
          install -d -m 700 /tmp/uaart-critical-backup
          install -m 600 "$BACKUP_RECEIPT_PATH" /tmp/uaart-critical-backup/backup.json
          echo "backup_manifest_sha256=$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-backup-validation.json"))["backup_manifest_sha256"])')" >>"$GITHUB_OUTPUT"
          echo "backup_receipt_sha256=$(sha256sum /tmp/uaart-critical-backup/backup.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload data-only backup receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-critical-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uaart-critical-backup/backup.json
          if-no-files-found: error
          retention-days: 2

  open:
    needs: [validate, prepare, backup]
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.production_required == 'true' &&
      needs.backup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    outputs:
      opened: ${{ steps.push.outputs.opened }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      BACKUP_RECEIPT_PATH: ${{ needs.validate.outputs.backup_receipt_path }}
      BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
      BACKUP_RECEIPT_SHA256: ${{ needs.backup.outputs.backup_receipt_sha256 }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative PREPARING state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download backup receipt outside checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uaart-critical-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-critical-backup

      - name: Strictly validate and materialize data-only backup receipt
        shell: bash
        env:
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          test "$(sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1)" = \
            "$RUNTIME_MANIFEST_SHA256"
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I automation/transaction_watchdog.py discover >/tmp/uaart-pending.json
          python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          pending = json.load(open('/tmp/uaart-pending.json', encoding='utf-8'))
          if not (
              pending.get('transaction_status') == 'PREPARING'
              and pending.get('transaction_id') == os.environ['TRANSACTION_ID']
              and pending.get('transaction_path') == os.environ['TRANSACTION_PATH']
          ):
              raise SystemExit('REMOTE_PREPARING_TRANSACTION_MISMATCH')
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-critical-backup'
          entries = list(folder.iterdir())
          if [item.name for item in entries] != ['backup.json']:
              raise SystemExit('BACKUP_ARTIFACT_INVENTORY')
          source = entries[0]
          if source.is_symlink() or not source.is_file() or source.stat().st_size > 1048576:
              raise SystemExit('BACKUP_ARTIFACT_FILE')
          payload = source.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['BACKUP_RECEIPT_SHA256']:
              raise SystemExit('BACKUP_ARTIFACT_SHA256')
          value = json.loads(payload.decode('utf-8'))
          if not isinstance(value, dict):
              raise SystemExit('BACKUP_ARTIFACT_JSON')
          rel = pathlib.PurePosixPath(os.environ['BACKUP_RECEIPT_PATH'])
          if rel.is_absolute() or '..' in rel.parts:
              raise SystemExit('BACKUP_TARGET_PATH')
          target = pathlib.Path(rel)
          if target.exists() or target.is_symlink():
              raise SystemExit('BACKUP_TARGET_PREEXISTING')
          if any(parent.is_symlink() for parent in target.parents):
              raise SystemExit('BACKUP_TARGET_SYMLINK')
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_bytes(payload)
          PY
          python3 -I automation/execution_contract.py backup-receipt "$REQUEST_PATH" \
            --expected-class CRITICAL >/tmp/uaart-backup-revalidated.json
          test "$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-backup-revalidated.json"))["backup_manifest_sha256"])')" = \
            "$BACKUP_MANIFEST_SHA256"
          echo 'UAART_DATA_ONLY_ARTIFACT_VALIDATED'

      - name: Commit and durably push OPEN
        id: push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          last_commit=''
          for attempt in 1 2 3 4 5 6; do
            git_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'
            parent="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$last_commit" && git merge-base --is-ancestor "$last_commit" "$parent"; then
              mapfile -d '' accepted_paths < <(git diff-tree --no-commit-id \
                --name-only -r -z "$last_commit")
              test "${#accepted_paths[@]}" -gt 0
              git diff --quiet "$last_commit" "$parent" -- "${accepted_paths[@]}" || exit 1
              opened_value='true'
              echo "opened=${opened_value}" >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$(git rev-parse "$parent:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
            git show "$parent:state/AUTOPILOT_RUNTIME_MANIFEST.json" \
              >"$RUNNER_TEMP/uaart-critical-open-runtime-${attempt}.json"
            test "$(sha256sum "$RUNNER_TEMP/uaart-critical-open-runtime-${attempt}.json" | cut -d' ' -f1)" = \
              "$RUNTIME_MANIFEST_SHA256"
            read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
            test "${#runtime_paths[@]}" -eq 18
            test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
            git diff --quiet "$WORKFLOW_SOURCE_COMMIT" "$parent" -- "${runtime_paths[@]}"
            rebuild="$RUNNER_TEMP/uaart-critical-open-${attempt}"
            index="$RUNNER_TEMP/uaart-critical-open-index-${attempt}"
            git worktree add --detach "$rebuild" "$parent"
            cd "$rebuild"
            python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
            python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
              --sha256 "$REQUEST_SHA256"
            python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
              --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
              --claim-path "$CLAIM_PATH"
            python3 -I automation/transaction_watchdog.py discover >"$RUNNER_TEMP/uaart-open-preparing.json"
            python3 -I - <<'PY'
          import json, os
          value = json.load(open(os.environ['RUNNER_TEMP'] + '/uaart-open-preparing.json', encoding='utf-8'))
          if value.get('transaction_status') != 'PREPARING' or value.get('transaction_id') != os.environ['TRANSACTION_ID'] or value.get('transaction_path') != os.environ['TRANSACTION_PATH']:
              raise SystemExit('OPEN_REBUILD_PREPARING_MISMATCH')
          PY
            source="$RUNNER_TEMP/uaart-critical-backup/backup.json"
            test -f "$source" && test ! -L "$source"
            test "$(sha256sum "$source" | cut -d' ' -f1)" = "$BACKUP_RECEIPT_SHA256"
            test ! -e "$BACKUP_RECEIPT_PATH"
            install -D -m 600 "$source" "$BACKUP_RECEIPT_PATH"
            UAART_RUN_ID="$RUN_ID" UAART_TRANSACTION_ID="$TRANSACTION_ID" \
              python3 -I automation/execution_contract.py backup-receipt "$REQUEST_PATH" \
                --expected-class CRITICAL >"$RUNNER_TEMP/uaart-open-backup.json"
            test "$(python3 -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-open-backup.json"))["backup_manifest_sha256"])')" = \
              "$BACKUP_MANIFEST_SHA256"
            python3 -I automation/control_plane.py transaction-open "$REQUEST_PATH" \
              --run-id "$RUN_ID" --transaction-id "$TRANSACTION_ID" \
              --backup-receipt-sha256 "$BACKUP_RECEIPT_SHA256" \
              --backup-manifest-sha256 "$BACKUP_MANIFEST_SHA256"
            rm -f "$index"
            GIT_INDEX_FILE="$index" git read-tree "$parent"
            for path in "$BACKUP_RECEIPT_PATH" "$CLAIM_PATH" "$TRANSACTION_PATH"; do
              test -f "$path" && test ! -L "$path"
              blob="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$index" git update-index --add \
                --cacheinfo "100644,${blob},${path}"
            done
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            export GIT_AUTHOR_NAME=ua-art-production-transaction
            export GIT_AUTHOR_EMAIL=actions@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit="$(printf '%s\n' "uaart production: open transaction $TASK_ID" | \
              git commit-tree "$tree" -p "$parent")"
            COMMIT="$commit"
            mapfile -d '' changed < <(git diff-tree --no-commit-id --name-only -r -z "$parent" "$commit")
            test "${#changed[@]}" -eq 3
            printf '%s\n' "${changed[@]}" | sort >"$RUNNER_TEMP/open-changed"
            printf '%s\n' "$BACKUP_RECEIPT_PATH" "$CLAIM_PATH" "$TRANSACTION_PATH" | sort >"$RUNNER_TEMP/open-expected"
            cmp "$RUNNER_TEMP/open-changed" "$RUNNER_TEMP/open-expected"
            cd "$GITHUB_WORKSPACE"
            last_commit="$commit"
            if git_auth push origin "$COMMIT:refs/heads/main"; then
              echo 'opened=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

  controller_production:
    needs: [validate, prepare, backup, open]
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      inputs.production_required == 'true' &&
      needs.open.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    environment:
      name: production
    outputs:
      controller_artifact_sha256: ${{ steps.evidence.outputs.controller_artifact_sha256 }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
      DEPENDENCY_SHA256: ${{ needs.validate.outputs.dependency_sha256 }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative OPEN state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate exact remote OPEN before credential exposure
        id: open_state
        shell: bash
        run: |
          set -euo pipefail
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
            --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
            --claim-path "$CLAIM_PATH"
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class CRITICAL >"$RUNNER_TEMP/uaart-controller-contract.json"
          test "$(python3 -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-controller-contract.json"))["dependency_sha256"])')" = \
            "$DEPENDENCY_SHA256"
          test "$(sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1)" = \
            "$RUNTIME_MANIFEST_SHA256"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          package_root="$(python3 -I -c 'import json,os,pathlib; print(pathlib.PurePosixPath(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-controller-contract.json"))["controller_path"]).parent.as_posix())')"
          test -n "$package_root" && test "$package_root" != '.'
          git diff --quiet "$SOURCE_COMMIT" HEAD -- "$package_root"
          python3 -I automation/transaction_watchdog.py discover >/tmp/uaart-open.json
          python3 -I - <<'PY'
          import json, os
          value = json.load(open('/tmp/uaart-open.json', encoding='utf-8'))
          if not (
              value.get('pending_count') == 1
              and value.get('transaction_status') == 'OPEN'
              and value.get('transaction_id') == os.environ['TRANSACTION_ID']
              and value.get('transaction_path') == os.environ['TRANSACTION_PATH']
              and value.get('request_path') == os.environ['REQUEST_PATH']
              and value.get('request_sha256') == os.environ['REQUEST_SHA256']
              and str(value.get('run_id')) == os.environ['RUN_ID']
              and value.get('task_id') == os.environ['TASK_ID']
          ):
              raise SystemExit('REMOTE_OPEN_TRANSACTION_MISMATCH')
          PY
          echo 'validated=true' >>"$GITHUB_OUTPUT"

      - name: Execute authorized CRITICAL Production controller
        if: >-
          github.run_attempt == 1 && inputs.production_required == 'true' &&
          steps.open_state.outputs.validated == 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          UAART_REQUEST_PATH: ${{ inputs.request_path }}
          UAART_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TASK_CLASS: CRITICAL
          UAART_TASK_ID: ${{ needs.validate.outputs.task_id }}
          UAART_TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
          UAART_MANIFEST_SHA256: ${{ needs.validate.outputs.critical_manifest_sha256 }}
          UAART_RECEIPT_PATH: ${{ needs.validate.outputs.receipt_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          python3 -I automation/execution_contract.py run "$REQUEST_PATH" \
            --expected-class CRITICAL

      - name: Package bounded data-only controller evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/uaart-critical-controller
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          request_bytes = subprocess.check_output(['git', 'show', 'HEAD:' + os.environ['REQUEST_PATH']])
          if hashlib.sha256(request_bytes).hexdigest() != os.environ['REQUEST_SHA256']:
              raise SystemExit('CONTROLLER_ENVELOPE_REQUEST_SHA')
          execution = json.loads(request_bytes)['execution']
          excluded = {
              str(execution.get('backup_receipt_path') or ''),
              str(execution.get('rollback_receipt_path') or ''),
          }
          allowed = sorted(set(map(str, execution['evidence_paths'])) - excluded)
          files, total = [], 0
          for raw in allowed:
              rel = pathlib.PurePosixPath(raw)
              if rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit('CONTROLLER_EVIDENCE_PATH')
              path = pathlib.Path(rel)
              if not path.exists():
                  continue
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('CONTROLLER_EVIDENCE_FILE')
              data = path.read_bytes()
              total += len(data)
              if len(data) > 16 * 1024 * 1024 or total > 32 * 1024 * 1024:
                  raise SystemExit('CONTROLLER_EVIDENCE_SIZE')
              files.append({
                  'content_base64': base64.b64encode(data).decode('ascii'),
                  'path': raw, 'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })
          if execution['receipt_path'] not in {item['path'] for item in files}:
              raise SystemExit('CONTROLLER_RECEIPT_MISSING')
          envelope = {
              'files': files, 'request_sha256': os.environ['REQUEST_SHA256'],
              'run_id': os.environ['RUN_ID'],
              'schema_version': 'UA-ART-CONTROLLER-EVIDENCE-1',
              'task_id': os.environ['TASK_ID'],
              'transaction_id': os.environ['TRANSACTION_ID'],
          }
          pathlib.Path('/tmp/uaart-critical-controller/controller.json').write_text(
              json.dumps(envelope, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          echo "controller_artifact_sha256=$(sha256sum /tmp/uaart-critical-controller/controller.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload data-only Production controller evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-critical-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uaart-critical-controller/controller.json
          if-no-files-found: error
          retention-days: 2

  controller_nonproduction:
    needs: validate
    if: github.ref == 'refs/heads/main' && inputs.production_required != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      contents: read
    outputs:
      controller_artifact_sha256: ${{ steps.evidence.outputs.controller_artifact_sha256 }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
