      - name: Revalidate immutable non-Production contract
        shell: bash
        run: |
          set -euo pipefail
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
            --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
            --claim-path "$CLAIM_PATH"
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class CRITICAL >/tmp/uaart-nonprod-contract.json
          test "$(python3 -I -c 'import json; print(json.load(open("/tmp/uaart-nonprod-contract.json"))["dependency_sha256"])')" = \
            "$DEPENDENCY_SHA256"
          test "$(sha256sum state/AUTOPILOT_RUNTIME_MANIFEST.json | cut -d' ' -f1)" = \
            "$RUNTIME_MANIFEST_SHA256"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          package_root="$(python3 -I -c 'import json,pathlib; print(pathlib.PurePosixPath(json.load(open("/tmp/uaart-nonprod-contract.json"))["controller_path"]).parent.as_posix())')"
          test -n "$package_root" && test "$package_root" != '.'
          git diff --quiet "$SOURCE_COMMIT" HEAD -- "$package_root"

      - name: Execute authorized CRITICAL controller without Production credential
        if: inputs.production_required != 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.UAART_NONPRODUCTION_PYTHONANYWHERE_TOKEN }}
          UAART_REQUEST_PATH: ${{ inputs.request_path }}
          UAART_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TASK_CLASS: CRITICAL
          UAART_TASK_ID: ${{ needs.validate.outputs.task_id }}
          UAART_RECEIPT_PATH: ${{ needs.validate.outputs.receipt_path }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I automation/execution_contract.py run "$REQUEST_PATH" \
            --expected-class CRITICAL

      - name: Package bounded data-only non-Production evidence
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 /tmp/uaart-critical-controller
          python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib, subprocess
          request_bytes = subprocess.check_output(['git', 'show', 'HEAD:' + os.environ['REQUEST_PATH']])
          if hashlib.sha256(request_bytes).hexdigest() != os.environ['REQUEST_SHA256']:
              raise SystemExit('CONTROLLER_ENVELOPE_REQUEST_SHA')
          execution = json.loads(request_bytes)['execution']
          excluded = {
              str(execution.get('backup_receipt_path') or ''),
              str(execution.get('rollback_receipt_path') or ''),
          }
          allowed = sorted(set(map(str, execution['evidence_paths'])) - excluded)
          files, total = [], 0
          for raw in allowed:
              rel = pathlib.PurePosixPath(raw)
              if rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit('CONTROLLER_EVIDENCE_PATH')
              path = pathlib.Path(rel)
              if not path.exists():
                  continue
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('CONTROLLER_EVIDENCE_FILE')
              data = path.read_bytes()
              total += len(data)
              if len(data) > 16 * 1024 * 1024 or total > 32 * 1024 * 1024:
                  raise SystemExit('CONTROLLER_EVIDENCE_SIZE')
              files.append({
                  'content_base64': base64.b64encode(data).decode('ascii'),
                  'path': raw, 'sha256': hashlib.sha256(data).hexdigest(),
                  'size': len(data),
              })
          if execution['receipt_path'] not in {item['path'] for item in files}:
              raise SystemExit('CONTROLLER_RECEIPT_MISSING')
          envelope = {
              'files': files, 'request_sha256': os.environ['REQUEST_SHA256'],
              'run_id': os.environ['RUN_ID'],
              'schema_version': 'UA-ART-CONTROLLER-EVIDENCE-1',
              'task_id': os.environ['TASK_ID'], 'transaction_id': '',
          }
          pathlib.Path('/tmp/uaart-critical-controller/controller.json').write_text(
              json.dumps(envelope, ensure_ascii=False, sort_keys=True) + '\n', encoding='utf-8'
          )
          PY
          echo "controller_artifact_sha256=$(sha256sum /tmp/uaart-critical-controller/controller.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload data-only non-Production controller evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-critical-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uaart-critical-controller/controller.json
          if-no-files-found: error
          retention-days: 2

  finalize:
    needs: [validate, prepare, backup, open, controller_production, controller_nonproduction]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      ((inputs.production_required == 'true' && github.run_attempt == 1 &&
      needs.controller_production.result == 'success') ||
      (inputs.production_required != 'true' && needs.controller_nonproduction.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      status: ${{ steps.persist.outputs.status }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      RECEIPT_PATH: ${{ needs.validate.outputs.receipt_path }}
      PRODUCTION_REQUIRED: ${{ inputs.production_required }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download validation attestation outside checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uaart-critical-validation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-critical-validation

      - name: Download controller evidence outside checkout
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uaart-critical-controller-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-critical-controller

      - name: Strictly validate data-only finalization artifacts
        shell: bash
        env:
          DEPENDENCY_SHA256: ${{ needs.validate.outputs.dependency_sha256 }}
          RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
          SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
          VALIDATION_ARTIFACT_SHA256: ${{ needs.validate.outputs.validation_artifact_sha256 }}
          PRODUCTION_CONTROLLER_ARTIFACT_SHA256: ${{ needs.controller_production.outputs.controller_artifact_sha256 }}
          NONPRODUCTION_CONTROLLER_ARTIFACT_SHA256: ${{ needs.controller_nonproduction.outputs.controller_artifact_sha256 }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "HEAD:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
          read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
          test "${#runtime_paths[@]}" -eq 18
          test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
          git diff --quiet "$WORKFLOW_SOURCE_COMMIT" HEAD -- "${runtime_paths[@]}"
          python3 -I - <<'PY'
          import base64, binascii, hashlib, json, os, pathlib, re

          temp = pathlib.Path(os.environ['RUNNER_TEMP'])
          validation_files = list((temp / 'uaart-critical-validation').iterdir())
          if [item.name for item in validation_files] != ['validation.json']:
              raise SystemExit('VALIDATION_ARTIFACT_INVENTORY')
          validation_path = validation_files[0]
          if validation_path.is_symlink() or not validation_path.is_file() or validation_path.stat().st_size > 8192:
              raise SystemExit('VALIDATION_ARTIFACT_FILE')
          validation_payload = validation_path.read_bytes()
          if hashlib.sha256(validation_payload).hexdigest() != os.environ['VALIDATION_ARTIFACT_SHA256']:
              raise SystemExit('VALIDATION_ARTIFACT_SHA256')
          validation = json.loads(validation_payload.decode('utf-8'))
          validation_keys = {
              'compiled', 'dependency_sha256', 'production_required',
              'request_path', 'request_sha256', 'run_id',
              'runtime_manifest_sha256', 'schema_version', 'source_commit',
              'status', 'task_id', 'tests', 'workflow_run_attempt',
              'workflow_run_id', 'workflow_blob_oid', 'workflow_source_commit',
          }
          if not isinstance(validation, dict) or set(validation) != validation_keys:
              raise SystemExit('VALIDATION_ARTIFACT_SCHEMA')
          expected_production = os.environ['PRODUCTION_REQUIRED'] == 'true'
          if not (
              validation.get('compiled') == 'PASS'
              and validation.get('dependency_sha256') == os.environ['DEPENDENCY_SHA256']
              and validation.get('tests') == 'PASS'
              and validation.get('status') == 'PASS'
              and validation.get('production_required') is expected_production
              and validation.get('request_path') == os.environ['REQUEST_PATH']
              and validation.get('request_sha256') == os.environ['REQUEST_SHA256']
              and validation.get('run_id') == os.environ['RUN_ID']
              and validation.get('runtime_manifest_sha256') == os.environ['RUNTIME_MANIFEST_SHA256']
              and validation.get('task_id') == os.environ['TASK_ID']
              and validation.get('source_commit') == os.environ['SOURCE_COMMIT']
              and validation.get('schema_version') == 'UA-ART-CRITICAL-VALIDATION-1'
              and validation.get('workflow_run_id') == os.environ['GITHUB_RUN_ID']
              and validation.get('workflow_run_attempt') == int(os.environ['GITHUB_RUN_ATTEMPT'])
              and validation.get('workflow_blob_oid') == os.environ['WORKFLOW_BLOB_OID']
              and validation.get('workflow_source_commit') == os.environ['WORKFLOW_SOURCE_COMMIT']
              and re.fullmatch(r'[0-9a-f]{40}', validation.get('source_commit', ''))
          ):
              raise SystemExit('VALIDATION_ARTIFACT_BINDING')
          if hashlib.sha256(
              pathlib.Path('state/AUTOPILOT_RUNTIME_MANIFEST.json').read_bytes()
          ).hexdigest() != os.environ['RUNTIME_MANIFEST_SHA256']:
              raise SystemExit('VALIDATION_RUNTIME_MANIFEST_DRIFT')

          controller_files = list((temp / 'uaart-critical-controller').iterdir())
          if [item.name for item in controller_files] != ['controller.json']:
              raise SystemExit('CONTROLLER_ARTIFACT_INVENTORY')
          envelope_path = controller_files[0]
          if envelope_path.is_symlink() or not envelope_path.is_file() or envelope_path.stat().st_size > 48 * 1024 * 1024:
              raise SystemExit('CONTROLLER_ARTIFACT_FILE')
          envelope_payload = envelope_path.read_bytes()
          expected_envelope_sha = (
              os.environ['PRODUCTION_CONTROLLER_ARTIFACT_SHA256']
              if expected_production
              else os.environ['NONPRODUCTION_CONTROLLER_ARTIFACT_SHA256']
          )
          if hashlib.sha256(envelope_payload).hexdigest() != expected_envelope_sha:
              raise SystemExit('CONTROLLER_ARTIFACT_SHA256')
          envelope = json.loads(envelope_payload.decode('utf-8'))
          if not isinstance(envelope, dict) or set(envelope) != {
              'files', 'request_sha256', 'run_id', 'schema_version',
              'task_id', 'transaction_id',
          }:
              raise SystemExit('CONTROLLER_ARTIFACT_SCHEMA')
          expected_transaction = os.environ['TRANSACTION_ID'] if expected_production else ''
          if not (
              envelope.get('request_sha256') == os.environ['REQUEST_SHA256']
              and envelope.get('run_id') == os.environ['RUN_ID']
              and envelope.get('task_id') == os.environ['TASK_ID']
              and envelope.get('transaction_id') == expected_transaction
              and envelope.get('schema_version') == 'UA-ART-CONTROLLER-EVIDENCE-1'
          ):
              raise SystemExit('CONTROLLER_ARTIFACT_BINDING')
          request = json.loads(pathlib.Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          execution = request['execution']
          excluded = {
              str(execution.get('backup_receipt_path') or ''),
              str(execution.get('rollback_receipt_path') or ''),
          }
          allowed = set(map(str, execution['evidence_paths'])) - excluded
          entries = envelope['files']
          if not isinstance(entries, list) or len(entries) > 30:
              raise SystemExit('CONTROLLER_ARTIFACT_FILES')
          seen, total = set(), 0
          for entry in entries:
              if not isinstance(entry, dict) or set(entry) != {
                  'content_base64', 'path', 'sha256', 'size',
              }:
                  raise SystemExit('CONTROLLER_ARTIFACT_ENTRY')
              raw = entry['path']
              rel = pathlib.PurePosixPath(raw)
              if raw not in allowed or raw in seen or rel.is_absolute() or '..' in rel.parts:
                  raise SystemExit('CONTROLLER_ARTIFACT_PATH')
              seen.add(raw)
              try:
                  data = base64.b64decode(entry['content_base64'], validate=True)
              except (ValueError, binascii.Error) as exc:
                  raise SystemExit('CONTROLLER_ARTIFACT_BASE64') from exc
              total += len(data)
              if entry['size'] != len(data) or len(data) > 16 * 1024 * 1024 or total > 32 * 1024 * 1024:
                  raise SystemExit('CONTROLLER_ARTIFACT_SIZE')
              if hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise SystemExit('CONTROLLER_ARTIFACT_SHA256')
          if execution['receipt_path'] not in seen:
              raise SystemExit('CONTROLLER_ARTIFACT_RECEIPT_MISSING')
          print('UAART_DATA_ONLY_ARTIFACT_VALIDATED')
          PY

      - name: Persist trusted FINISHED evidence with isolated Git trees
        id: persist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git_auth() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          last_commit=''
          for attempt in 1 2 3 4 5 6; do
            git_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'
            parent="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$last_commit" && git merge-base --is-ancestor "$last_commit" "$parent"; then
              mapfile -d '' accepted_paths < <(git diff-tree --no-commit-id \
                --name-only -r -z "$last_commit")
              test "${#accepted_paths[@]}" -gt 0
              git diff --quiet "$last_commit" "$parent" -- "${accepted_paths[@]}" || exit 1
              status_value='FINISHED'
              echo "status=${status_value}" >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$(git rev-parse "$parent:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
            git show "$parent:state/AUTOPILOT_RUNTIME_MANIFEST.json" \
              >"$RUNNER_TEMP/uaart-critical-finalize-runtime-${attempt}.json"
            test "$(sha256sum "$RUNNER_TEMP/uaart-critical-finalize-runtime-${attempt}.json" | cut -d' ' -f1)" = \
              "$RUNTIME_MANIFEST_SHA256"
            read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
            test "${#runtime_paths[@]}" -eq 18
            test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
            git diff --quiet "$WORKFLOW_SOURCE_COMMIT" "$parent" -- "${runtime_paths[@]}"
            rebuild="$RUNNER_TEMP/uaart-critical-finalize-${attempt}"
            index="$RUNNER_TEMP/uaart-critical-finalize-index-${attempt}"
            git worktree add --detach "$rebuild" "$parent"
            cd "$rebuild"
            python3 -I automation/control_plane.py verify-mode --require AUTOMATIC
            python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
              --sha256 "$REQUEST_SHA256"
            python3 -I automation/control_plane.py verify-identity "$REQUEST_PATH" \
              --task-id "$TASK_ID" --sha256 "$REQUEST_SHA256" --run-id "$RUN_ID" \
              --claim-path "$CLAIM_PATH"
            python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
              --expected-class CRITICAL >"$RUNNER_TEMP/uaart-final-contract.json"
            python3 -I - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path.cwd().resolve()
          envelope = json.load(open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-critical-controller/controller.json', encoding='utf-8'))
          spec = json.load(open(pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-final-contract.json', encoding='utf-8'))
          excluded = {spec.get('backup_receipt_path'), spec.get('rollback_receipt_path')}
          allowed = set(spec['evidence_paths']) - excluded
          if not (
              envelope['request_sha256'] == spec['request_sha256'] == os.environ['REQUEST_SHA256']
              and envelope['run_id'] == os.environ['RUN_ID']
              and envelope['task_id'] == os.environ['TASK_ID']
              and envelope['transaction_id'] == (os.environ['TRANSACTION_ID'] if os.environ['PRODUCTION_REQUIRED'] == 'true' else '')
          ):
              raise SystemExit('REBUILD_ARTIFACT_BINDING')
          seen = set()
          for entry in envelope['files']:
              raw = entry['path']
              if raw not in allowed or raw in seen:
                  raise SystemExit('REBUILD_ARTIFACT_PATH')
              seen.add(raw)
              data = base64.b64decode(entry['content_base64'], validate=True)
              if len(data) != entry['size'] or hashlib.sha256(data).hexdigest() != entry['sha256']:
                  raise SystemExit('REBUILD_ARTIFACT_HASH')
              target = root / pathlib.PurePosixPath(raw)
              if not target.resolve(strict=False).is_relative_to(root) or target.is_symlink():
                  raise SystemExit('REBUILD_TARGET_SCOPE')
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o644)
          if spec['receipt_path'] not in seen:
              raise SystemExit('REBUILD_RECEIPT_MISSING')
          PY
            if test "$PRODUCTION_REQUIRED" = true; then
              python3 -I automation/transaction_watchdog.py discover >"$RUNNER_TEMP/uaart-final-open.json"
              python3 -I - <<'PY'
          import json, os
          value = json.load(open(os.environ['RUNNER_TEMP'] + '/uaart-final-open.json', encoding='utf-8'))
          if value.get('transaction_status') != 'OPEN' or value.get('transaction_id') != os.environ['TRANSACTION_ID']:
              raise SystemExit('FINALIZE_REMOTE_OPEN_MISMATCH')
          PY
              python3 -I automation/control_plane.py health "$REQUEST_PATH" \
                --run-id "$RUN_ID" --phase post
            else
              python3 -I automation/control_plane.py planning "$REQUEST_PATH" --run-id "$RUN_ID"
              python3 -I automation/control_plane.py storage "$REQUEST_PATH" \
                --run-id "$RUN_ID" --enforce
              python3 -I automation/control_plane.py compiled "$REQUEST_PATH" --run-id "$RUN_ID"
              python3 -I automation/control_plane.py critical-nonprod "$REQUEST_PATH" \
                --run-id "$RUN_ID"
            fi
            python3 -I automation/execution_contract.py receipt "$REQUEST_PATH" \
              --expected-class CRITICAL >"$RUNNER_TEMP/uaart-final-receipt.json"
            if test "$PRODUCTION_REQUIRED" = true; then
              python3 -I - <<'PY'
          import json, os, pathlib
          request = json.load(open(os.environ['REQUEST_PATH'], encoding='utf-8'))
          critical = request['critical']
          value = {
              'task_id': request['task_id'], 'title': request['title'],
              'description': request.get('description', ''),
              'changed_paths': request.get('changed_paths', []),
              'production_required': True,
              'requested_min_class': request.get('requested_min_class'),
              'owner_approval_path': critical['owner_approval_path'],
              'owner_approval_sha256': critical['owner_approval_sha256'],
              'manifest_path': critical['manifest_path'],
              'manifest_sha256': critical['manifest_sha256'],
              'gate_b_authorized': critical['gate_b_authorized'],
              'allow_crm_vehicle_data': critical.get('allow_crm_vehicle_data', False),
          }
          pathlib.Path('/tmp/uaart-final-critical.json').write_text(json.dumps(value, sort_keys=True) + '\n')
          PY
              python3 -I automation/critical_adapter.py validate-final \
                /tmp/uaart-final-critical.json "$RECEIPT_PATH" >/dev/null
            fi
            python3 -I automation/control_plane.py finish "$REQUEST_PATH" \
              --run-id "$RUN_ID" >/dev/null
            if test "$PRODUCTION_REQUIRED" = true; then
              python3 -I automation/control_plane.py transaction-close "$REQUEST_PATH" \
                --run-id "$RUN_ID" --transaction-id "$TRANSACTION_ID" \
                --outcome FINISHED >/dev/null
            fi
            rm -f "$index"
            GIT_INDEX_FILE="$index" git read-tree "$parent"
            mapfile -d '' paths < <(python3 -I - <<'PY'
          import json, os, sys
          spec = json.load(open(os.environ['RUNNER_TEMP'] + '/uaart-final-contract.json', encoding='utf-8'))
          paths = set(spec['evidence_paths']) | {os.environ['CLAIM_PATH']}
          if os.environ['PRODUCTION_REQUIRED'] == 'true':
              paths.add(os.environ['TRANSACTION_PATH'])
          for path in sorted(paths):
              if path and __import__('pathlib').Path(path).is_file():
                  sys.stdout.buffer.write(path.encode() + b'\0')
          PY
            )
            for path in "${paths[@]}"; do
              test -f "$path" && test ! -L "$path"
              blob="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$index" git update-index --add \
                --cacheinfo "100644,${blob},${path}"
            done
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            export GIT_AUTHOR_NAME=ua-art-critical-pipeline
            export GIT_AUTHOR_EMAIL=actions@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit="$(printf '%s\n' "uaart critical: $TASK_ID FINISHED" | \
              git commit-tree "$tree" -p "$parent")"
            COMMIT="$commit"
            COMMIT="$commit" PARENT="$parent" python3 -I - <<'PY'
          import json, os, subprocess
          spec = json.load(open(os.environ['RUNNER_TEMP'] + '/uaart-final-contract.json', encoding='utf-8'))
          allowed = set(spec['evidence_paths']) | {os.environ['CLAIM_PATH']}
          required = {spec['receipt_path'], os.environ['CLAIM_PATH']}
          if os.environ['PRODUCTION_REQUIRED'] == 'true':
              allowed.add(os.environ['TRANSACTION_PATH'])
              required.add(os.environ['TRANSACTION_PATH'])
          raw = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', '-z', os.environ['PARENT'], os.environ['COMMIT']])
          changed = set(filter(None, raw.decode().split('\0')))
          if not required.issubset(changed) or not changed.issubset(allowed):
              raise SystemExit('FINAL_COMMIT_TREE_SCOPE')
          PY
            cd "$GITHUB_WORKSPACE"
            last_commit="$commit"
            if git_auth push origin "$COMMIT:refs/heads/main"; then
              echo 'status=FINISHED' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

  rollback_execute:
    needs: [validate, prepare, backup, rollback_mark]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && inputs.production_required == 'true' &&
      needs.rollback_mark.outputs.marked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    environment:
      name: production
    outputs:
      performed: ${{ steps.receipt.outputs.performed }}
      rollback_receipt_sha256: ${{ steps.receipt.outputs.rollback_receipt_sha256 }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
      ROLLBACK_RECEIPT_PATH: ${{ needs.validate.outputs.rollback_receipt_path }}
      DEPENDENCY_SHA256: ${{ needs.validate.outputs.dependency_sha256 }}
      RUNTIME_MANIFEST_SHA256: ${{ needs.validate.outputs.runtime_manifest_sha256 }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      PINNED_ROOT: ${{ github.workspace }}/../uaart-critical-pinned-recovery
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative ROLLING_BACK state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Validate durable one-shot rollback reservation
        id: rolling_back
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test "$(git rev-parse "$SOURCE_COMMIT:$WORKFLOW_PATH")" = \
            "$WORKFLOW_BLOB_OID"
          test ! -e "$PINNED_ROOT"
          git -c core.hooksPath=/dev/null worktree add --detach \
            "$PINNED_ROOT" "$SOURCE_COMMIT"
          test "$(git -C "$PINNED_ROOT" rev-parse HEAD)" = "$SOURCE_COMMIT"

          python3 -I - <<'PY'
          import json, os, pathlib, re, shutil

          source_root = pathlib.Path.cwd().resolve()
          pinned_root = pathlib.Path(os.environ['PINNED_ROOT']).resolve()

          def load(relative, label):
              if not isinstance(relative, str) or not re.fullmatch(r'[A-Za-z0-9._/-]+', relative):
                  raise SystemExit(label + '_PATH')
              pure = pathlib.PurePosixPath(relative)
              if pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit(label + '_PATH')
              path = source_root / pure
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(source_root):
                  raise SystemExit(label + '_FILE')
              if any(parent.is_symlink() for parent in path.parents if parent != source_root):
                  raise SystemExit(label + '_SYMLINK')
              data = path.read_bytes()
              if len(data) > 2 * 1024 * 1024:
                  raise SystemExit(label + '_SIZE')
              try:
                  value = json.loads(data.decode('utf-8'))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(label + '_JSON') from exc
              if not isinstance(value, dict):
                  raise SystemExit(label + '_OBJECT')
              return pure, data, value

          claim_rel, claim_data, claim = load(os.environ['CLAIM_PATH'], 'PINNED_CLAIM')
          tx_rel, tx_data, transaction = load(os.environ['TRANSACTION_PATH'], 'PINNED_TRANSACTION')
          request_rel, request_data, _ = load(os.environ['REQUEST_PATH'], 'PINNED_REQUEST')
          ledger_rel, ledger_data, _ = load(claim.get('autostart_ledger_path'), 'PINNED_LEDGER')
          backup_rel, backup_data, _ = load(transaction.get('backup_receipt_path'), 'PINNED_BACKUP')
          if claim.get('autostart_source_commit') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('PINNED_SOURCE_COMMIT_BINDING')
          if transaction.get('request_path') != os.environ['REQUEST_PATH']:
              raise SystemExit('PINNED_REQUEST_BINDING')
          items = {
              claim_rel: claim_data,
              tx_rel: tx_data,
              request_rel: request_data,
              ledger_rel: ledger_data,
              backup_rel: backup_data,
          }
          if len(items) != 5:
              raise SystemExit('PINNED_DURABLE_PATH_ALIAS')
          for relative, data in items.items():
              target = pinned_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              if any(parent.is_symlink() for parent in target.parents if parent != pinned_root):
                  raise SystemExit('PINNED_DESTINATION_SYMLINK')
              target.write_bytes(data)
          print('UAART_PINNED_DURABLE_STATE_COPIED')
          PY

          cd "$PINNED_ROOT"
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib, re

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('PINNED_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }
          root = pathlib.Path.cwd().resolve()
          manifest_path = root / 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          if manifest_path.is_symlink() or not manifest_path.is_file():
              raise SystemExit('PINNED_RUNTIME_MANIFEST_FILE')
          payload = manifest_path.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['RUNTIME_MANIFEST_SHA256']:
              raise SystemExit('PINNED_RUNTIME_MANIFEST_BINDING')
          manifest = json.loads(payload, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('PINNED_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('PINNED_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('PINNED_RUNTIME_FILE_SET')
          total = 0
          for relative, expected in files.items():
              pure = pathlib.PurePosixPath(relative)
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', relative) or pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit('PINNED_RUNTIME_PATH')
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('PINNED_RUNTIME_HASH')
              target = root / pure
              if target.is_symlink() or not target.is_file() or target.resolve() != target:
                  raise SystemExit('PINNED_RUNTIME_TARGET:' + relative)
              data = target.read_bytes()
              total += len(data)
              if len(data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('PINNED_RUNTIME_SIZE')
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('PINNED_RUNTIME_FILE_SHA:' + relative)
          print('UAART_PINNED_RUNTIME_CLOSURE_VALIDATED')
          PY
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC \
            --allow-halt-for-recovery
          python3 -I automation/control_plane.py verify-request "$REQUEST_PATH" \
            --sha256 "$REQUEST_SHA256"
          python3 -I automation/execution_contract.py validate "$REQUEST_PATH" \
            --expected-class CRITICAL >"$RUNNER_TEMP/uaart-rollback-contract.json"
          test "$(python3 -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-rollback-contract.json"))["dependency_sha256"])')" = \
            "$DEPENDENCY_SHA256"
          python3 -I automation/transaction_watchdog.py discover >"$RUNNER_TEMP/uaart-rolling-back.json"
          python3 -I - <<'PY'
          import json, os
          value = json.load(open(os.environ['RUNNER_TEMP'] + '/uaart-rolling-back.json', encoding='utf-8'))
          if not (
              value.get('pending_count') == 1
              and value.get('transaction_status') == 'ROLLING_BACK'
              and value.get('transaction_id') == os.environ['TRANSACTION_ID']
              and value.get('transaction_path') == os.environ['TRANSACTION_PATH']
              and value.get('request_path') == os.environ['REQUEST_PATH']
              and value.get('request_sha256') == os.environ['REQUEST_SHA256']
              and str(value.get('run_id')) == os.environ['RUN_ID']
              and value.get('task_id') == os.environ['TASK_ID']
              and value.get('claim_path') == os.environ['CLAIM_PATH']
              and value.get('source_commit') == os.environ['SOURCE_COMMIT']
          ):
              raise SystemExit('REMOTE_ROLLING_BACK_TRANSACTION_MISMATCH')
          PY
          echo 'validated=true' >>"$GITHUB_OUTPUT"

      - name: Execute exact one-shot Production rollback
        if: >-
          github.run_attempt == 1 && inputs.production_required == 'true' &&
          steps.rolling_back.outputs.validated == 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          UAART_REQUEST_PATH: ${{ inputs.request_path }}
          UAART_REQUEST_SHA256: ${{ inputs.request_sha256 }}
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TASK_CLASS: CRITICAL
          UAART_TASK_ID: ${{ needs.validate.outputs.task_id }}
          UAART_TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
          UAART_MANIFEST_SHA256: ${{ needs.validate.outputs.critical_manifest_sha256 }}
          UAART_RECEIPT_PATH: ${{ needs.validate.outputs.receipt_path }}
          UAART_ROLLBACK_RECEIPT_PATH: ${{ needs.validate.outputs.rollback_receipt_path }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          cd "$PINNED_ROOT"
          python3 -I automation/execution_contract.py rollback "$REQUEST_PATH" \
            --expected-class CRITICAL

      - name: Validate and package only rollback receipt
        id: receipt
        shell: bash
        env:
          UAART_RUN_ID: ${{ inputs.run_id }}
          UAART_TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
        run: |
          set -euo pipefail
          cd "$PINNED_ROOT"
          python3 -I automation/execution_contract.py rollback-receipt "$REQUEST_PATH" \
            --expected-class CRITICAL >"$RUNNER_TEMP/uaart-rollback-validation.json"
          install -d -m 700 /tmp/uaart-critical-rollback
          install -m 600 "$ROLLBACK_RECEIPT_PATH" /tmp/uaart-critical-rollback/rollback.json
          echo "rollback_receipt_sha256=$(sha256sum /tmp/uaart-critical-rollback/rollback.json | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"
          echo 'performed=true' >>"$GITHUB_OUTPUT"

      - name: Upload data-only rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-critical-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/uaart-critical-rollback/rollback.json
          if-no-files-found: error
          retention-days: 2

  recover:
    needs: [validate, prepare, backup, open, controller_production, finalize, rollback_mark, rollback_execute]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      inputs.production_required == 'true' &&
      (failure() || cancelled() || needs.finalize.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      actions: read
    outputs:
      halted: ${{ steps.persist.outputs.halted }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      ROLLBACK_RECEIPT_PATH: ${{ needs.validate.outputs.rollback_receipt_path }}
      BACKUP_MANIFEST_SHA256: ${{ needs.backup.outputs.backup_manifest_sha256 }}
      CRITICAL_MANIFEST_SHA256: ${{ needs.validate.outputs.critical_manifest_sha256 }}
      ROLLBACK_PERFORMED: ${{ needs.rollback_execute.outputs.performed }}
      ROLLBACK_RECEIPT_SHA256: ${{ needs.rollback_execute.outputs.rollback_receipt_sha256 }}
      CONTRACT_VALIDATED: ${{ needs.validate.result == 'success' }}
      ROLLBACK_MARKED: ${{ needs.rollback_mark.outputs.marked }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative recovery state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Download rollback receipt outside checkout
        if: >-
          github.run_attempt == 1 &&
          needs.rollback_execute.outputs.performed == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: uaart-critical-rollback-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/uaart-critical-rollback

      - name: Strictly validate data-only rollback artifact
        if: >-
          github.run_attempt == 1 &&
          needs.rollback_execute.outputs.performed == 'true'
        id: rollback_receipt
        shell: bash
        run: |
          set -euo pipefail
          folder="$RUNNER_TEMP/uaart-critical-rollback"
          test "$(find "$folder" -mindepth 1 -maxdepth 1 -printf '%f\n')" = rollback.json
          test -f "$folder/rollback.json" && test ! -L "$folder/rollback.json"
          test "$(stat -c %s "$folder/rollback.json")" -le 1048576
          python3 -I - <<'PY'
          import hashlib, json, os, pathlib
          source = pathlib.Path(os.environ['RUNNER_TEMP']) / 'uaart-critical-rollback/rollback.json'
          payload = source.read_bytes()
          if hashlib.sha256(payload).hexdigest() != os.environ['ROLLBACK_RECEIPT_SHA256']:
              raise SystemExit('ROLLBACK_ARTIFACT_SHA256')
          value = json.loads(payload.decode('utf-8'))
          keys = {
              'backup_manifest_sha256', 'crm_unchanged', 'live_verify',
              'manifest_sha256', 'operation', 'protected_files_unchanged',
              'request_sha256', 'restored', 'rollback', 'run_id',
              'schema_version', 'status', 'task_id', 'transaction_id',
              'unexpected_changes',
          }
          if not isinstance(value, dict) or set(value) != keys:
              raise SystemExit('ROLLBACK_ARTIFACT_SCHEMA')
          if not (
              value.get('request_sha256') == os.environ['REQUEST_SHA256']
              and str(value.get('run_id')) == os.environ['RUN_ID']
              and value.get('task_id') == os.environ['TASK_ID']
              and value.get('transaction_id') == os.environ['TRANSACTION_ID']
              and value.get('backup_manifest_sha256') == os.environ['BACKUP_MANIFEST_SHA256']
              and value.get('manifest_sha256') == os.environ['CRITICAL_MANIFEST_SHA256']
              and value.get('schema_version') == 'UA-ART-PRODUCTION-ROLLBACK-RECEIPT-1'
              and value.get('operation') == 'rollback'
              and value.get('status') in {'PASS', 'ROLLED_BACK'}
              and value.get('rollback') == 'PASS'
              and value.get('restored') is True
              and type(value.get('unexpected_changes')) is int
              and value.get('unexpected_changes') == 0
              and value.get('protected_files_unchanged') is True
              and value.get('crm_unchanged') is True
              and value.get('live_verify') == 'PASS'
          ):
              raise SystemExit('ROLLBACK_ARTIFACT_BINDING')
          print('UAART_DATA_ONLY_ARTIFACT_VALIDATED')
          PY
          echo 'validated=true' >>"$GITHUB_OUTPUT"

      - name: Persist HALT and optional proven rollback with isolated Git trees
        id: persist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_VALIDATED: ${{ steps.rollback_receipt.outputs.validated }}
        run: |
          set -euo pipefail
          # Without a successful read-only attestation no trusted runtime exists;
          # Production has not started, so fail without consuming write authority.
          test "$CONTRACT_VALIDATED" = true
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          last_commit=''
          for attempt in 1 2 3 4 5 6; do
            git_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'
            parent="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$last_commit" && git merge-base --is-ancestor "$last_commit" "$parent"; then
              mapfile -d '' accepted_paths < <(git diff-tree --no-commit-id \
                --name-only -r -z "$last_commit")
              test "${#accepted_paths[@]}" -gt 0
              git diff --quiet "$last_commit" "$parent" -- "${accepted_paths[@]}" || exit 1
              echo 'halted=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$SOURCE_COMMIT" "$parent"
            test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
              "$WORKFLOW_BLOB_OID"
            test "$(git rev-parse "$parent:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
            test "$(git rev-parse "$SOURCE_COMMIT:state/AUTOPILOT_RUNTIME_MANIFEST.json")" = \
              "$(git rev-parse "$parent:state/AUTOPILOT_RUNTIME_MANIFEST.json")"
            read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
            test "${#runtime_paths[@]}" -eq 18
            test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
            git diff --quiet "$SOURCE_COMMIT" "$parent" -- "${runtime_paths[@]}"
            echo 'UAART_SOURCE_PINNED_WRITER_RUNTIME_VALIDATED'
            rebuild="$RUNNER_TEMP/uaart-critical-recover-${attempt}"
            index="$RUNNER_TEMP/uaart-critical-recover-index-${attempt}"
            git worktree add --detach "$rebuild" "$parent"
            cd "$rebuild"
            python3 -I automation/control_plane.py verify-mode --require AUTOMATIC \
              --allow-halt-for-recovery
            reason="CRITICAL Production pipeline failed; GitHub Actions run ${GITHUB_RUN_ID}; rollback reserved ${ROLLBACK_MARKED:-false}; rollback performed ${ROLLBACK_PERFORMED:-false}"
            python3 -I automation/control_plane.py halt-system \
              --run-id "$RUN_ID" --reason "$reason"
            rollback_confirmed=false
            if test "$ROLLBACK_VALIDATED" = true; then
              receipt_source="$RUNNER_TEMP/uaart-critical-rollback/rollback.json"
              test -f "$receipt_source" && test ! -L "$receipt_source"
              test ! -e "$ROLLBACK_RECEIPT_PATH"
              install -D -m 600 "$receipt_source" "$ROLLBACK_RECEIPT_PATH"
              UAART_RUN_ID="$RUN_ID" \
              UAART_TRANSACTION_ID="$TRANSACTION_ID" \
              UAART_BACKUP_MANIFEST_SHA256="$BACKUP_MANIFEST_SHA256" \
                python3 -I automation/execution_contract.py rollback-receipt "$REQUEST_PATH" \
                  --expected-class CRITICAL >/dev/null
              python3 -I automation/control_plane.py transaction-close "$REQUEST_PATH" \
                --run-id "$RUN_ID" --transaction-id "$TRANSACTION_ID" \
                --outcome ROLLED_BACK >/dev/null
              rollback_confirmed=true
            fi
            failure_args=()
            test "$rollback_confirmed" = true && failure_args+=(--rollback-confirmed)
            if test "$CONTRACT_VALIDATED" = true && test -f "$REQUEST_PATH" && test -f "$CLAIM_PATH"; then
              python3 -I automation/control_plane.py fail "$REQUEST_PATH" \
                --run-id "$RUN_ID" \
                --message "CRITICAL Production failed; inspect GitHub Actions run ${GITHUB_RUN_ID}" \
                "${failure_args[@]}" || true
              python3 -I automation/control_plane.py halt "$REQUEST_PATH" \
                --run-id "$RUN_ID" --reason "$reason" || true
            fi
            rm -f "$index"
            GIT_INDEX_FILE="$index" git read-tree "$parent"
            paths=(state/AUTOPILOT_HALT.json)
            test "$CONTRACT_VALIDATED" = true && test -f "$CLAIM_PATH" && paths+=("$CLAIM_PATH")
            test "$CONTRACT_VALIDATED" = true && test -n "${TRANSACTION_PATH:-}" && test -f "$TRANSACTION_PATH" && paths+=("$TRANSACTION_PATH")
            test "$rollback_confirmed" = true && paths+=("$ROLLBACK_RECEIPT_PATH")
            for path in "${paths[@]}"; do
              test -f "$path" && test ! -L "$path"
              blob="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$index" git update-index --add \
                --cacheinfo "100644,${blob},${path}"
            done
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            if test "$tree" = "$(git rev-parse "${parent}^{tree}")"; then
              git show "${parent}:state/AUTOPILOT_HALT.json" >/dev/null
              cd "$GITHUB_WORKSPACE"
              echo 'halted=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            export GIT_AUTHOR_NAME=ua-art-critical-fail-closed
            export GIT_AUTHOR_EMAIL=actions@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit="$(printf '%s\n' "uaart critical: HALT ${TASK_ID:-unknown}" | \
              git commit-tree "$tree" -p "$parent")"
            COMMIT="$commit"
            COMMIT="$commit" PARENT="$parent" python3 -I - <<'PY'
          import os, re, subprocess
          raw = subprocess.check_output(['git', 'diff-tree', '--no-commit-id', '--name-only', '-r', '-z', os.environ['PARENT'], os.environ['COMMIT']])
          changed = set(filter(None, raw.decode().split('\0')))
          if 'state/AUTOPILOT_HALT.json' not in changed:
              raise SystemExit('HALT_COMMIT_REQUIRED')
          allowed = {
              'state/AUTOPILOT_HALT.json', os.environ.get('CLAIM_PATH', ''),
              os.environ.get('TRANSACTION_PATH', ''),
              os.environ.get('ROLLBACK_RECEIPT_PATH', ''),
          }
          if not changed.issubset(allowed) or any(not re.fullmatch(r'state/(?:AUTOPILOT_HALT\.json|(?:claims|transactions|receipts)/[^/]+\.json)', path) for path in changed):
              raise SystemExit('HALT_COMMIT_TREE_SCOPE')
          PY
            cd "$GITHUB_WORKSPACE"
            last_commit="$commit"
            if git_auth push origin "$COMMIT:refs/heads/main"; then
              echo 'halted=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

  result:
    needs: [main_only, validate, prepare, backup, open, controller_production, controller_nonproduction, finalize, rollback_mark, rollback_execute, recover]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      status: ${{ steps.outcome.outputs.status }}
      receipt_path: ${{ steps.outcome.outputs.receipt_path }}
    steps:
      - name: Publish exact reusable workflow outcome
        id: outcome
        shell: bash
        env:
          PRODUCTION_REQUIRED: ${{ inputs.production_required }}
          RECEIPT_PATH: ${{ needs.validate.outputs.receipt_path }}
          FINAL_RESULT: ${{ needs.finalize.result }}
          EXPECTED_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          echo "receipt_path=$RECEIPT_PATH" >>"$GITHUB_OUTPUT"
          test "$EXPECTED_REF" = 'refs/heads/main'
          test "$FINAL_RESULT" = success
          echo 'status=FINISHED' >>"$GITHUB_OUTPUT"

  rollback_mark:
    # The legacy `steps.backup_open.outputs.opened == 'true'` check is replaced
    # by a fresh-runner validation plus durable OPEN -> ROLLING_BACK reservation.
    needs: [validate, prepare, backup, open, controller_production, finalize]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 && inputs.production_required == 'true' &&
      needs.prepare.result == 'success' &&
      needs.finalize.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      marked: ${{ steps.reserve.outputs.marked }}
    env:
      REQUEST_PATH: ${{ inputs.request_path }}
      REQUEST_SHA256: ${{ inputs.request_sha256 }}
      CLAIM_PATH: ${{ inputs.claim_path }}
      RUN_ID: ${{ inputs.run_id }}
      TASK_ID: ${{ needs.validate.outputs.task_id }}
      TRANSACTION_ID: ${{ needs.prepare.outputs.transaction_id }}
      TRANSACTION_PATH: ${{ needs.prepare.outputs.transaction_path }}
      SOURCE_COMMIT: ${{ needs.validate.outputs.source_commit }}
      WORKFLOW_BLOB_OID: ${{ needs.validate.outputs.workflow_blob_oid }}
      WORKFLOW_PATH: .github/workflows/uaart_critical.yml
      WORKFLOW_SOURCE_COMMIT: ${{ needs.validate.outputs.workflow_source_commit }}
    steps:
      - name: Checkout clean authoritative transaction state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Reserve one-shot rollback with isolated Git trees
        id: reserve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          unset GH_TOKEN
          git_auth() {
            GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" git "$@"
          }
          last_commit=''
          for attempt in 1 2 3 4 5 6; do
            git_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'
            parent="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$last_commit" && git merge-base --is-ancestor "$last_commit" "$parent"; then
              mapfile -d '' accepted_paths < <(git diff-tree --no-commit-id \
                --name-only -r -z "$last_commit")
              test "${#accepted_paths[@]}" -gt 0
              git diff --quiet "$last_commit" "$parent" -- "${accepted_paths[@]}" || exit 1
              echo 'marked=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$SOURCE_COMMIT" "$parent"
            test "$(git rev-parse "$WORKFLOW_SOURCE_COMMIT:$WORKFLOW_PATH")" = \
              "$WORKFLOW_BLOB_OID"
            test "$(git rev-parse "$parent:$WORKFLOW_PATH")" = "$WORKFLOW_BLOB_OID"
            test "$(git rev-parse "$SOURCE_COMMIT:state/AUTOPILOT_RUNTIME_MANIFEST.json")" = \
              "$(git rev-parse "$parent:state/AUTOPILOT_RUNTIME_MANIFEST.json")"
            read -r -a runtime_paths <<<"$UAART_RUNTIME_PINNED_PATHS"
            test "${#runtime_paths[@]}" -eq 18
            test "$(printf '%s\n' "${runtime_paths[@]}" | sort -u | wc -l)" -eq 18
            git diff --quiet "$SOURCE_COMMIT" "$parent" -- "${runtime_paths[@]}"
            echo 'UAART_SOURCE_PINNED_WRITER_RUNTIME_VALIDATED'
            rebuild="$RUNNER_TEMP/uaart-critical-rollback-mark-${attempt}"
            index="$RUNNER_TEMP/uaart-critical-rollback-mark-index-${attempt}"
            git worktree add --detach "$rebuild" "$parent"
            cd "$rebuild"
            python3 -I automation/control_plane.py verify-mode --require AUTOMATIC \
              --allow-halt-for-recovery
            python3 -I automation/transaction_watchdog.py discover >"$RUNNER_TEMP/uaart-rollback-state.json"
            status="$(python3 -I -c 'import json,os; print(json.load(open(os.environ["RUNNER_TEMP"]+"/uaart-rollback-state.json"))["transaction_status"])')"
            if test "$status" != OPEN; then
              echo 'marked=false' >>"$GITHUB_OUTPUT"
              exit 0
            fi
            python3 -I - <<'PY'
          import json, os
          value = json.load(open(os.environ['RUNNER_TEMP'] + '/uaart-rollback-state.json', encoding='utf-8'))
          if not (
              value.get('pending_count') == 1
              and value.get('transaction_status') == 'OPEN'
              and value.get('transaction_id') == os.environ['TRANSACTION_ID']
              and value.get('transaction_path') == os.environ['TRANSACTION_PATH']
              and value.get('request_path') == os.environ['REQUEST_PATH']
              and value.get('request_sha256') == os.environ['REQUEST_SHA256']
              and str(value.get('run_id')) == os.environ['RUN_ID']
              and value.get('task_id') == os.environ['TASK_ID']
          ):
              raise SystemExit('ROLLBACK_OPEN_IDENTITY_MISMATCH')
          PY
            python3 -I automation/control_plane.py transaction-rollback-start "$REQUEST_PATH" \
              --run-id "$RUN_ID" --transaction-id "$TRANSACTION_ID"
            rm -f "$index"
            GIT_INDEX_FILE="$index" git read-tree "$parent"
            for path in "$CLAIM_PATH" "$TRANSACTION_PATH"; do
              blob="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$index" git update-index --add \
                --cacheinfo "100644,${blob},${path}"
            done
            tree="$(GIT_INDEX_FILE="$index" git write-tree)"
            export GIT_AUTHOR_NAME=ua-art-production-rollback-guard
            export GIT_AUTHOR_EMAIL=actions@users.noreply.github.com
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            commit="$(printf '%s\n' "uaart production: reserve rollback $TASK_ID" | \
              git commit-tree "$tree" -p "$parent")"
            COMMIT="$commit"
            mapfile -d '' changed < <(git diff-tree --no-commit-id --name-only -r -z "$parent" "$commit")
            test "${#changed[@]}" -eq 2
            printf '%s\n' "${changed[@]}" | sort >"$RUNNER_TEMP/changed"
            printf '%s\n' "$CLAIM_PATH" "$TRANSACTION_PATH" | sort >"$RUNNER_TEMP/expected"
            cmp "$RUNNER_TEMP/changed" "$RUNNER_TEMP/expected"
            cd "$GITHUB_WORKSPACE"
            last_commit="$commit"
            if git_auth push origin "$COMMIT:refs/heads/main"; then
              echo 'marked=true' >>"$GITHUB_OUTPUT"
              unset auth GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done
