name: ferry-wording-isolated-gate-a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ferry_wording_gate_a.yml'
      - 'cloud/task_047_ferry_discovery/transform.py'
      - 'cloud/task_047_ferry_discovery/discover.py'
      - 'cloud/task_047_ferry_discovery/gate_a_remote.py'
      - 'cloud/task_047_ferry_discovery/gate_a_controller.py'
      - 'cloud/task_047_ferry_discovery/run_tests.py'
      - 'cloud/task_047_ferry_discovery/tests/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ferry-wording-isolated-gate-a
  cancel-in-progress: false

jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout exact main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Run complete offline ferry suite twice
        run: python3 cloud/task_047_ferry_discovery/run_tests.py

      - name: Run read-only inputs and isolated candidates on PythonAnywhere
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: Carix
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
        run: python3 cloud/task_047_ferry_discovery/gate_a_controller.py

      - name: Validate bounded Gate A evidence
        run: |
          test -f cloud/task_047_ferry_discovery/evidence/ferry_gate_a.json
          test -f cloud/task_047_ferry_discovery/FERRY_GATE_A_REPORT.md
          git add -- \
            cloud/task_047_ferry_discovery/evidence/ferry_gate_a.json \
            cloud/task_047_ferry_discovery/FERRY_GATE_A_REPORT.md
          mapfile -t staged < <(git diff --cached --name-only)
          if [ "${#staged[@]}" -ne 2 ]; then
            echo 'Expected exactly two Gate A evidence files'
            exit 1
          fi
          for path in "${staged[@]}"; do
            case "${path}" in
              cloud/task_047_ferry_discovery/evidence/ferry_gate_a.json|\
              cloud/task_047_ferry_discovery/FERRY_GATE_A_REPORT.md) ;;
              *) echo "Unexpected staged path: ${path}"; exit 1 ;;
            esac
          done

      - name: Commit Gate A evidence with bounded retries
        run: |
          git config user.name 'ferry-gate-a'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'ferry: relay isolated Gate A evidence'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done

      - name: Render isolated visual previews
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('cloud/task_047_ferry_discovery/evidence/ferry_gate_a.json').read_text())['status'])
          PY
          )"
          if [ "${status}" != 'PASS_READY_FOR_GATE_B' ] && [ "${status}" != 'PASS' ]; then
            echo "No renderable preview for status ${status}"
            exit 0
          fi
          preview='cloud/task_047_ferry_discovery/_gate_a_preview/video'
          screenshots='cloud/task_047_ferry_discovery/_gate_a_screenshots'
          test "$(find "${preview}" -maxdepth 1 -type f -name '*.html' | wc -l)" -eq 13
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "${browser}"
          mkdir -p "${screenshots}"
          for page in "${preview}"/*.html; do
            name="$(basename "${page}" .html)"
            "${browser}" --headless=new --disable-gpu --disable-javascript \
              --disable-background-networking --hide-scrollbars \
              --window-size=1440,2400 --virtual-time-budget=1500 \
              --screenshot="${screenshots}/${name}.png" \
              "file://$(realpath "${page}")"
          done
          test "$(find "${screenshots}" -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 13
          python3 - <<'PY'
          from pathlib import Path
          for path in Path('cloud/task_047_ferry_discovery/_gate_a_screenshots').glob('*.png'):
              data = path.read_bytes()
              if len(data) < 1000 or not data.startswith(b'\x89PNG\r\n\x1a\n'):
                  raise SystemExit('invalid screenshot: ' + str(path))
          PY

      - name: Upload isolated visual preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ferry-gate-a-preview-${{ github.run_id }}
          path: |
            cloud/task_047_ferry_discovery/_gate_a_screenshots
            cloud/task_047_ferry_discovery/_gate_a_preview/video
            cloud/task_047_ferry_discovery/_gate_a_preview/python
            cloud/task_047_ferry_discovery/evidence/ferry_gate_a.json
            cloud/task_047_ferry_discovery/FERRY_GATE_A_REPORT.md
          if-no-files-found: error
          retention-days: 7

      - name: Require a non-blocked Gate A result
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path('cloud/task_047_ferry_discovery/evidence/ferry_gate_a.json').read_text())
          if receipt.get('status') not in {'PASS', 'PASS_READY_FOR_GATE_B'}:
              raise SystemExit('FERRY_GATE_A_BLOCKED:' + str(receipt.get('errors')))
          print('FERRY_GATE_A_ACCEPTED:' + receipt['status'])
          PY
