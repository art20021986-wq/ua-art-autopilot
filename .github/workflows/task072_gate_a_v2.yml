name: task072-gate-a-v2-real-context

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "cloud/task_072/crm_description_writer_v2.py"
      - "cloud/task_072/patch_cars_ui_v2.py"
      - "cloud/task_072/gate_a_v2.py"
      - "cloud/task_072/installer_v2.py"
      - "cloud/task_072/postcheck_v2.py"
      - "cloud/task_072/gate_b_controller_v2.py"
      - "cloud/task_072/GATE_B_PLAN.md"
      - ".github/workflows/task072_gate_b.yml"
      - ".github/workflows/task072_gate_a_v2.yml"

permissions:
  contents: write

concurrency:
  group: task072-gate-a-v2
  cancel-in-progress: false

jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile bounded candidate
        run: >-
          python -m py_compile
          cloud/task_072/crm_description_writer_v2.py
          cloud/task_072/patch_cars_ui_v2.py
          cloud/task_072/gate_a_v2.py
          cloud/task_072/installer_v2.py
          cloud/task_072/postcheck_v2.py
          cloud/task_072/gate_b_controller_v2.py

      - name: Run GET-only Gate A
        id: gate
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python cloud/task_072/gate_a_v2.py

      - name: Commit sanitized evidence
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud/task_072/evidence/gate_a_v2.json cloud/task_072/GATE_A_V2_REPORT.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "task072: record Gate A V2 evidence"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Preserve Gate A failure
        if: steps.gate.outcome != 'success'
        run: exit 1
