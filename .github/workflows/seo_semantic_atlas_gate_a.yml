name: SEO Multilingual Semantic Atlas Gate A
on:
  push:
    branches: [main]
    paths:
      - 'cloud/seo_semantic_atlas_20260928/**'
      - '.github/workflows/seo_semantic_atlas_gate_a.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Generate RU UA KA demand atlas
        run: |
          python3 cloud/seo_semantic_atlas_20260928/generate.py
          python3 - <<'PY'
          import csv
          p='cloud/seo_semantic_atlas_20260928/semantic_atlas.csv'
          with open(p,encoding='utf-8') as f:
              rows=list(csv.DictReader(f))
          langs={}
          for r in rows: langs[r['language']]=langs.get(r['language'],0)+1
          print('SEMANTIC_GATE_A_PASS total=%d languages=%r' % (len(rows),langs))
          assert len(rows) >= 100000
          assert all(langs.get(x,0)>10000 for x in ('ru','uk','ka'))
          PY
