name: TASK105 Phase 0 Read-Only Audit

on:
  push:
    branches:
      - task105-fast-pipeline-phase0
    paths:
      - 'tasks/task_105.md'
      - 'cloud/task_105_fast_pipeline_phase0/phase0_audit.py'
      - '.github/workflows/task105_phase0_audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task105-phase0-audit
  cancel-in-progress: false

jobs:
  phase0:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: task105-fast-pipeline-phase0

      - name: Safety boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "PRODUCTION_WRITE=NO"
          echo "CRM_WRITE=NO"
          echo "PYTHONANYWHERE_PRODUCTION_WRITE=NO"
          echo "CLOUDFLARE_PRODUCTION_WRITE=NO"
          echo "DNS_WRITE=NO"

      - name: Compile and self-test deterministic auditor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile cloud/task_105_fast_pipeline_phase0/phase0_audit.py
          python3 cloud/task_105_fast_pipeline_phase0/phase0_audit.py --self-test

      - name: Generate Phase 0 evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud/task_105_fast_pipeline_phase0/phase0_audit.py

      - name: Validate output scope and required deliverables
        shell: bash
        run: |
          set -euo pipefail
          required=(
            WORKFLOW_INVENTORY.md
            DEPENDENCY_MAP.md
            ROOT_CAUSE_AUDIT_TASK096.md
            CURRENT_STATE_MACHINE.md
            TARGET_ARCHITECTURE.md
            MIGRATION_PLAN.md
            RISK_REGISTER.md
            ACCEPTANCE_TEST_PLAN.md
            PHASE0_REPORT.md
            phase0_manifest.json
          )
          for name in "${required[@]}"; do
            test -s "cloud/task_105_fast_pipeline_phase0/${name}"
          done
          test -s cloud/latest_status.md
          test -s cloud/owner_reply.md

          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              cloud/task_105_fast_pipeline_phase0/*|cloud/latest_status.md|cloud/owner_reply.md) ;;
              *)
                echo "UNEXPECTED_WRITE_SCOPE: $path"
                exit 1
                ;;
            esac
          done

          if grep -RIE 'PRODUCTION_TOUCHED: YES|PRODUCTION_WRITE[=: ]+YES|CRM_WRITE[=: ]+YES' \
              cloud/task_105_fast_pipeline_phase0 cloud/latest_status.md cloud/owner_reply.md; then
            echo "SAFETY_MARKER_VIOLATION"
            exit 1
          fi

      - name: Commit Phase 0 audit outputs to task branch
        shell: bash
        run: |
          set -euo pipefail
          git add cloud/task_105_fast_pipeline_phase0 \
                  cloud/latest_status.md \
                  cloud/owner_reply.md
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "ua-art-task105-auditor"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "task105: complete Phase 0 read-only architecture audit"
          git push origin HEAD:task105-fast-pipeline-phase0
