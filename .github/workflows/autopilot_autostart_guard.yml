name: Autopilot Autostart Guard — Manual Mode

# Automatic fallback dispatch is disabled by owner decision.
# This workflow remains available only for a deliberate manual verification.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: autopilot-autostart-guard
  cancel-in-progress: true

jobs:
  verify-manual-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm automatic dispatch is disabled
        shell: bash
        run: |
          set -euo pipefail
          echo 'EXECUTION_MODE=MANUAL'
          echo 'AUTOSTART_FALLBACK=DISABLED'
          echo 'NO_WORKFLOW_WILL_BE_DISPATCHED_BY_THIS_GUARD'
