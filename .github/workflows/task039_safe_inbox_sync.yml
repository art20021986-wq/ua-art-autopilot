name: Task 039 Safe Inbox Sync
# Retry 3: proven auto_number identity and exact handler anchors.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task039_safe_inbox_sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task039-safe-inbox-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile and run all offline logistics tests
        run: |
          python3 -m py_compile automation/pythonanywhere_sync_v2.py cloud/bot_logistics/*.py
          python3 -m unittest discover -v -s cloud/bot_logistics -p 'test*.py'

      - name: Upload only reviewed safe-inbox artifacts
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: Carix
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
          PYTHONANYWHERE_REMOTE_ROOT: /home/Carix/autopilot_inbox
          PYTHONANYWHERE_SYNC_MODE: claude_latest
        run: >-
          python3 -c "import pathlib;
          import automation.pythonanywhere_sync_v2 as sync;
          sync.STATUS = pathlib.Path('cloud/bot_logistics/task039_sync_status.md');
          sync.main()"
