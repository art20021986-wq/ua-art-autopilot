name: task060-runtime-capabilities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task060_runtime_capabilities.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task060-runtime-capabilities
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile capability probe
        run: python3 -m py_compile cloud/task_060/probe_runtime.py
      - name: Probe PythonAnywhere safe runtime
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_060/probe_runtime.py
      - name: Commit capability evidence
        run: |
          python3 -m json.tool cloud/task_060/evidence/runtime_capabilities.json >/dev/null
          git add -- cloud/task_060/evidence/runtime_capabilities.json
          git config user.name 'task060-runtime-probe'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_060: record OCR runtime capabilities'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            if [ "$attempt" -lt 5 ]; then sleep $((attempt * 2)); fi
          done
          exit 1
