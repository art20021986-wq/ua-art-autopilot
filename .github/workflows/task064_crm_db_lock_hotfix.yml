name: task064-crm-db-lock-hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task064_crm_db_lock_hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task064-crm-db-lock
  cancel-in-progress: false

jobs:
  hotfix:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Verify hotfix locally
        shell: bash
        run: |
          python3 -m py_compile \
            cloud/task_064/sqlite_hotfix_installer.py \
            cloud/task_064/sqlite_hotfix_postcheck.py \
            cloud/task_064/hotfix_controller.py \
            cloud/task_064/test_sqlite_hotfix.py
          cd cloud/task_064
          python3 -m unittest -v test_sqlite_hotfix.py

      - name: Install, restart, and verify production CRM
        id: deploy
        continue-on-error: true
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_064/hotfix_controller.py

      - name: Commit bounded evidence
        shell: bash
        run: |
          test -f cloud/task_064/evidence/hotfix.json
          python3 -m json.tool cloud/task_064/evidence/hotfix.json >/dev/null
          git add -- \
            cloud/task_064/evidence/hotfix.json \
            cloud/task_064/HOTFIX_REPORT.md
          git config user.name 'task064-crm-db-lock'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_064: record CRM database lock hotfix'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done

      - name: Enforce production result
        if: steps.deploy.outcome != 'success'
        run: exit 1

      - name: Verify final evidence
        run: |
          python3 - <<'PY'
          import json
          p = 'cloud/task_064/evidence/hotfix.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['status'] == 'PASS'
          assert d['llm_tokens'] == 0
          assert d['legacy_schedules_active'] == []
          assert d['bot_restarted'] is True
          assert d['install']['crm_db_write'] is False
          assert d['postcheck']['operations'] == 40
          assert d['postcheck']['readonly_after']['quick_check'] == 'ok'
          assert d['postcheck']['errors'] == []
          print('TASK064_CRM_DB_LOCK_HOTFIX_PASS')
          PY
