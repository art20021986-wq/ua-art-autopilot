name: task084-crm-hang-remediation-gate-a

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task084_crm_hang_remediation_gate_a.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task084-crm-hang-remediation-gate-a
  cancel-in-progress: true

jobs:
  gate-a:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile remediation
        run: |
          python3 -W error -m py_compile \
            cloud/task_084_crm_hang_root_cause/live_audit.py \
            cloud/task_084_crm_hang_root_cause/deploy_controller.py \
            cloud/task_084_crm_hang_root_cause/remote_installer.py \
            cloud/task_084_crm_hang_root_cause/remote_orchestrator.py \
            cloud/task_084_crm_hang_root_cause/single_task_controller.py \
            cloud/task_078_voice_watchdog/voice_watchdog.py \
            cloud/task_078_voice_watchdog/handler_patcher.py

      - name: Test killable worker and exact patcher
        run: |
          python3 cloud/task_078_voice_watchdog/tests/test_voice_watchdog.py -v
          python3 cloud/task_078_voice_watchdog/tests/test_handler_patcher.py -v

      - name: Refresh GET-only root-cause evidence
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_084_crm_hang_root_cause/live_audit.py

      - name: Test candidate or exact installed remediation
        run: |
          python3 - <<'PY'
          import json, subprocess
          path='cloud/task_084_crm_hang_root_cause/evidence/live_audit.json'
          value=json.load(open(path, encoding='utf-8'))
          if value['status']=='PASS_ROOT_CAUSE_CONFIRMED':
              subprocess.check_call([
                  'python3',
                  'cloud/task_084_crm_hang_root_cause/deploy_controller.py',
                  '--self-test',
              ])
          elif value['status']=='PASS_REMEDIATION_CONFIRMED':
              remediation=value['remediation']
              assert all(
                  v for k,v in remediation.items()
                  if isinstance(v,bool) and not k.startswith('exact_')
              ), remediation
              exact=remediation['exact_target_sha256']
              assert exact['crm_voice_watchdog.py'] is True, exact
              assert exact['start_safe.py'] is True, exact
              deployed=json.load(open(
                  'cloud/task_084_crm_hang_root_cause/evidence/deploy.json',
                  encoding='utf-8'))
              assert deployed['status']=='PASS', deployed['errors']
              assert deployed['rollback'] is None
          else:
              raise AssertionError(value)
          print('TASK084_CANDIDATE_OR_LIVE_PASS')
          PY

      - name: Prove single-task fail-closed transport
        run: |
          python3 - <<'PY'
          from pathlib import Path
          controller=Path('cloud/task_084_crm_hang_root_cause/single_task_controller.py').read_text()
          remote=Path('cloud/task_084_crm_hang_root_cause/remote_orchestrator.py').read_text()
          assert 'wait_for_file(FINAL, 1200)' in controller
          assert 'task084_remote_orchestrator.py' in controller
          assert 'run_rollback()' in remote
          assert remote.count('run_postcheck()') == 2
          assert 'bot_restarted' in remote
          print('TASK084_SINGLE_TASK_STATIC_PASS')
          PY

      - name: Prove Gate A did not touch production
        run: |
          python3 - <<'PY'
          import json
          p='cloud/task_084_crm_hang_root_cause/evidence/live_audit.json'
          value=json.load(open(p, encoding='utf-8'))
          assert value['status'] in (
              'PASS_ROOT_CAUSE_CONFIRMED', 'PASS_REMEDIATION_CONFIRMED'
          ), value
          assert value['production_touched'] is False
          assert value['process_restart'] is False
          assert value['http_methods']==['GET']
          print('TASK084_GATE_A_PASS')
          PY
