name: UA ART CRM Runtime Read-Only Probe
on:
  push:
    branches: [main]
    paths: ['.github/workflows/uaart_crm_runtime_readonly_probe.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: main, persist-credentials: false}
      - name: Narrow GET-only lock path probe
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import ast,json,os,re,time,urllib.request,urllib.parse,pathlib
          B='https://www.pythonanywhere.com/api/v0/user/Carix/';T=os.environ['PYTHONANYWHERE_API_TOKEN']
          def rf(p):
            q=urllib.request.Request(B+'files/path'+urllib.parse.quote(p,safe='/'),method='GET',headers={'Authorization':'Token '+T,'User-Agent':'UAART-narrow-readonly'})
            t=time.perf_counter()
            with urllib.request.urlopen(q,timeout=60) as r:b=r.read(5000001)
            return b.decode('utf8','replace'),round((time.perf_counter()-t)*1000,2)
          paths=['/home/Carix/db.py','/home/Carix/start_safe.py','/home/Carix/run_all.py']
          src={}; read_ms={}
          for p in paths:
            try: src[p],read_ms[p]=rf(p)
            except Exception as e: src[p]='';read_ms[p]=str(e)
          out={'mode':'NARROW_READ_ONLY','production_write':False,'reload':False,'restart':False,'read_ms':read_ms,'constants':{},'sleep_sites':[],'routes':[]}
          db=src['/home/Carix/db.py']
          # Exact numeric/string constants related to locks/retries/timeouts.
          tree=ast.parse(db)
          for n in tree.body:
            if isinstance(n,(ast.Assign,ast.AnnAssign)):
              targets=n.targets if isinstance(n,ast.Assign) else [n.target]
              names=[x.id for x in targets if isinstance(x,ast.Name)]
              val=n.value
              if names and any(re.search(r'(?i)(lock|zamok|retry|povtor|timeout|ozhid|sleep)',x) for x in names):
                try: out['constants'][','.join(names)]=ast.literal_eval(val)
                except Exception: out['constants'][','.join(names)]=ast.get_source_segment(db,val)
          for p,text in src.items():
            lines=text.splitlines()
            for i,l in enumerate(lines):
              if re.search(r'(?i)(time\.)?sleep\s*\(',l): out['sleep_sites'].append({'file':p,'line':i+1,'code':l.strip()[:220]})
          # Read-only static route linkage: functions and Telegram registrations around user actions.
          keys=['start','Автомоб','catalog','каталог','unpublished','опублик','card','карточ','price','цена','vin','status','статус']
          for p,text in src.items():
            lines=text.splitlines()
            for i,l in enumerate(lines):
              if any(k.casefold() in l.casefold() for k in keys):
                a=max(0,i-4);z=min(len(lines),i+12); block='\n'.join(lines[a:z])
                signals=[]
                if re.search(r'(?i)db\.|connect\(|execute\(',block):signals.append('db')
                if re.search(r'(?i)(time\.)?sleep\s*\(',block):signals.append('sleep')
                if re.search(r'(?i)requests\.|urlopen|urllib\.request',block):signals.append('http')
                if signals: out['routes'].append({'file':p,'line':i+1,'match':l.strip()[:180],'signals':signals})
          pathlib.Path('/tmp/narrow.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps({'status':'PASS','mode':out['mode'],'production_write':False,'reload':False,'restart':False,'constants':out['constants'],'sleep_sites':out['sleep_sites'],'routes':out['routes'][:80]},ensure_ascii=False))
          PY
      - name: Enforce no mutation
        run: python3 -c "import json;d=json.load(open('/tmp/narrow.json'));assert d['production_write'] is False and d['reload'] is False and d['restart'] is False;print('NARROW_READ_ONLY_PASS')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: crm-narrow-readonly-${{ github.run_id }}
          path: /tmp/narrow.json
          retention-days: 7
