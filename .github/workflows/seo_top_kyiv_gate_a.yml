name: UA ART SEO TOP KYIV Gate A
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'automation/seo_top_kyiv_gate_a.py'
      - '.github/workflows/seo_top_kyiv_gate_a.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Run read-only SEO Gate A
        env:
          GSC_CLIENT_ID: ${{ secrets.GSC_CLIENT_ID }}
          GSC_CLIENT_SECRET: ${{ secrets.GSC_CLIENT_SECRET }}
          GSC_REFRESH_TOKEN: ${{ secrets.GSC_REFRESH_TOKEN }}
        run: python3 automation/seo_top_kyiv_gate_a.py
