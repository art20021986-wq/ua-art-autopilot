name: task064-emergency-crm-quiesce

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task064_emergency_crm_quiesce.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task064-crm-db-lock
  cancel-in-progress: false

jobs:
  quiesce:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Disable legacy writers and restart CRM
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 -m py_compile cloud/task_064/emergency_quiesce.py
          python3 cloud/task_064/emergency_quiesce.py
      - name: Enforce emergency result
        run: |
          python3 - <<'PY'
          import json
          p = 'cloud/task_064/evidence/quiesce.json'
          d = json.load(open(p, encoding='utf-8'))
          assert d['status'] == 'PASS'
          assert len(d['legacy_schedules_removed']) == 3
          assert d['remaining_conflicts'] == []
          assert d['bot_restart_requested'] is True
          assert d['crm_db_write'] is False
          assert d['llm_tokens'] == 0
          print('TASK064_EMERGENCY_QUIESCE_PASS')
          PY
      - name: Commit evidence
        run: |
          git add -- cloud/task_064/evidence/quiesce.json
          git config user.name 'task064-crm-quiesce'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_064: record emergency CRM quiesce'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
