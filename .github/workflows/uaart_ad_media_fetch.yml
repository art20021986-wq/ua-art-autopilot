name: UA ART Ad Media Fetch (read-only)

on:
  workflow_dispatch:
    inputs:
      code:
        description: Catalog car code, e.g. UA-0018
        required: true
        default: UA-0018

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download public photos and video (read-only, no secrets)
        env:
          CODE: ${{ inputs.code }}
        run: |
          [[ "$CODE" =~ ^UA-[0-9]{4}$ ]]
          python3 -I cloud/ad_media_ua0018/fetch.py "$CODE" media
      - name: Publish media to a separate orphan branch (never main)
        env:
          CODE: ${{ inputs.code }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          find media -type f -size +95M -delete
          cd media
          git init -q -b "ad-media/$CODE"
          git -c user.name=ua-art-autopilot -c user.email=actions@users.noreply.github.com add -A
          git -c user.name=ua-art-autopilot -c user.email=actions@users.noreply.github.com commit -q -m "Ad media $CODE (public site copy)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/ad-media/$CODE"
