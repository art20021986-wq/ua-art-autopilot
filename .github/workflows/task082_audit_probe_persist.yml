name: TASK082 persist read-only status audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/task082_audit_probe_persist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Read UA-0011 audit without production writes
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import datetime as dt, hashlib, json, os, pathlib, sqlite3, tempfile
          import urllib.parse, urllib.request
          base = "https://www.pythonanywhere.com/api/v0/user/Carix/files/path"
          req = urllib.request.Request(
              base + urllib.parse.quote("/home/Carix/crm.db", safe="/"),
              headers={"Authorization": "Token " + os.environ["PYTHONANYWHERE_API_TOKEN"],
                       "User-Agent": "task082-persist-audit/1"})
          with urllib.request.urlopen(req, timeout=70) as response:
              raw = response.read(80_000_001)
          with tempfile.TemporaryDirectory() as directory:
              path = pathlib.Path(directory) / "crm.db"
              path.write_bytes(raw)
              con = sqlite3.connect("file:%s?mode=ro" % path, uri=True)
              con.row_factory = sqlite3.Row
              con.execute("PRAGMA query_only=ON")
              car = dict(con.execute(
                  "SELECT * FROM cars WHERE auto_number='UA-0011'").fetchone())
              audit = [dict(row) for row in con.execute(
                  "SELECT * FROM audit WHERE entity_id=? AND entity_type IN ('car','cars') "
                  "ORDER BY id DESC LIMIT 100", (car["id"],)).fetchall()]
              triggers = [dict(row) for row in con.execute(
                  "SELECT name,tbl_name,sql FROM sqlite_master WHERE type='trigger' "
                  "AND tbl_name='cars' ORDER BY name").fetchall()]
              actors = []
              ids = sorted({row.get("actor_id") for row in audit if row.get("actor_id") is not None})
              if ids:
                  marks = ",".join("?" for _ in ids)
                  actors = [dict(row) for row in con.execute(
                      "SELECT user_id,full_name,username,role,active FROM staff WHERE user_id IN (" + marks + ")",
                      ids).fetchall()]
              quick = con.execute("PRAGMA quick_check").fetchone()[0]
              con.close()
          keep = {key: value for key, value in car.items() if key in {
              "id","auto_number","brand","model","year","vin","status","stage","published",
              "review_status","sea_container","sea_date_out","eta_manual","days_to_kyiv","updated_at"}}
          out = {
              "task_id":"task_082", "mode":"GET_ONLY", "production_touched":False,
              "generated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
              "database_sha256":hashlib.sha256(raw).hexdigest(), "quick_check":quick,
              "ua0011":keep, "audit":audit, "actors":actors, "triggers":triggers,
          }
          dest = pathlib.Path("cloud/task_082_catalog_stage_repair/evidence/audit_probe.json")
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(out, ensure_ascii=False, indent=2, sort_keys=True)+"\n", encoding="utf-8")
          print(json.dumps({"ua0011":keep,"audit":audit[:15],"actors":actors}, ensure_ascii=False))
          PY
      - name: Persist evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add cloud/task_082_catalog_stage_repair/evidence/audit_probe.json
          git commit -m "task082: record UA-0011 status audit"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git pull --rebase origin main
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task082-audit-persist-${{ github.run_id }}
          path: cloud/task_082_catalog_stage_repair/evidence/audit_probe.json
          if-no-files-found: error
