name: Overnight TASK099 Transient Recovery

on:
  workflow_run:
    workflows: ['TASK099 Site and CRM Production Completion']
    types: [completed]

permissions:
  actions: write
  contents: read

concurrency:
  group: overnight-task099-transient-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main evidence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify overnight authorization and classify failure
        id: classify
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^OVERNIGHT_PRODUCTION_AUTHORIZED: YES$' tasks/overnight_autopilot_production_approval_20260901.md
          python - <<'PY'
          import json,pathlib,os
          p=pathlib.Path('evidence/deploy.json')
          value=json.loads(p.read_text()) if p.exists() else {}
          text=json.dumps(value,ensure_ascii=False)
          transient=any(x in text for x in ('PYTHONANYWHERE_HTTP_429','PYTHONANYWHERE_HTTP_500','PYTHONANYWHERE_HTTP_502','PYTHONANYWHERE_HTTP_503','PYTHONANYWHERE_HTTP_504','PYTHONANYWHERE_NETWORK','REMOTE_RECEIPT_TIMEOUT','database is locked','Timeout','timeout'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write('transient='+('true' if transient else 'false')+'\n')
          print('TRANSIENT_FAILURE', transient)
          PY
      - name: Re-run failed production job only for transient failure and bounded attempts
        if: steps.classify.outputs.transient == 'true' && github.event.workflow_run.run_attempt < 3
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          python - <<'PY'
          import os,urllib.request
          url='https://api.github.com/repos/'+os.environ['GH_REPOSITORY']+'/actions/runs/'+os.environ['RUN_ID']+'/rerun-failed-jobs'
          req=urllib.request.Request(url,data=b'',method='POST',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
          with urllib.request.urlopen(req,timeout=30) as r:
              assert r.status==201, r.status
          print('TASK099_TRANSIENT_RERUN_STARTED')
          PY
      - name: Stop safely on deterministic or exhausted failure
        if: steps.classify.outputs.transient != 'true' || github.event.workflow_run.run_attempt >= 3
        run: |
          echo 'OWNER_ONLY_OR_CODE_REPAIR_REQUIRED: production is not retried blindly; existing workflow rollback policy remains authoritative.'
