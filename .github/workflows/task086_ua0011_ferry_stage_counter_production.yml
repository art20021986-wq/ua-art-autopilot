name: task086-superseded-by-task088-fail-closed

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task086_ua0011_ferry_stage_counter_production.yml'
      - 'tasks/task_086.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  superseded:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Refuse superseded ferry target before external access
        run: |
          echo 'TASK 086 ferry target is superseded by the direct current TASK 088 Korea command.'
          echo 'No PythonAnywhere request was made.'
          exit 1
