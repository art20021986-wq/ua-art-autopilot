name: UA ART Control-Plane Maintenance

on:
  schedule:
    - cron: '31 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uaart-control-plane-maintenance
  cancel-in-progress: true

jobs:
  maintenance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout control plane
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          clean: true
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Compile permanent control-plane modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -W error -m py_compile \
            automation/autostart_intake.py \
            automation/control_plane.py \
            automation/task_orchestrator.py \
            automation/execution_contract.py \
            automation/critical_adapter.py \
            automation/production_queue.py \
            automation/transaction_watchdog.py
          python3 -I automation/task_orchestrator.py self-test
          python3 -I automation/critical_adapter.py self-test
          python3 -I automation/production_queue.py self-test
          python3 -I -m unittest discover -s automation/packages/task107_r2 -p 'test_*.py' -v

      - name: Audit permanent workflow set and repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          python3 -I automation/control_plane.py verify-mode --require AUTOMATIC \
            | tee /tmp/uaart-maintenance.json
          test -z "$(git ls-files | grep -E '(^|/)__pycache__/|\.pyc$' || true)"

      - name: Upload maintenance proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: uaart-maintenance-${{ github.run_id }}
          path: /tmp/uaart-maintenance.json
          retention-days: 14
