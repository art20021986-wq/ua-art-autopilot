name: TASK105 CRITICAL Adapter Acceptance V2

on:
  push:
    branches:
      - task105-fast-pipeline-phase0
    paths:
      - 'cloud/task_105_fast_pipeline_phase5/critical_acceptance_v2.py'
      - '.github/workflows/task105_critical_adapter_v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task105-critical-adapter-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  critical-adapter-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact continuation branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: task105-fast-pipeline-phase0
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Require STANDARD predecessor and root-cause correction
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/task_orchestrator.py validate-receipt \
            state/receipts/TASK105-STANDARD-PRODUCTION-CANARY.json >/tmp/standard.json
          python3 - <<'PY'
          import json
          value = json.load(open('/tmp/standard.json', encoding='utf-8'))
          assert value['task_class'] == 'STANDARD', value
          assert value['production'] == 'PASS', value
          assert value['rollback'] == 'PASS', value
          assert value['final_state_restored'] is True, value
          assert value['crm_unchanged'] is True, value
          PY
          grep -q 'EMPTY_LOCK_TUPLE_COMPARED_TO_EMPTY_LIST' \
            cloud/task_105_fast_pipeline_phase5/critical_acceptance_v2.py

      - name: Compile and run CRITICAL unit tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -m py_compile \
            automation/critical_adapter.py \
            cloud/task_105_fast_pipeline_phase5/test_critical_adapter.py \
            cloud/task_105_fast_pipeline_phase5/critical_acceptance_v2.py
          python3 automation/critical_adapter.py self-test
          python3 cloud/task_105_fast_pipeline_phase5/test_critical_adapter.py \
            2>&1 | tee /tmp/task105-critical-tests.log
          grep -q '^Ran 21 tests' /tmp/task105-critical-tests.log
          grep -q '^OK$' /tmp/task105-critical-tests.log

      - name: Run corrected Gate A Gate B and 10-case acceptance
        shell: bash
        run: |
          set -euo pipefail
          python3 cloud/task_105_fast_pipeline_phase5/critical_acceptance_v2.py \
            | tee /tmp/task105-critical-v2.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          value = json.loads(Path(
              'cloud/task_105_fast_pipeline_phase5/critical_acceptance_results.json'
          ).read_text(encoding='utf-8'))
          assert value['status'] == 'PASS', value
          assert value['attempt'] == 2, value
          assert value['blind_retry'] is False, value
          assert value['root_cause'] == 'EMPTY_LOCK_TUPLE_COMPARED_TO_EMPTY_LIST', value
          assert value['critical_classification_total'] == 10, value
          assert value['critical_classification_passed'] == 10, value
          assert value['critical_classification_failed'] == 0, value
          assert value['gate_b_validation']['status'] == 'GATE_B_AUTHORIZED', value
          assert value['production_write'] is False, value
          assert value['crm_write'] is False, value
          PY
          python3 automation/task_orchestrator.py validate-receipt \
            cloud/task_105_fast_pipeline_phase5/phase5_receipt.json >/dev/null

      - name: Materialize Phase 5 status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime as dt
          from pathlib import Path
          now = dt.datetime.now(dt.timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          Path('cloud/latest_status.md').write_text('\n'.join([
              'TASK_ID: task_105',
              'ROUND: 6',
              'CLAUDE_STATUS: DONE',
              'CURRENT_ACTION: CRITICAL adapter 21/21 tests and 10/10 cases PASS after deterministic root-cause correction',
              'FILES_CREATED: automation/critical_adapter.py,cloud/task_105_fast_pipeline_phase5/CRITICAL_ADAPTER_REPORT.md,cloud/task_105_fast_pipeline_phase5/phase5_receipt.json',
              'PRODUCTION_TOUCHED: NO',
              'OWNER_ACTION_REQUIRED: NO',
              'OWNER_QUESTION: NONE',
              'NEXT_FOR_CHATGPT: Phase 6 permanent-route acceptance starts from phase5 receipt',
              'UPDATED_AT_UTC: ' + now,
              '',
          ]), encoding='utf-8')
          Path('cloud/owner_reply.md').write_text('\n'.join([
              '# Ответ владельцу — TASK105',
              '',
              'СТАТУС: PASS CRITICAL ADAPTER',
              'ПРОВЕРКА: 21/21 тестов и 10/10 CRITICAL-сценариев PASS',
              'GATE A / GATE B / MANIFEST SHA: PASS',
              'PRODUCTION: НЕ ЗАТРОНУТ',
              'CRM И ДАННЫЕ АВТОМОБИЛЕЙ: НЕ ИЗМЕНЕНЫ',
              'СЛЕДУЮЩИЙ ЭТАП: проверка постоянных маршрутов и переключение main',
              '',
          ]), encoding='utf-8')
          PY

      - name: Enforce bounded Phase 5 scope
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only)
          for path in "${changed[@]}"; do
            case "$path" in
              cloud/task_105_fast_pipeline_phase5/critical_acceptance_results.json|\
              cloud/task_105_fast_pipeline_phase5/critical_manifest.json|\
              cloud/task_105_fast_pipeline_phase5/critical_request.json|\
              cloud/task_105_fast_pipeline_phase5/gate_a_receipt.json|\
              cloud/task_105_fast_pipeline_phase5/gate_b_authorization.json|\
              cloud/task_105_fast_pipeline_phase5/phase5_receipt.json|\
              cloud/task_105_fast_pipeline_phase5/CRITICAL_ADAPTER_REPORT.md|\
              cloud/latest_status.md|\
              cloud/owner_reply.md) ;;
              *) echo "UNEXPECTED_WRITE_SCOPE: $path"; exit 1 ;;
            esac
          done

      - name: Commit bounded CRITICAL evidence
        shell: bash
        run: |
          set -euo pipefail
          paths=(
            cloud/task_105_fast_pipeline_phase5/critical_acceptance_results.json
            cloud/task_105_fast_pipeline_phase5/critical_manifest.json
            cloud/task_105_fast_pipeline_phase5/critical_request.json
            cloud/task_105_fast_pipeline_phase5/gate_a_receipt.json
            cloud/task_105_fast_pipeline_phase5/gate_b_authorization.json
            cloud/task_105_fast_pipeline_phase5/phase5_receipt.json
            cloud/task_105_fast_pipeline_phase5/CRITICAL_ADAPTER_REPORT.md
            cloud/latest_status.md
            cloud/owner_reply.md
          )
          for path in "${paths[@]}"; do
            test -e "$path" && git add -- "$path"
          done
          git config user.name 'ua-art-critical-adapter-v2'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task105: accept corrected strict CRITICAL adapter'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin task105-fast-pipeline-phase0
            if ! git rebase origin/task105-fast-pipeline-phase0; then
              git rebase --abort || true
              exit 1
            fi
            if git push origin HEAD:task105-fast-pipeline-phase0; then exit 0; fi
            test "$attempt" -lt 6 || exit 1
            sleep $((attempt * 3))
          done

      - name: Upload Phase 5 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task105-critical-adapter-v2-${{ github.run_id }}
          path: |
            cloud/task_105_fast_pipeline_phase5/critical_acceptance_results.json
            cloud/task_105_fast_pipeline_phase5/CRITICAL_ADAPTER_REPORT.md
            cloud/task_105_fast_pipeline_phase5/phase5_receipt.json
          if-no-files-found: warn
          retention-days: 14
