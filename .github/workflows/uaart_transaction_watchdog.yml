          import os
          import pathlib
          import sys

          artifact = pathlib.Path(os.environ['ARTIFACT_FILE'])
          if artifact.is_symlink() or not artifact.is_file():
              raise SystemExit('WATCHDOG_ARTIFACT_NOT_REGULAR')
          raw = artifact.read_bytes()
          if not raw or len(raw) > 65536:
              raise SystemExit('WATCHDOG_ARTIFACT_SIZE')

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError('duplicate key: ' + str(key))
                  value[key] = item
              return value

          try:
              value = json.loads(raw.decode('utf-8'), object_pairs_hook=strict_object)
          except (UnicodeDecodeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit('WATCHDOG_ARTIFACT_JSON') from exc
          if not isinstance(value, dict):
              raise SystemExit('WATCHDOG_ARTIFACT_OBJECT')
          canonical = (
              json.dumps(value, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
              + '\n'
          ).encode('utf-8')
          if raw != canonical:
              raise SystemExit('WATCHDOG_ARTIFACT_NOT_CANONICAL')

          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root / 'automation'))
