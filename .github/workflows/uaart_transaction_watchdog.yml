              raise SystemExit('RECOVERY_BOOTSTRAP_FILE_SET')
          total = 0
          for path in sorted(expected_paths):
              expected = files[path]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('RECOVERY_BOOTSTRAP_HASH:' + path)
              data = blob(path)
              total += len(data)
              if total > 16 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('RECOVERY_BOOTSTRAP_FILE_BINDING:' + path)
          print('UAART_RECOVERY_RUNTIME_CLOSURE_VALIDATED')
          PY

