              raise SystemExit('WATCHDOG_FINALIZE_RECEIPT_PREEXISTING')
          if destination.parent.is_symlink() or not destination.parent.is_dir():
              raise SystemExit('WATCHDOG_FINALIZE_RECEIPT_PARENT')
