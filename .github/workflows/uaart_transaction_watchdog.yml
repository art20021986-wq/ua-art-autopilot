name: UA ART Production Transaction Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current durable transaction state
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Discover one orphan only after the writer lock is free
        id: orphan
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error -m py_compile \
            automation/control_plane.py \
            automation/execution_contract.py \
            automation/transaction_watchdog.py
          python3 automation/control_plane.py verify-mode --require AUTOMATIC
          python3 automation/transaction_watchdog.py discover

      - name: Execute exact pinned rollback for orphaned transaction
        if: steps.orphan.outputs.has_pending == 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ steps.orphan.outputs.backup_manifest_sha256 }}
          UAART_REQUEST_PATH: ${{ steps.orphan.outputs.request_path }}
          UAART_REQUEST_SHA256: ${{ steps.orphan.outputs.request_sha256 }}
          UAART_RUN_ID: ${{ steps.orphan.outputs.run_id }}
          UAART_TASK_CLASS: CRITICAL
          UAART_TASK_ID: ${{ steps.orphan.outputs.task_id }}
          UAART_TRANSACTION_ID: ${{ steps.orphan.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/execution_contract.py rollback "$UAART_REQUEST_PATH" \
            --expected-class CRITICAL
          python3 automation/execution_contract.py rollback-receipt "$UAART_REQUEST_PATH" \
            --expected-class CRITICAL >/tmp/uaart-watchdog-rollback.json
          python3 automation/control_plane.py transaction-close "$UAART_REQUEST_PATH" \
            --run-id "$UAART_RUN_ID" \
            --transaction-id "$UAART_TRANSACTION_ID" \
            --outcome ROLLED_BACK
          python3 automation/control_plane.py fail "$UAART_REQUEST_PATH" \
            --run-id "$UAART_RUN_ID" \
            --message "Orphaned Production transaction recovered by watchdog" \
            --rollback-confirmed
          python3 automation/control_plane.py halt "$UAART_REQUEST_PATH" \
            --run-id "$UAART_RUN_ID" \
            --reason "Orphaned Production transaction required watchdog rollback"

      - name: Persist rollback and emergency halt
        if: steps.orphan.outputs.has_pending == 'true'
        env:
          REQUEST_PATH: ${{ steps.orphan.outputs.request_path }}
          TRANSACTION_PATH: ${{ steps.orphan.outputs.transaction_path }}
        shell: bash
        run: |
          set -euo pipefail
          claim_path="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          transaction = json.loads(Path(os.environ['TRANSACTION_PATH']).read_text(encoding='utf-8'))
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          print('state/claims/%s.%s.%s.json' % (
              request['task_id'], transaction['request_sha256'], transaction['run_id']))
          PY
          )"
          rollback_receipt="$(python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          request = json.loads(Path(os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          print(request['execution']['rollback_receipt_path'])
          PY
          )"
          git add -- "$TRANSACTION_PATH" "$claim_path" "$rollback_receipt" state/AUTOPILOT_HALT.json
          git config user.name 'ua-art-production-watchdog'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m "uaart watchdog: rollback ${{ steps.orphan.outputs.task_id }} and halt"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Halt on watchdog rollback failure
        if: failure() && steps.orphan.outputs.has_pending == 'true'
        continue-on-error: true
        env:
          UAART_REQUEST_PATH: ${{ steps.orphan.outputs.request_path }}
          UAART_RUN_ID: ${{ steps.orphan.outputs.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python3 automation/control_plane.py halt "$UAART_REQUEST_PATH" \
            --run-id "$UAART_RUN_ID" \
            --reason "Production watchdog rollback failed in run ${GITHUB_RUN_ID}"
          git add -- state/AUTOPILOT_HALT.json
          git config user.name 'ua-art-production-watchdog'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'uaart watchdog: emergency halt after rollback failure'
          git pull --rebase origin main
          git push origin HEAD:main
