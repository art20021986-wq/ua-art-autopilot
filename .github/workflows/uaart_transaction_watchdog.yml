          sys.path.insert(0, str(root / 'automation'))
          import execution_contract as ec
          import transaction_watchdog as watchdog

          value = watchdog.discover()
          if (
              value.get('transaction_status') != 'OPEN'
              or value.get('request_path') != os.environ['EXPECTED_REQUEST_PATH']
              or str(value.get('run_id')) != os.environ['EXPECTED_RUN_ID']
              or value.get('transaction_id') != os.environ['EXPECTED_TRANSACTION_ID']
              or value.get('transaction_path') != os.environ['EXPECTED_TRANSACTION_PATH']
              or value.get('claim_path') != os.environ['EXPECTED_CLAIM_PATH']
          ):
              raise SystemExit('WATCHDOG_ROLLBACK_MARK_REVALIDATION')
          spec = ec.validate_execution(os.environ['EXPECTED_REQUEST_PATH'], 'CRITICAL')
          receipt = ec.absolute_repo_path(spec.rollback_receipt_path)
          if receipt.exists() or receipt.is_symlink():
              raise SystemExit('WATCHDOG_ROLLBACK_MARK_RECEIPT_EXISTS')
          PY
            python3 -I automation/control_plane.py transaction-rollback-start \
              "$EXPECTED_REQUEST_PATH" \
              --run-id "$EXPECTED_RUN_ID" \
              --transaction-id "$EXPECTED_TRANSACTION_ID"
            rm -f -- "$INDEX"
            GIT_INDEX_FILE="$INDEX" git read-tree "$PARENT"
            for path in "$EXPECTED_CLAIM_PATH" "$EXPECTED_TRANSACTION_PATH"; do
              test -f "$path" && test ! -L "$path"
              BLOB="$(git hash-object -w -- "$path")"
              GIT_INDEX_FILE="$INDEX" git update-index --add \
                --cacheinfo "100644,${BLOB},${path}"
            done
            TREE="$(GIT_INDEX_FILE="$INDEX" git write-tree)"
            export GIT_AUTHOR_NAME='ua-art-production-watchdog'
            export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            COMMIT="$(printf '%s\n' \
              "uaart watchdog: arm rollback ${TASK_ID} ${GITHUB_RUN_ID}" | \
              git commit-tree "$TREE" -p "$PARENT")"
            COMMIT="$COMMIT" PARENT="$PARENT" python3 -I - <<'PY'
          import os
          import subprocess

          expected = {
              os.environ['EXPECTED_CLAIM_PATH'],
              os.environ['EXPECTED_TRANSACTION_PATH'],
          }
          changed = {
              item.decode('utf-8')
              for item in subprocess.check_output([
                  'git', 'diff-tree', '--no-commit-id', '--name-only', '-r', '-z',
                  os.environ['PARENT'], os.environ['COMMIT'],
              ]).split(b'\0')
              if item
          }
          if changed != expected:
              raise SystemExit('WATCHDOG_ROLLBACK_MARK_COMMIT_SCOPE')
          PY
            cd "$GITHUB_WORKSPACE"
            LAST_COMMIT="$COMMIT"
            if git_with_auth push origin "$COMMIT:refs/heads/main"; then
              echo 'marked=true' >>"$GITHUB_OUTPUT"
              unset AUTH_HEADER GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep "$((attempt * 3))"
          done
          unset AUTH_HEADER GH_TOKEN
          exit 1

  rollback_open:
    needs: [discover, mark_rollback]
    if: >-
      github.ref == 'refs/heads/main' &&
      github.run_attempt == 1 &&
      needs.discover.outputs.transaction_status == 'OPEN' &&
      needs.mark_rollback.outputs.marked == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: production
    outputs:
      artifact_name: ${{ steps.artifact.outputs.artifact_name }}
    env:
      CLAIM_PATH: ${{ needs.discover.outputs.claim_path }}
      EXPECTED_REQUEST_PATH: ${{ needs.discover.outputs.request_path }}
      EXPECTED_REQUEST_SHA256: ${{ needs.discover.outputs.request_sha256 }}
      EXPECTED_RUN_ID: ${{ needs.discover.outputs.run_id }}
      EXPECTED_TASK_ID: ${{ needs.discover.outputs.task_id }}
      EXPECTED_TRANSACTION_ID: ${{ needs.discover.outputs.transaction_id }}
      EXPECTED_TRANSACTION_PATH: ${{ needs.discover.outputs.transaction_path }}
      PINNED_ROOT: ${{ github.workspace }}/../uaart-watchdog-pinned-recovery
      SOURCE_COMMIT: ${{ needs.discover.outputs.source_commit }}
    steps:
      - name: Checkout fresh ROLLING_BACK state without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Revalidate the one armed rollback identity
        id: orphan
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
          test ! -e "$PINNED_ROOT"
          git -c core.hooksPath=/dev/null worktree add --detach \
            "$PINNED_ROOT" "$SOURCE_COMMIT"
          test "$(git -C "$PINNED_ROOT" rev-parse HEAD)" = "$SOURCE_COMMIT"

          python3 -I - <<'PY'
          import json, os, pathlib, re

          source_root = pathlib.Path.cwd().resolve()
          pinned_root = pathlib.Path(os.environ['PINNED_ROOT']).resolve()

          def load(relative, label):
              if not isinstance(relative, str) or not re.fullmatch(r'[A-Za-z0-9._/-]+', relative):
                  raise SystemExit(label + '_PATH')
              pure = pathlib.PurePosixPath(relative)
              if pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit(label + '_PATH')
              path = source_root / pure
              if path.is_symlink() or not path.is_file() or not path.resolve().is_relative_to(source_root):
                  raise SystemExit(label + '_FILE')
              if any(parent.is_symlink() for parent in path.parents if parent != source_root):
                  raise SystemExit(label + '_SYMLINK')
              data = path.read_bytes()
              if len(data) > 2 * 1024 * 1024:
                  raise SystemExit(label + '_SIZE')
              try:
                  value = json.loads(data.decode('utf-8'))
              except (UnicodeDecodeError, json.JSONDecodeError) as exc:
                  raise SystemExit(label + '_JSON') from exc
              if not isinstance(value, dict):
                  raise SystemExit(label + '_OBJECT')
              return pure, data, value

          claim_rel, claim_data, claim = load(os.environ['CLAIM_PATH'], 'PINNED_CLAIM')
          tx_rel, tx_data, transaction = load(
              os.environ['EXPECTED_TRANSACTION_PATH'], 'PINNED_TRANSACTION'
          )
          request_rel, request_data, _ = load(
              os.environ['EXPECTED_REQUEST_PATH'], 'PINNED_REQUEST'
          )
          ledger_rel, ledger_data, _ = load(
              claim.get('autostart_ledger_path'), 'PINNED_LEDGER'
          )
          backup_rel, backup_data, _ = load(
              transaction.get('backup_receipt_path'), 'PINNED_BACKUP'
          )
          if claim.get('autostart_source_commit') != os.environ['SOURCE_COMMIT']:
              raise SystemExit('PINNED_SOURCE_COMMIT_BINDING')
          if transaction.get('request_path') != os.environ['EXPECTED_REQUEST_PATH']:
              raise SystemExit('PINNED_REQUEST_BINDING')
          items = {
              claim_rel: claim_data,
              tx_rel: tx_data,
              request_rel: request_data,
              ledger_rel: ledger_data,
              backup_rel: backup_data,
          }
          if len(items) != 5:
              raise SystemExit('PINNED_DURABLE_PATH_ALIAS')
          for relative, data in items.items():
              target = pinned_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              if any(parent.is_symlink() for parent in target.parents if parent != pinned_root):
                  raise SystemExit('PINNED_DESTINATION_SYMLINK')
              target.write_bytes(data)
          print('UAART_PINNED_DURABLE_STATE_COPIED')
          PY

          cd "$PINNED_ROOT"
          python3 -I - <<'PY'
          import hashlib, json, pathlib, re

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('PINNED_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }
          root = pathlib.Path.cwd().resolve()
          path = root / 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          if path.is_symlink() or not path.is_file():
              raise SystemExit('PINNED_RUNTIME_MANIFEST_FILE')
          manifest = json.loads(path.read_bytes(), object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('PINNED_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('PINNED_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('PINNED_RUNTIME_FILE_SET')
          total = 0
          for relative, expected in files.items():
              pure = pathlib.PurePosixPath(relative)
              if not re.fullmatch(r'[A-Za-z0-9._/-]+', relative) or pure.is_absolute() or '..' in pure.parts:
                  raise SystemExit('PINNED_RUNTIME_PATH')
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('PINNED_RUNTIME_HASH')
              target = root / pure
              if target.is_symlink() or not target.is_file() or target.resolve() != target:
                  raise SystemExit('PINNED_RUNTIME_TARGET:' + relative)
              data = target.read_bytes()
              total += len(data)
              if len(data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('PINNED_RUNTIME_SIZE')
              if hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('PINNED_RUNTIME_FILE_SHA:' + relative)
          print('UAART_PINNED_RUNTIME_CLOSURE_VALIDATED')
          PY
          python3 -I automation/control_plane.py verify-mode \
            --require AUTOMATIC --allow-halt-for-recovery
          python3 -I automation/control_plane.py verify-request \
            "$EXPECTED_REQUEST_PATH" --sha256 "$EXPECTED_REQUEST_SHA256"
          python3 -I automation/execution_contract.py validate \
            "$EXPECTED_REQUEST_PATH" --expected-class CRITICAL \
            >"$RUNNER_TEMP/uaart-watchdog-contract.json"
          python3 -I automation/transaction_watchdog.py discover
          echo 'UAART_PINNED_RECOVERY_IDENTITY_VALIDATED'

      - name: Confirm ROLLING_BACK identity has no durable receipt
        id: pinned
        env:
          ACTUAL_REQUEST_PATH: ${{ steps.orphan.outputs.request_path }}
          ACTUAL_RUN_ID: ${{ steps.orphan.outputs.run_id }}
          ACTUAL_SOURCE_COMMIT: ${{ steps.orphan.outputs.source_commit }}
          ACTUAL_TASK_ID: ${{ steps.orphan.outputs.task_id }}
          ACTUAL_TRANSACTION_ID: ${{ steps.orphan.outputs.transaction_id }}
          ACTUAL_TRANSACTION_PATH: ${{ steps.orphan.outputs.transaction_path }}
          ACTUAL_TRANSACTION_STATUS: ${{ steps.orphan.outputs.transaction_status }}
          EXPECTED_REQUEST_SHA256: ${{ needs.discover.outputs.request_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_TRANSACTION_STATUS" = 'ROLLING_BACK'
          test "$ACTUAL_REQUEST_PATH" = "$EXPECTED_REQUEST_PATH"
          test "$ACTUAL_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$ACTUAL_TASK_ID" = "$EXPECTED_TASK_ID"
          test "$ACTUAL_TRANSACTION_ID" = "$EXPECTED_TRANSACTION_ID"
          test "$ACTUAL_TRANSACTION_PATH" = "$EXPECTED_TRANSACTION_PATH"
          test "$ACTUAL_SOURCE_COMMIT" = "$SOURCE_COMMIT"
          cd "$PINNED_ROOT"
          python3 -I - <<'PY'
          import json, os, pathlib
          value = json.load(open(
              os.environ['RUNNER_TEMP'] + '/uaart-watchdog-contract.json',
              encoding='utf-8',
          ))
          if value.get('request_sha256') != os.environ['EXPECTED_REQUEST_SHA256']:
              raise SystemExit('WATCHDOG_PINNED_REQUEST_SHA')
          relative = value.get('rollback_receipt_path')
          if not isinstance(relative, str):
              raise SystemExit('WATCHDOG_ROLLBACK_RECEIPT_PATH_MISSING')
          receipt = pathlib.Path.cwd() / pathlib.PurePosixPath(relative)
          if receipt.exists() or receipt.is_symlink():
              raise SystemExit('WATCHDOG_ROLLBACK_RECEIPT_ALREADY_EXISTS')
          PY
          echo 'validated=true' >>"$GITHUB_OUTPUT"

      # UAART_TRANSACTION_ID is the target-side idempotency key. The durable
      # ROLLING_BACK state prevents later schedules and run reruns from invoking
      # this generic controller again. A crash after this step is HALT/manual.
      - name: Execute the single armed rollback attempt
        if: >-
          github.run_attempt == 1 &&
          needs.mark_rollback.outputs.marked == 'true' &&
          needs.discover.outputs.transaction_status == 'OPEN' &&
          steps.orphan.outputs.transaction_status == 'ROLLING_BACK' &&
          steps.orphan.outputs.source_commit == needs.discover.outputs.source_commit &&
          steps.pinned.outputs.validated == 'true'
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ needs.discover.outputs.backup_manifest_sha256 }}
          UAART_IDEMPOTENCY_KEY: ${{ needs.discover.outputs.transaction_id }}
          UAART_REQUEST_PATH: ${{ needs.discover.outputs.request_path }}
          UAART_REQUEST_SHA256: ${{ needs.discover.outputs.request_sha256 }}
          UAART_RUN_ID: ${{ needs.discover.outputs.run_id }}
          UAART_TASK_CLASS: CRITICAL
          UAART_TASK_ID: ${{ needs.discover.outputs.task_id }}
          UAART_TRANSACTION_ID: ${{ needs.discover.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = '1'
          cd "$PINNED_ROOT"
          python3 -I automation/execution_contract.py rollback "$UAART_REQUEST_PATH" \
            --expected-class CRITICAL
          python3 -I automation/execution_contract.py rollback-receipt "$UAART_REQUEST_PATH" \
            --expected-class CRITICAL

      - name: Canonicalize rollback receipt as a data-only artifact
        id: artifact
        env:
          ARTIFACT_NAME: uaart-watchdog-rollback-${{ needs.discover.outputs.transaction_id }}-${{ github.run_attempt }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ needs.discover.outputs.backup_manifest_sha256 }}
          UAART_REQUEST_PATH: ${{ needs.discover.outputs.request_path }}
          UAART_RUN_ID: ${{ needs.discover.outputs.run_id }}
          UAART_TRANSACTION_ID: ${{ needs.discover.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/uaart-watchdog-rollback"
          mkdir -p -- "$artifact_dir"
          cd "$PINNED_ROOT"
          ARTIFACT_FILE="$artifact_dir/rollback-receipt.json" python3 -I - <<'PY'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root / 'automation'))
          import execution_contract as ec

          spec = ec.validate_execution(os.environ['UAART_REQUEST_PATH'], 'CRITICAL')
          value = ec.validate_rollback_receipt(spec)
          canonical = (
              json.dumps(value, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
              + '\n'
          ).encode('utf-8')
          if len(canonical) > 65536:
              raise SystemExit('WATCHDOG_ROLLBACK_RECEIPT_TOO_LARGE')
          pathlib.Path(os.environ['ARTIFACT_FILE']).write_bytes(canonical)
          PY
          echo "artifact_name=$ARTIFACT_NAME" >>"$GITHUB_OUTPUT"

      - name: Upload only the canonical rollback receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ steps.artifact.outputs.artifact_name }}
          path: ${{ runner.temp }}/uaart-watchdog-rollback/rollback-receipt.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  finalize_rollback:
    needs: [discover, mark_rollback, rollback_open]
    if: >-
      always() &&
      github.ref == 'refs/heads/main' &&
      needs.mark_rollback.outputs.marked == 'true' &&
      needs.rollback_open.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout fresh main for trusted recovery persistence
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Bind source-pinned writer runtime before repo Python
        env:
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          TARGET_COMMIT="$(/usr/bin/git rev-parse HEAD)"
          /usr/bin/git merge-base --is-ancestor \
            "$WORKFLOW_SOURCE_COMMIT" "$TARGET_COMMIT"
          SOURCE_COMMIT="$WORKFLOW_SOURCE_COMMIT" \
          TARGET_COMMIT="$TARGET_COMMIT" /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('WATCHDOG_WRITER_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          def blob(commit, path):
              entry = subprocess.check_output(
                  ['/usr/bin/git', 'ls-tree', commit, '--', path], text=True
              ).rstrip('\n')
              header, separator, actual = entry.partition('\t')
              if separator != '\t' or actual != path:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_PATH:' + path)
              mode, kind, oid = header.split()
              if mode != '100644' or kind != 'blob' or not re.fullmatch(r'[0-9a-f]{40}', oid):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_MODE:' + path)
              return subprocess.check_output(['/usr/bin/git', 'cat-file', 'blob', oid])

          source = os.environ['SOURCE_COMMIT']
          target = os.environ['TARGET_COMMIT']
          manifest_path = 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          source_manifest = blob(source, manifest_path)
          if source_manifest != blob(target, manifest_path) or len(source_manifest) > 1024 * 1024:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_BINDING')
          manifest = json.loads(source_manifest, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_SET')
          total = 0
          for path in sorted(expected_paths):
              expected = files[path]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_HASH:' + path)
              source_data = blob(source, path)
              target_data = blob(target, path)
              total += len(source_data)
              if len(source_data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_SIZE:' + path)
              if source_data != target_data or hashlib.sha256(source_data).hexdigest() != expected:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_BINDING:' + path)
          print('UAART_SOURCE_PINNED_WRITER_RUNTIME_VALIDATED')
          PY

      - name: Download rollback receipt outside the workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ needs.rollback_open.outputs.artifact_name }}
          path: ${{ runner.temp }}/uaart-watchdog-download

      - name: Strictly validate and install data-only rollback receipt
        id: artifact
        env:
          ARTIFACT_FILE: ${{ runner.temp }}/uaart-watchdog-download/rollback-receipt.json
          EXPECTED_REQUEST_PATH: ${{ needs.discover.outputs.request_path }}
          EXPECTED_RUN_ID: ${{ needs.discover.outputs.run_id }}
          EXPECTED_TRANSACTION_ID: ${{ needs.discover.outputs.transaction_id }}
          EXPECTED_TRANSACTION_PATH: ${{ needs.discover.outputs.transaction_path }}
          UAART_BACKUP_MANIFEST_SHA256: ${{ needs.discover.outputs.backup_manifest_sha256 }}
          UAART_REQUEST_PATH: ${{ needs.discover.outputs.request_path }}
          UAART_RUN_ID: ${{ needs.discover.outputs.run_id }}
          UAART_TRANSACTION_ID: ${{ needs.discover.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -I automation/control_plane.py verify-mode \
            --require AUTOMATIC \
            --allow-halt-for-recovery
          python3 -I - <<'PY'
          import json
          import os
          import pathlib
          import sys

          artifact = pathlib.Path(os.environ['ARTIFACT_FILE'])
          if artifact.is_symlink() or not artifact.is_file():
              raise SystemExit('WATCHDOG_ARTIFACT_NOT_REGULAR')
          raw = artifact.read_bytes()
          if not raw or len(raw) > 65536:
              raise SystemExit('WATCHDOG_ARTIFACT_SIZE')

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise ValueError('duplicate key: ' + str(key))
                  value[key] = item
              return value

          try:
              value = json.loads(raw.decode('utf-8'), object_pairs_hook=strict_object)
          except (UnicodeDecodeError, ValueError, json.JSONDecodeError) as exc:
              raise SystemExit('WATCHDOG_ARTIFACT_JSON') from exc
          if not isinstance(value, dict):
              raise SystemExit('WATCHDOG_ARTIFACT_OBJECT')
          canonical = (
              json.dumps(value, ensure_ascii=False, separators=(',', ':'), sort_keys=True)
