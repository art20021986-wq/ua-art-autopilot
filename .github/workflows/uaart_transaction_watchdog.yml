        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | /usr/bin/base64 -w0)"
          unset GH_TOKEN
          trap 'unset AUTH_HEADER GH_TOKEN' EXIT
          git_with_auth() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}" \
              /usr/bin/git -c core.hooksPath=/dev/null "$@"
          }
          [[ "$PARENT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HALT_SHA256" =~ ^[0-9a-f]{64}$ ]]
