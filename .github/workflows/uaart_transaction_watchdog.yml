          /usr/bin/git merge-base --is-ancestor "$PARENT" "$COMMIT"
          mapfile -d '' CHANGED < <(/usr/bin/git diff-tree --no-commit-id --name-only -r -z "$PARENT" "$COMMIT")
          test "${#CHANGED[@]}" -eq "${#EXPECTED_PATHS[@]}"
          for index in "${!EXPECTED_PATHS[@]}"; do
            test "${CHANGED[$index]}" = "${EXPECTED_PATHS[$index]}"
          done
          /usr/bin/git diff --quiet "$PARENT" "$COMMIT" -- 'state/AUTOPILOT_HALT.json'
          PUSH_STATUS=0
          git_with_auth push origin "$COMMIT:refs/heads/main" --force-with-lease="refs/heads/main:$PARENT" || PUSH_STATUS=$?
          # Readback resolves a lost success response without a second write.
          git_with_auth fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
          ACCEPTED="$(/usr/bin/git rev-parse refs/remotes/origin/main)"
          /usr/bin/git merge-base --is-ancestor "$COMMIT" "$ACCEPTED"
          /usr/bin/git diff --quiet "$COMMIT" "$ACCEPTED" -- "${EXPECTED_PATHS[@]}"
          RUNTIME_PATHS=(
            'state/AUTOPILOT_RUNTIME_MANIFEST.json'
            'state/EXECUTION_MODE.json'
            'state/MANUAL_MODE.md'
            'state/receipts/TASK107-R2.json'
            'tasks/approvals/TASK107-R2-AUTOMATIC-MODE.json'
            'state/runtime_activations/UA-ART-RECOVERY-TASK120-002.json'
            'state/runtime_activations/UA-ART-RECOVERY-TASK120-002.previous-manifest.json'
            'state/runtime_activations/UA-ART-RECOVERY-TASK120-002.previous-mode.json'
            '.github/workflows/uaart_autostart.yml'
            '.github/workflows/uaart_orchestrator.yml'
            '.github/workflows/uaart_fast.yml'
            '.github/workflows/uaart_standard.yml'
            '.github/workflows/uaart_critical.yml'
            '.github/workflows/uaart_backup.yml'
            '.github/workflows/uaart_maintenance.yml'
            '.github/workflows/uaart_monitor.yml'
            '.github/workflows/uaart_transaction_watchdog.yml'
            'automation/autostart_intake.py'
            'automation/control_plane.py'
            'automation/critical_adapter.py'
            'automation/execution_contract.py'
            'automation/production_queue.py'
            'automation/task_orchestrator.py'
            'automation/task_ticket.py'
            'automation/transaction_watchdog.py'
            'state/schemas/task_request.schema.json'
          )
          /usr/bin/git diff --quiet "$PARENT" "$ACCEPTED" -- "${RUNTIME_PATHS[@]}"
          printf '%s\n' 'UAART_RECOVERY_ACCEPTED_RUNTIME_UNCHANGED'
          /usr/bin/git diff --quiet "$PARENT" "$ACCEPTED" -- 'state/AUTOPILOT_HALT.json'
          unset GIT_INDEX_FILE AUTH_HEADER GH_TOKEN
          test ! -e "$PROPOSAL_DIR/remote-readback.json" && test ! -L "$PROPOSAL_DIR/remote-readback.json"
          (
            set -o noclobber
            /usr/bin/jq -n \
              --arg task_id 'UA-ART-RECOVERY-TASK120-002' \
              --arg parent_commit "$PARENT" \
              --arg result_commit "$COMMIT" \
              --arg observed_remote_main "$ACCEPTED" \
              --arg observed_at "$(/usr/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              --arg run_id "$GITHUB_RUN_ID" \
              '{schema_version:"UA-ART-RECOVERY-REMOTE-READBACK-1", task_id:$task_id,
                parent_commit:$parent_commit, result_commit:$result_commit,
                observed_remote_main:$observed_remote_main, observed_at:$observed_at,
                run_id:$run_id, status:"PASS", live_write_verified:true,
                accepted_runtime_unchanged:true, mutation_paths_verified:true}' \
              > "$PROPOSAL_DIR/remote-readback.json"
          )
          printf 'commit=%s\naccepted_commit=%s\npush_status=%s\n' "$COMMIT" "$ACCEPTED" "$PUSH_STATUS" >> "$GITHUB_OUTPUT"
          printf 'Exact Git CAS and remote readback completed: %s\n' "$COMMIT"

      - name: Verify accepted immutable recovery commit
        if: steps.persist.outcome == 'success' && steps.proposal.outputs.ready == 'true'
        env:
          PARENT: ${{ steps.proposal.outputs.parent_commit }}
          ACCEPTED_COMMIT: ${{ steps.persist.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I automation/transaction_watchdog.py recovery-verify \
            --expected-main "$PARENT" \
            --proposal "$RUNNER_TEMP/uaart-recovery-proposal/proposal.json" \
            --result-commit "$ACCEPTED_COMMIT" \
            --output "$RUNNER_TEMP/uaart-recovery-verification"

      - name: Preserve TASK120 recovery plan and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task120-recovery-canary-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/uaart-recovery-queue
            ${{ runner.temp }}/uaart-recovery-proposal
            ${{ runner.temp }}/uaart-recovery-verification
          if-no-files-found: ignore
          retention-days: 14

  recovery_execute:
    if: >-
      github.ref == 'refs/heads/main' &&
      github.repository == 'art20021986-wq/ua-art-autopilot' &&
      github.repository_id == '1346296029' &&
      github.run_attempt == 1 &&
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'execute' &&
      github.actor == 'art20021986-wq' &&
      github.actor_id == '321059821' &&
      github.triggering_actor == 'art20021986-wq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
      EXPECTED_MAIN: ${{ inputs.expected_main }}
    steps:
      - name: Checkout authoritative main for TASK120 recovery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Bind exact reviewed recovery runtime before repository Python
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'art20021986-wq/ua-art-autopilot'
          test "$GITHUB_REPOSITORY_ID" = '1346296029'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_WORKFLOW_REF" = 'art20021986-wq/ua-art-autopilot/.github/workflows/uaart_transaction_watchdog.yml@refs/heads/main'
          test "$GITHUB_RUN_ATTEMPT" = '1'
          if test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'; then
            test "$GITHUB_ACTOR" = 'art20021986-wq'
            test "$GITHUB_ACTOR_ID" = '321059821'
            test "$GITHUB_TRIGGERING_ACTOR" = 'art20021986-wq'
          elif test "$GITHUB_EVENT_NAME" = 'schedule' || test "$GITHUB_EVENT_NAME" = 'push'; then
            if test "$GITHUB_EVENT_NAME" = 'push'; then
              test "$GITHUB_ACTOR" = 'art20021986-wq'
              test "$GITHUB_ACTOR_ID" = '321059821'
              test "$GITHUB_TRIGGERING_ACTOR" = 'art20021986-wq'
            fi
            test -z "$EXPECTED_MAIN"
            EXPECTED_MAIN="$(/usr/bin/git rev-parse HEAD)"
          else
            exit 1
          fi
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_MAIN" =~ ^[0-9a-f]{40}$ ]]
          test "$WORKFLOW_SOURCE_COMMIT" = "$EXPECTED_MAIN"
          test "$WORKFLOW_SOURCE_COMMIT" = "$(/usr/bin/git rev-parse HEAD)"
          test -z "$(/usr/bin/git status --porcelain=v1 --untracked-files=all)"
          /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess

          root = pathlib.Path.cwd()
          source = os.environ['WORKFLOW_SOURCE_COMMIT']
          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }

          def strict_object(pairs):
              result = {}
              for key, value in pairs:
                  if key in result:
                      raise SystemExit('RECOVERY_BOOTSTRAP_DUPLICATE_KEY')
                  result[key] = value
              return result

          def blob(path):
              target = root / path
              if target.resolve() != target or not target.is_file():
                  raise SystemExit('RECOVERY_BOOTSTRAP_UNSAFE_PATH:' + path)
              entry = subprocess.check_output(
                  ['/usr/bin/git', 'ls-tree', source, '--', path], text=True
              ).rstrip('\n')
              head, separator, actual = entry.partition('\t')
              if separator != '\t' or actual != path:
                  raise SystemExit('RECOVERY_BOOTSTRAP_PATH:' + path)
              mode, kind, oid = head.split()
              if mode != '100644' or kind != 'blob' or not re.fullmatch(r'[0-9a-f]{40}', oid):
                  raise SystemExit('RECOVERY_BOOTSTRAP_MODE:' + path)
              data = subprocess.check_output(['/usr/bin/git', 'cat-file', 'blob', oid])
              if len(data) > 2 * 1024 * 1024 or data != target.read_bytes():
                  raise SystemExit('RECOVERY_BOOTSTRAP_WORKTREE_BINDING:' + path)
              return data

          raw = blob('state/AUTOPILOT_RUNTIME_MANIFEST.json')
          manifest = json.loads(raw, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('RECOVERY_BOOTSTRAP_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('RECOVERY_BOOTSTRAP_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('RECOVERY_BOOTSTRAP_FILE_SET')
          total = 0
          for path in sorted(expected_paths):
              expected = files[path]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('RECOVERY_BOOTSTRAP_HASH:' + path)
              data = blob(path)
              total += len(data)
              if total > 16 * 1024 * 1024 or hashlib.sha256(data).hexdigest() != expected:
                  raise SystemExit('RECOVERY_BOOTSTRAP_FILE_BINDING:' + path)
          print('UAART_RECOVERY_RUNTIME_CLOSURE_VALIDATED')
          PY

      - name: Capture complete current Actions queue using GET only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'unset GH_TOKEN' EXIT
          QUEUE_DIR="$RUNNER_TEMP/uaart-recovery-queue"
          mkdir -m 700 "$QUEUE_DIR"
          CAPTURE_STARTED_AT="$(/usr/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')"
          for status in pending queued in_progress requested waiting; do
            /usr/bin/gh api --hostname github.com --method GET --paginate --slurp \
              -H 'Accept: application/vnd.github+json' \
              "/repos/art20021986-wq/ua-art-autopilot/actions/runs?status=${status}&per_page=100" \
              > "$QUEUE_DIR/${status}.json"
          done
          unset GH_TOKEN
          CAPTURE_FINISHED_AT="$(/usr/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')"
          PARENT="$(/usr/bin/git rev-parse HEAD)"
          /usr/bin/jq -n \
            --arg repository 'art20021986-wq/ua-art-autopilot' \
            --arg expected_main "$PARENT" \
            --arg capture_started_at "$CAPTURE_STARTED_AT" \
            --arg capture_finished_at "$CAPTURE_FINISHED_AT" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{schema_version:"UA-ART-RECOVERY-QUEUE-CAPTURE-1", repository:$repository,
              expected_main:$expected_main, capture_started_at:$capture_started_at,
              capture_finished_at:$capture_finished_at, run_id:$run_id}' \
            > "$QUEUE_DIR/metadata.json"

      - name: Validate TASK120 identity and prepare fixed data only
        id: proposal
        env:
          PLAN_SHA256: ${{ inputs.plan_sha256 }}
          OWNER_CONFIRMATION: ${{ inputs.owner_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          if test "$GITHUB_EVENT_NAME" = 'schedule' || test "$GITHUB_EVENT_NAME" = 'push'; then
            EXPECTED_MAIN="$(/usr/bin/git rev-parse HEAD)"
          fi
          python3 -I automation/transaction_watchdog.py recovery-execute   --expected-main "$EXPECTED_MAIN"   --queue-dir "$RUNNER_TEMP/uaart-recovery-queue"   --output "$RUNNER_TEMP/uaart-recovery-proposal"   --plan-sha256 "$PLAN_SHA256"   --owner-confirmation "$OWNER_CONFIRMATION"

      - name: Persist exact recovery execute tree with one main compare-and-swap
        id: persist
        if: steps.proposal.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT: ${{ steps.proposal.outputs.parent_commit }}
          RECEIPT_SHA256: ${{ steps.proposal.outputs.receipt_sha256 }}
          HALT_SHA256: ${{ steps.proposal.outputs.halt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | /usr/bin/base64 -w0)"
          unset GH_TOKEN
          trap 'unset AUTH_HEADER GH_TOKEN' EXIT
          git_with_auth() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}" \
              /usr/bin/git -c core.hooksPath=/dev/null "$@"
          }
          [[ "$PARENT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RECEIPT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$HALT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$WORKFLOW_SOURCE_COMMIT" = "$PARENT"
          test "$PARENT" = "$(/usr/bin/git rev-parse HEAD)"
          PROPOSAL_DIR="$RUNNER_TEMP/uaart-recovery-proposal"
          test -d "$PROPOSAL_DIR" && test ! -L "$PROPOSAL_DIR"
          test -f "$PROPOSAL_DIR/receipt.json" && test ! -L "$PROPOSAL_DIR/receipt.json"
          test "$RECEIPT_SHA256" = "$(/usr/bin/sha256sum "$PROPOSAL_DIR/receipt.json" | /usr/bin/cut -d ' ' -f 1)"
          test "$HALT_SHA256" = "$(/usr/bin/git show "$PARENT:state/AUTOPILOT_HALT.json" | /usr/bin/sha256sum | /usr/bin/cut -d ' ' -f 1)"
          # No retries, no rebasing and no replacement parent: this is an exact main CAS.
          git_with_auth fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
          test "$PARENT" = "$(/usr/bin/git rev-parse refs/remotes/origin/main)"
          GIT_INDEX_FILE="$RUNNER_TEMP/uaart-recovery-index"
          test ! -e "$GIT_INDEX_FILE" && test ! -L "$GIT_INDEX_FILE"
          export GIT_INDEX_FILE
          /usr/bin/git read-tree "$PARENT"
          EXPECTED_PATHS=(
            'state/AUTOPILOT_HALT.json'
            'state/halt_history/UA-ART-RECOVERY-TASK120-002/halt.json'
            'state/halt_history/UA-ART-RECOVERY-TASK120-002/receipt.json'
          )
          test -f "$PROPOSAL_DIR/halt.json" && test ! -L "$PROPOSAL_DIR/halt.json"
          test "$HALT_SHA256" = "$(/usr/bin/sha256sum "$PROPOSAL_DIR/halt.json" | /usr/bin/cut -d ' ' -f 1)"
          test -z "$(/usr/bin/git ls-tree "$PARENT" -- "${EXPECTED_PATHS[1]}" "${EXPECTED_PATHS[2]}")"
          HALT_BLOB="$(/usr/bin/git hash-object -w -- "$PROPOSAL_DIR/halt.json")"
          RECEIPT_BLOB="$(/usr/bin/git hash-object -w -- "$PROPOSAL_DIR/receipt.json")"
          /usr/bin/git update-index --force-remove -- 'state/AUTOPILOT_HALT.json'
          /usr/bin/git update-index --add --cacheinfo "100644,${HALT_BLOB},${EXPECTED_PATHS[1]}"
          /usr/bin/git update-index --add --cacheinfo "100644,${RECEIPT_BLOB},${EXPECTED_PATHS[2]}"
          TREE="$(/usr/bin/git write-tree)"
          export GIT_AUTHOR_NAME='ua-art-recovery-route'
          export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          COMMIT="$(printf '%s\n' 'uaart recovery: archive exact TASK120 halt after owner command' | /usr/bin/git commit-tree "$TREE" -p "$PARENT")"
          test "$(/usr/bin/git show -s --format=%P "$COMMIT")" = "$PARENT"
          /usr/bin/git merge-base --is-ancestor "$PARENT" "$COMMIT"
          mapfile -d '' CHANGED < <(/usr/bin/git diff-tree --no-commit-id --name-only -r -z "$PARENT" "$COMMIT")
          test "${#CHANGED[@]}" -eq "${#EXPECTED_PATHS[@]}"
          for index in "${!EXPECTED_PATHS[@]}"; do
            test "${CHANGED[$index]}" = "${EXPECTED_PATHS[$index]}"
          done
          test -z "$(/usr/bin/git ls-tree "$COMMIT" -- 'state/AUTOPILOT_HALT.json')"
          test "$(/usr/bin/git rev-parse "$PARENT:state/AUTOPILOT_HALT.json")" = "$(/usr/bin/git rev-parse "$COMMIT:state/halt_history/UA-ART-RECOVERY-TASK120-002/halt.json")"
          PUSH_STATUS=0
          git_with_auth push origin "$COMMIT:refs/heads/main" --force-with-lease="refs/heads/main:$PARENT" || PUSH_STATUS=$?
          # Readback resolves a lost success response without a second write.
          git_with_auth fetch --no-tags origin 'refs/heads/main:refs/remotes/origin/main'
          ACCEPTED="$(/usr/bin/git rev-parse refs/remotes/origin/main)"
          /usr/bin/git merge-base --is-ancestor "$COMMIT" "$ACCEPTED"
          /usr/bin/git diff --quiet "$COMMIT" "$ACCEPTED" -- "${EXPECTED_PATHS[@]}"
          RUNTIME_PATHS=(
            'state/AUTOPILOT_RUNTIME_MANIFEST.json'
            'state/EXECUTION_MODE.json'
            'state/MANUAL_MODE.md'
            'state/receipts/TASK107-R2.json'
            'tasks/approvals/TASK107-R2-AUTOMATIC-MODE.json'
            'state/runtime_activations/UA-ART-RECOVERY-TASK120-002.json'
            'state/runtime_activations/UA-ART-RECOVERY-TASK120-002.previous-manifest.json'
            'state/runtime_activations/UA-ART-RECOVERY-TASK120-002.previous-mode.json'
            '.github/workflows/uaart_autostart.yml'
            '.github/workflows/uaart_orchestrator.yml'
            '.github/workflows/uaart_fast.yml'
            '.github/workflows/uaart_standard.yml'
            '.github/workflows/uaart_critical.yml'
            '.github/workflows/uaart_backup.yml'
            '.github/workflows/uaart_maintenance.yml'
            '.github/workflows/uaart_monitor.yml'
            '.github/workflows/uaart_transaction_watchdog.yml'
            'automation/autostart_intake.py'
            'automation/control_plane.py'
            'automation/critical_adapter.py'
            'automation/execution_contract.py'
            'automation/production_queue.py'
            'automation/task_orchestrator.py'
            'automation/task_ticket.py'
            'automation/transaction_watchdog.py'
            'state/schemas/task_request.schema.json'
          )
          /usr/bin/git diff --quiet "$PARENT" "$ACCEPTED" -- "${RUNTIME_PATHS[@]}"
          printf '%s\n' 'UAART_RECOVERY_ACCEPTED_RUNTIME_UNCHANGED'
          test -z "$(/usr/bin/git ls-tree "$ACCEPTED" -- 'state/AUTOPILOT_HALT.json')"
          unset GIT_INDEX_FILE AUTH_HEADER GH_TOKEN
          test ! -e "$PROPOSAL_DIR/remote-readback.json" && test ! -L "$PROPOSAL_DIR/remote-readback.json"
          (
            set -o noclobber
            /usr/bin/jq -n \
              --arg task_id 'UA-ART-RECOVERY-TASK120-002' \
              --arg parent_commit "$PARENT" \
              --arg result_commit "$COMMIT" \
              --arg observed_remote_main "$ACCEPTED" \
              --arg observed_at "$(/usr/bin/date -u '+%Y-%m-%dT%H:%M:%SZ')" \
              --arg run_id "$GITHUB_RUN_ID" \
              '{schema_version:"UA-ART-RECOVERY-REMOTE-READBACK-1", task_id:$task_id,
                parent_commit:$parent_commit, result_commit:$result_commit,
                observed_remote_main:$observed_remote_main, observed_at:$observed_at,
                run_id:$run_id, status:"PASS", live_write_verified:true,
                accepted_runtime_unchanged:true, mutation_paths_verified:true}' \
              > "$PROPOSAL_DIR/remote-readback.json"
          )
          printf 'commit=%s\naccepted_commit=%s\npush_status=%s\n' "$COMMIT" "$ACCEPTED" "$PUSH_STATUS" >> "$GITHUB_OUTPUT"
          printf 'Exact Git CAS and remote readback completed: %s\n' "$COMMIT"

      - name: Verify accepted immutable recovery commit
        if: steps.persist.outcome == 'success' && steps.proposal.outputs.ready == 'true'
        env:
          PARENT: ${{ steps.proposal.outputs.parent_commit }}
          ACCEPTED_COMMIT: ${{ steps.persist.outputs.commit }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I automation/transaction_watchdog.py recovery-verify \
            --expected-main "$PARENT" \
            --proposal "$RUNNER_TEMP/uaart-recovery-proposal/proposal.json" \
            --result-commit "$ACCEPTED_COMMIT" \
            --output "$RUNNER_TEMP/uaart-recovery-verification"

      - name: Preserve TASK120 recovery plan and execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: task120-recovery-execute-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/uaart-recovery-queue
            ${{ runner.temp }}/uaart-recovery-proposal
            ${{ runner.temp }}/uaart-recovery-verification
          if-no-files-found: ignore
          retention-days: 14
