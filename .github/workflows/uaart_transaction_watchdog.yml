      - name: Persist exact recovery canary tree with one main compare-and-swap
        id: persist
        if: steps.proposal.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT: ${{ steps.proposal.outputs.parent_commit }}
          RECEIPT_SHA256: ${{ steps.proposal.outputs.receipt_sha256 }}
          HALT_SHA256: ${{ steps.proposal.outputs.halt_sha256 }}
