name: UA ART Production Transaction Watchdog

on:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: ua-art-production-writer
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      backup_manifest_sha256: ${{ steps.orphan.outputs.backup_manifest_sha256 }}
      claim_path: ${{ steps.orphan.outputs.claim_path }}
      halt_present: ${{ steps.safety.outputs.halt_present }}
      request_path: ${{ steps.orphan.outputs.request_path }}
      request_sha256: ${{ steps.orphan.outputs.request_sha256 }}
      rollback_receipt_present: ${{ steps.safety.outputs.rollback_receipt_present }}
      run_id: ${{ steps.orphan.outputs.run_id }}
      source_commit: ${{ steps.orphan.outputs.source_commit }}
      task_id: ${{ steps.orphan.outputs.task_id }}
      transaction_id: ${{ steps.orphan.outputs.transaction_id }}
      transaction_path: ${{ steps.orphan.outputs.transaction_path }}
      transaction_status: ${{ steps.orphan.outputs.transaction_status }}
    steps:
      - name: Checkout authoritative main transaction state read-only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Discover one recoverable transaction from authoritative main
        id: orphan
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git branch --show-current)" = 'main'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -I -W error -m py_compile \
            automation/control_plane.py \
            automation/execution_contract.py \
            automation/transaction_watchdog.py
          python3 -I automation/control_plane.py verify-mode \
            --require AUTOMATIC \
            --allow-halt-for-recovery
          python3 -I automation/transaction_watchdog.py discover

      - name: Reject ambiguous OPEN state before any rollback is armed
        id: safety
        if: steps.orphan.outputs.transaction_status != 'NONE'
        env:
          UAART_REQUEST_PATH: ${{ steps.orphan.outputs.request_path }}
          UAART_TRANSACTION_STATUS: ${{ steps.orphan.outputs.transaction_status }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd().resolve()
          sys.path.insert(0, str(root / 'automation'))
          import execution_contract as ec

          status = os.environ['UAART_TRANSACTION_STATUS']
          halt_path = root / 'state/AUTOPILOT_HALT.json'
          if halt_path.is_symlink():
              raise SystemExit('WATCHDOG_HALT_SYMLINK')
          halt_present = halt_path.is_file()

          spec = ec.validate_execution(os.environ['UAART_REQUEST_PATH'], 'CRITICAL')
          if spec.rollback_receipt_path is None:
              raise SystemExit('WATCHDOG_ROLLBACK_RECEIPT_PATH_MISSING')
          rollback_path = ec.absolute_repo_path(spec.rollback_receipt_path)
          if rollback_path.is_symlink():
              raise SystemExit('WATCHDOG_ROLLBACK_RECEIPT_SYMLINK')
          rollback_present = rollback_path.is_file()
          if rollback_path.exists() and not rollback_present:
              raise SystemExit('WATCHDOG_ROLLBACK_RECEIPT_NOT_REGULAR')

          # OPEN must not have a rollback receipt. A receipt is created only
          # after the durable OPEN -> ROLLING_BACK transition.
          if status == 'OPEN' and rollback_present:
              raise SystemExit('WATCHDOG_OPEN_HAS_ROLLBACK_RECEIPT')

          with pathlib.Path(os.environ['GITHUB_OUTPUT']).open(
              'a', encoding='utf-8'
          ) as handle:
              handle.write('halt_present=%s\n' % str(halt_present).lower())
              handle.write(
                  'rollback_receipt_present=%s\n'
                  % str(rollback_present).lower()
              )
          PY

  halt_discovery_failure:
    needs: discover
    if: always() && github.ref == 'refs/heads/main' && needs.discover.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout clean main for fail-closed system halt
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Bind source-pinned writer runtime before repo Python
        env:
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          TARGET_COMMIT="$(/usr/bin/git rev-parse HEAD)"
          /usr/bin/git merge-base --is-ancestor \
            "$WORKFLOW_SOURCE_COMMIT" "$TARGET_COMMIT"
          SOURCE_COMMIT="$WORKFLOW_SOURCE_COMMIT" \
          TARGET_COMMIT="$TARGET_COMMIT" /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('WATCHDOG_WRITER_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          def blob(commit, path):
              entry = subprocess.check_output(
                  ['/usr/bin/git', 'ls-tree', commit, '--', path], text=True
              ).rstrip('\n')
              header, separator, actual = entry.partition('\t')
              if separator != '\t' or actual != path:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_PATH:' + path)
              mode, kind, oid = header.split()
              if mode != '100644' or kind != 'blob' or not re.fullmatch(r'[0-9a-f]{40}', oid):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_MODE:' + path)
              return subprocess.check_output(['/usr/bin/git', 'cat-file', 'blob', oid])

          source = os.environ['SOURCE_COMMIT']
          target = os.environ['TARGET_COMMIT']
          manifest_path = 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          source_manifest = blob(source, manifest_path)
          if source_manifest != blob(target, manifest_path) or len(source_manifest) > 1024 * 1024:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_BINDING')
          manifest = json.loads(source_manifest, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_SET')
          total = 0
          for path in sorted(expected_paths):
              expected = files[path]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_HASH:' + path)
              source_data = blob(source, path)
              target_data = blob(target, path)
              total += len(source_data)
              if len(source_data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_SIZE:' + path)
              if source_data != target_data or hashlib.sha256(source_data).hexdigest() != expected:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_BINDING:' + path)
          print('UAART_SOURCE_PINNED_WRITER_RUNTIME_VALIDATED')
          PY

      - name: Generate system halt after untrustworthy discovery
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          python3 -I automation/control_plane.py halt-system \
            --run-id "$GITHUB_RUN_ID" \
            --reason "Production watchdog discovery failed in run ${GITHUB_RUN_ID}"
          python3 -I - <<'PY'
          import subprocess

          raw = subprocess.check_output(
              ['git', 'status', '--porcelain=v1', '-z', '--untracked-files=all']
          )
          actual = {item[3:].decode('utf-8') for item in raw.split(b'\0') if item}
          if actual - {'state/AUTOPILOT_HALT.json'}:
              raise SystemExit('WATCHDOG_HALT_UNEXPECTED_DIFF:' + ','.join(sorted(actual)))
          PY

      - name: Persist exact system halt to main
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          unset GH_TOKEN
          git_with_auth() {
            GIT_CONFIG_COUNT=1 \
            GIT_CONFIG_KEY_0='http.https://github.com/.extraheader' \
            GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${AUTH_HEADER}" \
              git "$@"
          }
          validate_writer_runtime() {
            local target="$1"
            [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            [[ "$target" =~ ^[0-9a-f]{40}$ ]]
            /usr/bin/git merge-base --is-ancestor \
              "$WORKFLOW_SOURCE_COMMIT" "$target"
            SOURCE_COMMIT="$WORKFLOW_SOURCE_COMMIT" \
            TARGET_COMMIT="$target" /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('WATCHDOG_WRITER_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          def blob(commit, path):
              entry = subprocess.check_output(
                  ['/usr/bin/git', 'ls-tree', commit, '--', path], text=True
              ).rstrip('\n')
              header, separator, actual = entry.partition('\t')
              if separator != '\t' or actual != path:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_PATH:' + path)
              mode, kind, oid = header.split()
              if mode != '100644' or kind != 'blob' or not re.fullmatch(r'[0-9a-f]{40}', oid):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_MODE:' + path)
              return subprocess.check_output(['/usr/bin/git', 'cat-file', 'blob', oid])

          source = os.environ['SOURCE_COMMIT']
          target = os.environ['TARGET_COMMIT']
          manifest_path = 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          source_manifest = blob(source, manifest_path)
          if source_manifest != blob(target, manifest_path) or len(source_manifest) > 1024 * 1024:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_BINDING')
          manifest = json.loads(source_manifest, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_SET')
          total = 0
          for path in sorted(expected_paths):
              expected = files[path]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_HASH:' + path)
              source_data = blob(source, path)
              target_data = blob(target, path)
              total += len(source_data)
              if len(source_data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_SIZE:' + path)
              if source_data != target_data or hashlib.sha256(source_data).hexdigest() != expected:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_BINDING:' + path)
          print('UAART_SOURCE_PINNED_WRITER_RUNTIME_VALIDATED')
          PY
          }
          RUNTIME_PATHS=(
            state/AUTOPILOT_RUNTIME_MANIFEST.json
            .github/workflows/uaart_autostart.yml
            .github/workflows/uaart_orchestrator.yml
            .github/workflows/uaart_fast.yml
            .github/workflows/uaart_standard.yml
            .github/workflows/uaart_critical.yml
            .github/workflows/uaart_backup.yml
            .github/workflows/uaart_maintenance.yml
            .github/workflows/uaart_monitor.yml
            .github/workflows/uaart_transaction_watchdog.yml
            automation/autostart_intake.py
            automation/control_plane.py
            automation/critical_adapter.py
            automation/execution_contract.py
            automation/production_queue.py
            automation/task_orchestrator.py
            automation/task_ticket.py
            automation/transaction_watchdog.py
            state/schemas/task_request.schema.json
          )
          LAST_COMMIT='' # system-halt
          for attempt in 1 2 3 4 5 6; do
            if ! git_with_auth fetch --force --no-tags origin \
              'refs/heads/main:refs/remotes/origin/main'; then
              test "$attempt" -lt 6 || exit 1
              sleep "$((attempt * 3))"
              continue
            fi
            PARENT="$(git rev-parse refs/remotes/origin/main)"
            if test -n "$LAST_COMMIT" && \
              git merge-base --is-ancestor "$LAST_COMMIT" "$PARENT"; then
              mapfile -d '' ACCEPTED_PATHS < <(git diff-tree --no-commit-id \
                --name-only -r -z "$LAST_COMMIT")
              test "${#ACCEPTED_PATHS[@]}" -gt 0
              git diff --quiet "$LAST_COMMIT" "$PARENT" -- "${ACCEPTED_PATHS[@]}" || exit 1
              unset AUTH_HEADER GH_TOKEN
              exit 0
            fi
            git diff --quiet "$WORKFLOW_SOURCE_COMMIT" "$PARENT" -- "${RUNTIME_PATHS[@]}"
            validate_writer_runtime "$PARENT"
            REBUILD="$RUNNER_TEMP/uaart-watchdog-system-halt-rebuild-${attempt}"
            INDEX="$RUNNER_TEMP/uaart-watchdog-system-halt-index-${attempt}"
            git -c core.hooksPath=/dev/null worktree add --detach "$REBUILD" "$PARENT"
            cd "$REBUILD"
            python3 -I automation/control_plane.py halt-system \
              --run-id "$GITHUB_RUN_ID" \
              --reason "Production watchdog discovery failed in run ${GITHUB_RUN_ID}"
            rm -f -- "$INDEX"
            GIT_INDEX_FILE="$INDEX" git read-tree "$PARENT"
            BLOB="$(git hash-object -w -- state/AUTOPILOT_HALT.json)"
            GIT_INDEX_FILE="$INDEX" git update-index --add \
              --cacheinfo "100644,${BLOB},state/AUTOPILOT_HALT.json"
            TREE="$(GIT_INDEX_FILE="$INDEX" git write-tree)"
            if test "$TREE" = "$(git rev-parse "${PARENT}^{tree}")"; then
              unset AUTH_HEADER GH_TOKEN
              exit 0
            fi
            export GIT_AUTHOR_NAME='ua-art-production-watchdog'
            export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
            export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
            export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
            COMMIT="$(printf '%s\n' 'uaart watchdog: halt after invalid discovery' | \
              git commit-tree "$TREE" -p "$PARENT")"
            mapfile -d '' CHANGED < <(git diff-tree --no-commit-id --name-only \
              -r -z "$PARENT" "$COMMIT")
            test "${#CHANGED[@]}" -eq 1
            test "${CHANGED[0]}" = 'state/AUTOPILOT_HALT.json'
            cd "$GITHUB_WORKSPACE"
            LAST_COMMIT="$COMMIT"
            if git_with_auth push origin "$COMMIT:refs/heads/main"; then
              unset AUTH_HEADER GH_TOKEN
              exit 0
            fi
            test "$attempt" -lt 6 || exit 1
            sleep "$((attempt * 3))"
          done
          unset AUTH_HEADER GH_TOKEN
          exit 1

  halt_preparing:
    needs: discover
    if: >-
      github.ref == 'refs/heads/main' &&
      needs.discover.outputs.transaction_status == 'PREPARING' &&
      needs.discover.outputs.halt_present == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout clean main to halt incomplete preparation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: main
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Bind source-pinned writer runtime before repo Python
        env:
          WORKFLOW_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          [[ "$WORKFLOW_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          TARGET_COMMIT="$(/usr/bin/git rev-parse HEAD)"
          /usr/bin/git merge-base --is-ancestor \
            "$WORKFLOW_SOURCE_COMMIT" "$TARGET_COMMIT"
          SOURCE_COMMIT="$WORKFLOW_SOURCE_COMMIT" \
          TARGET_COMMIT="$TARGET_COMMIT" /usr/bin/python3 -I - <<'PY'
          import hashlib
          import json
          import os
          import re
          import subprocess

          expected_paths = {
              '.github/workflows/uaart_autostart.yml',
              '.github/workflows/uaart_orchestrator.yml',
              '.github/workflows/uaart_fast.yml',
              '.github/workflows/uaart_standard.yml',
              '.github/workflows/uaart_critical.yml',
              '.github/workflows/uaart_backup.yml',
              '.github/workflows/uaart_maintenance.yml',
              '.github/workflows/uaart_monitor.yml',
              '.github/workflows/uaart_transaction_watchdog.yml',
              'automation/autostart_intake.py',
              'automation/control_plane.py',
              'automation/critical_adapter.py',
              'automation/execution_contract.py',
              'automation/production_queue.py',
              'automation/task_orchestrator.py',
              'automation/task_ticket.py',
              'automation/transaction_watchdog.py',
              'state/schemas/task_request.schema.json',
          }

          def strict_object(pairs):
              value = {}
              for key, item in pairs:
                  if key in value:
                      raise SystemExit('WATCHDOG_WRITER_RUNTIME_DUPLICATE_KEY')
                  value[key] = item
              return value

          def blob(commit, path):
              entry = subprocess.check_output(
                  ['/usr/bin/git', 'ls-tree', commit, '--', path], text=True
              ).rstrip('\n')
              header, separator, actual = entry.partition('\t')
              if separator != '\t' or actual != path:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_PATH:' + path)
              mode, kind, oid = header.split()
              if mode != '100644' or kind != 'blob' or not re.fullmatch(r'[0-9a-f]{40}', oid):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_MODE:' + path)
              return subprocess.check_output(['/usr/bin/git', 'cat-file', 'blob', oid])

          source = os.environ['SOURCE_COMMIT']
          target = os.environ['TARGET_COMMIT']
          manifest_path = 'state/AUTOPILOT_RUNTIME_MANIFEST.json'
          source_manifest = blob(source, manifest_path)
          if source_manifest != blob(target, manifest_path) or len(source_manifest) > 1024 * 1024:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_BINDING')
          manifest = json.loads(source_manifest, object_pairs_hook=strict_object)
          if set(manifest) != {'files', 'generated_at', 'mode_epoch', 'schema_version'}:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_KEYS')
          if manifest.get('schema_version') != 'UA-ART-AUTOPILOT-RUNTIME-MANIFEST-1':
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_MANIFEST_SCHEMA')
          files = manifest.get('files')
          if not isinstance(files, dict) or set(files) != expected_paths:
              raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_SET')
          total = 0
          for path in sorted(expected_paths):
              expected = files[path]
              if not isinstance(expected, str) or not re.fullmatch(r'[0-9a-f]{64}', expected):
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_HASH:' + path)
              source_data = blob(source, path)
              target_data = blob(target, path)
              total += len(source_data)
              if len(source_data) > 2 * 1024 * 1024 or total > 16 * 1024 * 1024:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_SIZE:' + path)
              if source_data != target_data or hashlib.sha256(source_data).hexdigest() != expected:
                  raise SystemExit('WATCHDOG_WRITER_RUNTIME_FILE_BINDING:' + path)
          print('UAART_SOURCE_PINNED_WRITER_RUNTIME_VALIDATED')
          PY

      - name: Revalidate PREPARING from fresh main
        id: orphan
        shell: bash
        run: |
          set -euo pipefail
          python3 -I automation/control_plane.py verify-mode \
            --require AUTOMATIC \
            --allow-halt-for-recovery
          python3 -I automation/transaction_watchdog.py discover

      - name: Generate halt for incomplete Production preparation
        env:
          ACTUAL_REQUEST_PATH: ${{ steps.orphan.outputs.request_path }}
          ACTUAL_RUN_ID: ${{ steps.orphan.outputs.run_id }}
          ACTUAL_TRANSACTION_ID: ${{ steps.orphan.outputs.transaction_id }}
          ACTUAL_TRANSACTION_STATUS: ${{ steps.orphan.outputs.transaction_status }}
          EXPECTED_REQUEST_PATH: ${{ needs.discover.outputs.request_path }}
          EXPECTED_RUN_ID: ${{ needs.discover.outputs.run_id }}
          EXPECTED_TRANSACTION_ID: ${{ needs.discover.outputs.transaction_id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$ACTUAL_TRANSACTION_STATUS" = 'PREPARING'
          test "$ACTUAL_REQUEST_PATH" = "$EXPECTED_REQUEST_PATH"
          test "$ACTUAL_RUN_ID" = "$EXPECTED_RUN_ID"
          test "$ACTUAL_TRANSACTION_ID" = "$EXPECTED_TRANSACTION_ID"
          python3 -I automation/control_plane.py halt "$EXPECTED_REQUEST_PATH" \
            --run-id "$EXPECTED_RUN_ID" \
            --reason 'Production backup preparation was interrupted; no write is allowed'
          python3 -I - <<'PY'
          import subprocess

          raw = subprocess.check_output(
