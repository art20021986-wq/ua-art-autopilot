          EXPECTED_PATHS=('state/recovery_route_receipts/UA-ART-RECOVERY-TASK120-002.json')
          test -z "$(/usr/bin/git ls-tree "$PARENT" -- "${EXPECTED_PATHS[0]}")"
          RECEIPT_BLOB="$(/usr/bin/git hash-object -w -- "$PROPOSAL_DIR/receipt.json")"
          /usr/bin/git update-index --add --cacheinfo "100644,${RECEIPT_BLOB},${EXPECTED_PATHS[0]}"
          TREE="$(/usr/bin/git write-tree)"
          export GIT_AUTHOR_NAME='ua-art-recovery-route'
          export GIT_AUTHOR_EMAIL='actions@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          COMMIT="$(printf '%s\n' 'uaart recovery: register verified canary with HALT preserved' | /usr/bin/git commit-tree "$TREE" -p "$PARENT")"
