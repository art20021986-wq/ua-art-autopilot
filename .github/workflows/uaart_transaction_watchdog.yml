          test -d "$PROPOSAL_DIR" && test ! -L "$PROPOSAL_DIR"
          test -f "$PROPOSAL_DIR/receipt.json" && test ! -L "$PROPOSAL_DIR/receipt.json"
          test "$RECEIPT_SHA256" = "$(/usr/bin/sha256sum "$PROPOSAL_DIR/receipt.json" | /usr/bin/cut -d ' ' -f 1)"
