name: task062-read-voice-context

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task062_read_voice_context.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: task062-read-voice-context
  cancel-in-progress: false

jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Compile probe
        run: python3 -m py_compile cloud/task_062/read_voice_context.py
      - name: Read bounded production context
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_062/read_voice_context.py
      - name: Enforce read-only evidence
        run: |
          python3 - <<'PY'
          import json
          path='cloud/task_062/evidence/voice_context.json'
          data=json.load(open(path, encoding='utf-8'))
          assert data['production_touched'] is False
          assert len(data['production_bot_tasks']) == 1
          assert data['files']['team_bot.py']['sha256'] == '0dddd71ceb64d0397cf94faad994f85494032173cc025adf3e1634da0652abd0'
          print('TASK062_READ_ONLY_PASS')
          PY
      - name: Commit evidence
        run: |
          git add -- cloud/task_062/evidence/voice_context.json
          git config user.name 'task062-read-only'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_062: record read-only voice context'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 3))
          done
