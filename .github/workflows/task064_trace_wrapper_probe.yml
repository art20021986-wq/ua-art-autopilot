name: task064-trace-wrapper-probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task064_trace_wrapper_probe.yml'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 0
      - name: Read bounded wrapper context
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: python3 cloud/task_064/read_trace_wrapper.py
      - name: Commit evidence
        run: |
          python3 -m json.tool cloud/task_064/evidence/trace_wrapper.json >/dev/null
          git add -- cloud/task_064/evidence/trace_wrapper.json
          git config user.name 'task064-trace-read'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'task_064: record trace wrapper context'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then break; fi
            if [ "$attempt" -eq 5 ]; then exit 1; fi
            sleep $((attempt * 2))
          done
