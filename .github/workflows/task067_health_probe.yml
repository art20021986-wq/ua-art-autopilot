name: task067-crm-online-guard-health-probe
# probe-revision: 15

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task067_health_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded production health
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import ast, hashlib, json, os, re, urllib.error, urllib.parse, urllib.request
          root = '/home/Carix'
          state = root + '/autopilot_inbox/cloud/task_067'
          base = 'https://www.pythonanywhere.com/api/v0/user/Carix/'
          headers = {'Authorization': 'Token ' + os.environ['PYTHONANYWHERE_API_TOKEN'],
                     'User-Agent': 'task067-bounded-health-probe'}
          def request(endpoint, missing=False, limit=5_000_000):
              url = base + endpoint
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                      data = response.read(limit + 1)
                      if len(data) > limit:
                          raise RuntimeError('RESPONSE_TOO_LARGE')
                      return data
              except urllib.error.HTTPError as exc:
                  if missing and exc.code == 404:
                      return None
                  raise
          def get(path, missing=False, limit=5_000_000):
              return request('files/path' + urllib.parse.quote(path, safe='/'), missing, limit)
          def redacted(line):
              line = re.sub(r'\b\d{8,}:[A-Za-z0-9_-]{20,}\b', '<redacted-token>', line)
              return re.sub(r'(?i)(token\s*[=:]\s*)[^\s,;]+', r'\1<redacted>', line)[-700:]
          result = {'task_id': 'task_067', 'receipts': {}}
          for name in ('shadow', 'install', 'postcheck', 'soak', 'rollback'):
              raw = get(state + '/' + name + '_receipt.json', missing=True)
              if raw:
                  value = json.loads(raw.decode('utf-8'))
                  result['receipts'][name] = {
                      'status': value.get('status'), 'mode': value.get('mode'),
                      'started_at_utc': value.get('started_at_utc'),
                      'finished_at_utc': value.get('finished_at_utc'),
                      'errors': value.get('errors') or value.get('p0') or [],
                  }
          source = get(root + '/cars_ui.py')
          result['production'] = {
              'cars_ui_sha256': hashlib.sha256(source).hexdigest(),
              'v1_3_marker': b'CRM-ONLINE-GUARD-001-V1.3' in source,
          }
          status_raw = get(root + '/.crm_guard_status.json', missing=True)
          if status_raw:
              status = json.loads(status_raw.decode('utf-8'))
              result['guard'] = {
                  'contract_id': status.get('contract_id'),
                  'generated_at_utc': status.get('generated_at_utc'),
                  'heartbeat_age_seconds': status.get('heartbeat_age_seconds'),
                  'spool': status.get('spool'), 'bots': status.get('bots'),
                  'llm_tokens': status.get('llm_tokens'),
              }
          raw_tasks = request('always_on/')
          tasks = json.loads(raw_tasks.decode('utf-8'))
          if isinstance(tasks, dict):
              tasks = tasks.get('tasks') or tasks.get('objects') or tasks.get('results') or []
          selected = []
          always_on_logs = {}
          for item in tasks if isinstance(tasks, list) else []:
              if not isinstance(item, dict):
                  continue
              command = str(item.get('command') or '').strip()
              description = str(item.get('description') or '')
              if command == 'python3.10 /home/Carix/start_safe.py' or description.startswith('task067'):
                  task_id = item.get('id')
                  detail = item
                  if task_id is not None:
                      try:
                          value = json.loads(request('always_on/%s/' % task_id).decode('utf-8'))
                          if isinstance(value, dict):
                              detail = value
                      except Exception as exc:
                          detail = dict(item)
                          detail['detail_error'] = type(exc).__name__
                  log_url = str(detail.get('logfile') or detail.get('log_file') or
                                item.get('logfile') or item.get('log_file') or '')
                  log_path = log_url
                  marker = '/files/var/log/'
                  if marker in log_url:
                      log_path = '/var/log/' + log_url.split(marker, 1)[1]
                  selected.append({
                      'id': task_id, 'command': command,
                      'description': description, 'enabled': item.get('enabled'),
                      'status': detail.get('status'), 'state': detail.get('state'),
                      'running': detail.get('running'), 'pid': detail.get('pid'),
                      'last_run': detail.get('last_run'),
                      'last_start': detail.get('last_start'),
                      'last_stop': detail.get('last_stop'),
                      'keys': sorted(str(key) for key in detail.keys()),
                      'logfile': log_path,
                  })
                  if log_path:
                      try:
                          raw = get(log_path, missing=True, limit=2_000_000)
                          if raw:
                              lines = raw.decode('utf-8', errors='replace').splitlines()[-160:]
                              always_on_logs[log_path.rsplit('/', 1)[-1]] = [redacted(line) for line in lines[-80:]]
                          else:
                              always_on_logs[log_path.rsplit('/', 1)[-1]] = ['LOG_NOT_FOUND']
                      except Exception as exc:
                          always_on_logs[log_path.rsplit('/', 1)[-1]] = ['LOG_READ_%s' % type(exc).__name__]
          result['always_on'] = selected
          result['always_on_logs'] = always_on_logs
          tree_raw = request('files/tree/?' + urllib.parse.urlencode({'path': root + '/'}), limit=2_000_000)
          tree = json.loads(tree_raw.decode('utf-8'))
          if isinstance(tree, dict):
              tree = tree.get('files') or tree.get('paths') or tree.get('objects') or []
          log_paths = sorted(str(path) for path in tree if isinstance(path, str)
                             and path.startswith(root + '/') and path.endswith('.log')
                             and '/backups/' not in path and '/.local/' not in path)[:20]
          signal = re.compile(r'Traceback|Error|Exception|database is locked|timed?\s*out|crm[_ -]?guard', re.I)
          log_signals = {}
          log_tails = {}
          for path in log_paths:
              raw = get(path, missing=True, limit=2_000_000)
              if not raw:
                  continue
              lines = raw.decode('utf-8', errors='replace').splitlines()[-1200:]
              log_tails[path.rsplit('/', 1)[-1]] = [redacted(line) for line in lines[-60:]]
              hits = [redacted(line) for line in lines if signal.search(line)]
              if hits:
                  log_signals[path.rsplit('/', 1)[-1]] = hits[-80:]
          result['runtime_logs'] = {'paths': [p.rsplit('/', 1)[-1] for p in log_paths],
                                    'signals': log_signals, 'tails': log_tails}
          db_source = get(root + '/db.py', limit=1_000_000).decode('utf-8')
          db_tree = ast.parse(db_source)
          db_selected = {}
          wanted = {'ZAMOK_OZHIDANIE', '_ua_fayl_zahvatit', '_ua_fayl_otpustit',
                    '_ua_sql_pishet', 'Soedinenie', 'connect', 'update_card_field'}
          for node in db_tree.body:
              names = []
              if isinstance(node, (ast.FunctionDef, ast.ClassDef)):
                  names = [node.name]
              elif isinstance(node, (ast.Assign, ast.AnnAssign)):
                  targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                  names = [target.id for target in targets if isinstance(target, ast.Name)]
              for name in names:
                  if name in wanted:
                      db_selected[name] = ast.get_source_segment(db_source, node)
          result['db_lock_contract'] = db_selected
          code_audit = {}
          requested = {
              'ai.py': {'transcribe', 'openai_key'},
              'ai_fast_schema.py': {'car_fields', 'fast_text_data', 'parsed_from_data', 'clean_car'},
              'local_ocr.py': {'fields_from_text'},
              'cars_ui.py': {'voice_change_plan', '_v167_voice_explicit_fields'},
          }
          for filename, selected_names in requested.items():
              module_source = get(root + '/' + filename, limit=2_000_000).decode('utf-8')
              module_tree = ast.parse(module_source)
              function_names = [node.name for node in module_tree.body
                                if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))]
              selected_sources = {}
              for node in module_tree.body:
                  if (isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                          and node.name in selected_names):
                      value = ast.get_source_segment(module_source, node) or ''
                      value = re.sub(r'\b\d{8,}:[A-Za-z0-9_-]{20,}\b', '<redacted-token>', value)
                      selected_sources[node.name] = value
              code_audit[filename] = {'functions': function_names,
                                      'selected': selected_sources}
          result['voice_code_audit'] = code_audit
          events_raw = get(root + '/.crm_guard_events.jsonl', missing=True, limit=2_000_000)
          if events_raw:
              events = []
              for line in events_raw.decode('utf-8', errors='replace').splitlines()[-40:]:
                  try:
                      item = json.loads(line)
                      events.append({key: item.get(key) for key in
                                     ('at', 'kind', 'action', 'status', 'component', 'detail')
                                     if item.get(key) is not None})
                  except Exception:
                      pass
              result['guard_events'] = events[-20:]
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          PY
