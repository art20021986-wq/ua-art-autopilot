name: task067-crm-online-guard-health-probe
# probe-revision: 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/task067_health_probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read bounded production health
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, urllib.error, urllib.parse, urllib.request
          root = '/home/Carix'
          state = root + '/autopilot_inbox/cloud/task_067'
          base = 'https://www.pythonanywhere.com/api/v0/user/Carix/'
          headers = {'Authorization': 'Token ' + os.environ['PYTHONANYWHERE_API_TOKEN'],
                     'User-Agent': 'task067-bounded-health-probe'}
          def get(path, missing=False):
              url = base + 'files/path' + urllib.parse.quote(path, safe='/')
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=20) as response:
                      return response.read(5_000_001)
              except urllib.error.HTTPError as exc:
                  if missing and exc.code == 404:
                      return None
                  raise
          result = {'task_id': 'task_067', 'receipts': {}}
          for name in ('shadow', 'install', 'postcheck', 'soak', 'rollback'):
              raw = get(state + '/' + name + '_receipt.json', missing=True)
              if raw:
                  value = json.loads(raw.decode('utf-8'))
                  result['receipts'][name] = {
                      'status': value.get('status'), 'mode': value.get('mode'),
                      'started_at_utc': value.get('started_at_utc'),
                      'finished_at_utc': value.get('finished_at_utc'),
                      'errors': value.get('errors') or value.get('p0') or [],
                  }
          source = get(root + '/cars_ui.py')
          result['production'] = {
              'cars_ui_sha256': hashlib.sha256(source).hexdigest(),
              'v1_3_marker': b'CRM-ONLINE-GUARD-001-V1.3' in source,
          }
          status_raw = get(root + '/.crm_guard_status.json', missing=True)
          if status_raw:
              status = json.loads(status_raw.decode('utf-8'))
              result['guard'] = {
                  'contract_id': status.get('contract_id'),
                  'generated_at_utc': status.get('generated_at_utc'),
                  'heartbeat_age_seconds': status.get('heartbeat_age_seconds'),
                  'spool': status.get('spool'), 'bots': status.get('bots'),
                  'llm_tokens': status.get('llm_tokens'),
              }
          print(json.dumps(result, ensure_ascii=False, indent=2, sort_keys=True))
          PY
