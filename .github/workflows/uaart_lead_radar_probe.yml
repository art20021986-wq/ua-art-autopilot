name: UA ART Lead Radar Probe (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Probe public Telegram sources (read-only, no secrets)
        run: python3 -I cloud/lead_radar_probe_001/probe.py
