name: PythonAnywhere Inbox Sync
# TASK 058 corrected read-only package sync trigger v2; no remote execution.

on:
  workflow_run:
    workflows: ['Claude Autopilot']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'automation/pythonanywhere_sync_v2.py'
      - '.github/workflows/pythonanywhere_sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonanywhere-inbox-sync
  cancel-in-progress: false

jobs:
  sync:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Static check filtered uploader
        run: python3 -m py_compile automation/pythonanywhere_sync_v2.py
      - name: Sync Claude-filtered outputs to PythonAnywhere safe inbox
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
          PYTHONANYWHERE_USERNAME: Carix
          PYTHONANYWHERE_HOST: www.pythonanywhere.com
          PYTHONANYWHERE_REMOTE_ROOT: /home/Carix/autopilot_inbox
          PYTHONANYWHERE_SYNC_MODE: claude_latest
        run: python3 automation/pythonanywhere_sync_v2.py
